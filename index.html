function discoverCombos(){
  for(const c of activeCombos(B.items)) if(!save.combos.includes(c.id)){
    save.combos.push(c.id); persist();
    toast(`New combo found: ${c.name}!`, 'combo');
  }
}

function gachaPull(n){
  const cost = n === 10 ? GACHA_COST * 9 : GACHA_COST;
  if(save.coins < cost) return;
  save.coins -= cost;
  lastPulls = [];
  for(let i = 0; i < n; i++){
    const roll = Math.random();
    const rarity = roll < 0.6 ? 1 : roll < 0.9 ? 2 : 3;
    const pool = Object.keys(ITEMS).filter(k => ITEMS[k].rarity === rarity);
    const id = pool[Math.floor(Math.random() * pool.length)];
    const isNew = !isUnlocked(id);
    if(isNew) save.unlocked.push(id); else save.coins += DUPE_REFUND;
    lastPulls.push({id, isNew});
  }
  persist();
}

hub.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  const act = t.dataset.act, id = t.dataset.id;
  if(act !== 'reset') resetArmed = false;
  switch(act){
    case 'title': showTitle(); return;
    case 'tab': tab = id; hub.scrollTop = 0; break;
    case 'stage': {
      const before = B.items.slice();
      B.stage = id; applyStageRules();
      const removed = before.filter(x => !B.items.includes(x)), added = B.items.filter(x => !before.includes(x));
      const msg = [];
      if(removed.length) msg.push('Removed ' + removed.map(x => ITEMS[x].name).join(', ') + ' (banned here)');
      if(added.length) msg.push('Added ' + added.map(x => ITEMS[x].name).join(', ') + ' (forced here)');
      if(msg.length) toast(msg.join(' · '));
      break;
    }
    case 'char': B.char = id; break;
    case 'filter': B.filter = id; break;
    case 'hideIntro': save.seenGuide = true; persist(); break;
    case 'clear': B.items = stageById(B.stage).forced.slice(); break;
    case 'item': {
      const st = stageById(B.stage), it = ITEMS[id];
      if(st.forced.includes(id)){ toast(`${it.name} is forced by this stage.`, 'bad'); return; }
      if(st.banned.includes(id) || !isUnlocked(id)) return;
      if(B.items.includes(id)) B.items = B.items.filter(x => x !== id);
      else {
        if(it.type === 'ability' && abilityCount(B.items) >= MAX_ABILITIES){ toast(`Ability slots are full (${MAX_ABILITIES}). Remove one first.`, 'bad'); return; }
        B.items.push(id);
      }
      discoverCombos();
      break;
    }
    case 'decks': openDecks(); return;
    case 'start': {
      const st = stageById(B.stage);
      if(validate(st, B.char, B.items).length) return;
      startRun(st, B.char, B.items.slice()); return;
    }
    case 'pull': gachaPull(+t.dataset.n); break;
    case 'reset':
      if(!resetArmed){ resetArmed = true; break; }
      resetArmed = false; save = defaultSave(); persist();
      B.stage = 's1'; B.char = 'mage'; B.items = STARTER_LOADOUT.slice(); lastPulls = []; break;
  }
  renderHub();
});

function openDecks(){
  mbox.className = 'mbox';
  mbox.innerHTML = `<h2>Saved loadouts</h2><p class="mnote">Save your current loadout, or load one. Loading adjusts it for the selected stage's forced and banned items.</p>
    <label class="lbl" for="deckName">Name for saving</label><input id="deckName" type="text" maxlength="24" placeholder="e.g. Glass cannon" value="${esc(B.deckName)}">
    <div class="decks">${save.decks.map((d, i) => `<div class="dk"><div class="dn">${d
      ? `<b>${CHARACTERS[d.char] ? ico(d.char) : ''} ${esc(d.name)}</b><span>${d.items.filter(x => ITEMS[x]).map(x => ico(x)).join('')}</span>`
      : `<span class="empty">Empty slot ${i + 1}</span>`}</div>
      ${d ? `<button class="btn sm" data-act="deckLoad" data-i="${i}">Load</button>` : ''}
      <button class="btn sm ${d ? 'ghost' : ''}" data-act="deckSave" data-i="${i}">${d ? 'Overwrite' : 'Save here'}</button>
      ${d ? `<button class="btn sm ghost" data-act="deckDel" data-i="${i}" aria-label="Delete ${esc(d.name)}">${ico('close')}</button>` : ''}</div>`).join('')}</div>
    <div class="mfoot"><button class="btn" data-act="close">Close</button></div>`;
  modal.hidden = false;
}
function closeModal(){ modal.hidden = true; }

modal.addEventListener('input', e => { if(e.target.id === 'deckName') B.deckName = e.target.value; });
modal.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if(pick){ pickOption(+pick.dataset.pick); return; }
  const t = e.target.closest('[data-act]');
  if(!t){ if(e.target === modal && !G) closeModal(); return; }
  if(t.disabled) return;
  const i = +t.dataset.i;
  switch(t.dataset.act){
    case 'close': closeModal(); break;
    case 'deckSave': {
      const name = B.deckName.trim() || save.decks[i]?.name || `Loadout ${i + 1}`;
      const st = stageById(B.stage);
      save.decks[i] = {name, char:B.char, items:B.items.filter(x => isUnlocked(x) || !st.forced.includes(x))};
      persist(); openDecks(); toast(`Saved “${name}”`); break;
    }
    case 'deckLoad': {
      const d = save.decks[i]; if(!d) return;
      B.char = save.chars.includes(d.char) ? d.char : 'mage';
      B.items = d.items.filter(x => ITEMS[x]);
      B.deckName = d.name;
      applyStageRules(); discoverCombos(); closeModal(); renderHub(); toast(`Loaded “${d.name}”`); break;
    }
    case 'deckDel': save.decks[i] = null; persist(); openDecks(); break;
    case 'reroll': if(G && G.state === 'levelup' && G.rerolls > 0){ G.rerolls--; openLevelUp(); } break;
    case 'resume': togglePause(); break;
    case 'quit': endRun(false); break;
    case 'back': backToHub(); break;
  }
});

function updateTitleStage(){ const el = $('#tlStage'); if(el){ const st = STAGES[DEMO.si]; el.textContent = st.name; el.style.color = st.accent; } }
function showTitle(){ hub.hidden = true; modal.hidden = true; titleEl.hidden = false; renderTitle(); }

const DEMO = {t:0, si:0, next:11, fade:0, enemies:[], parts:[], fx:[], shots:[], p:{x:0, y:0, fx:1, fy:0, r:12}, orbA:0, acc:0, novaT:2.2, shotT:.4};
function demoCam(){
  const wide = W > 760;
  return {x:DEMO.p.x - (wide ? W * .2 / ZOOM : 0), y:DEMO.p.y + (wide ? 0 : H * .18 / ZOOM)};
}
function demoKill(e){ e.dead = true; burst(e.x, e.y, SKINS[e.skin].body, 9, 170); }
function demoUpdate(dt){
  const D = DEMO, st = STAGES[D.si], p = D.p;
  D.t += dt;
  const nx = Math.cos(D.t * .32) * 170, ny = Math.sin(D.t * .47) * 120, vx = nx - p.x, vy = ny - p.y, l = Math.hypot(vx, vy);
  if(l > .01){ p.fx = vx / l; p.fy = vy / l; }
  p.x = nx; p.y = ny;
  D.next -= dt;
  if(D.next <= 0){ D.fade = .8; D.next = 11; }
  if(D.fade > 0){
    const before = D.fade; D.fade -= dt;
    if(before > .4 && D.fade <= .4){ D.si = (D.si + 1) % STAGES.length; D.enemies.length = 0; D.parts.length = 0; D.shots.length = 0; updateTitleStage(); }
  }
  const cam = demoCam(), types = stageTypes(st);
  D.acc += dt * 7;
  while(D.acc >= 1){
    D.acc--;
    if(D.enemies.length >= 70) continue;
    const ty = types[Math.floor(Math.random() * types.length)], a = Math.random() * TAU, R = Math.hypot(W, H) / 2 / ZOOM + 40;
    D.enemies.push({x:cam.x + Math.cos(a) * R, y:cam.y + Math.sin(a) * R, r:ENEMIES[ty].r, speed:ENEMIES[ty].speed * .8, skin:st.skins[ty], seed:Math.random() * TAU, shape:Array.from({length:9}, () => rand(.82, 1.08)), flash:0, slow:0});
  }
  D.orbA += dt * 3.2;
  const blades = [0, 1, 2].map(i => [p.x + Math.cos(D.orbA + i * TAU / 3) * 78, p.y + Math.sin(D.orbA + i * TAU / 3) * 78]);
  for(const e of D.enemies){
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += dx / d * e.speed * dt; e.y += dy / d * e.speed * dt;
    if(d < e.r + 14) demoKill(e);
    for(const [bx, by] of blades) if(Math.hypot(e.x - bx, e.y - by) < e.r + 10) demoKill(e);
  }
  D.novaT -= dt;
  if(D.novaT <= 0){
    D.novaT = 2.4;
    D.fx.push({x:p.x, y:p.y, r:20, maxR:150, life:.45, max:.45, color:'#8fe3ff'});
    for(const e of D.enemies) if(Math.hypot(e.x - p.x, e.y - p.y) < 150) demoKill(e);
  }
  D.shotT -= dt;
  if(D.shotT <= 0){
    D.shotT = .35;
    let best = null, bd = 420 * 420;
    for(const e of D.enemies){ const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2; if(!e.dead && d < bd){ bd = d; best = e; } }
    if(best){ const a = Math.atan2(best.y - p.y, best.x - p.x); D.shots.push({x:p.x, y:p.y, vx:Math.cos(a) * 470, vy:Math.sin(a) * 470, life:1}); }
  }
  for(const s of D.shots){
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for(const e of D.enemies) if(!e.dead && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 5){ demoKill(e); s.life = 0; break; }
  }
  D.shots = D.shots.filter(s => s.life > 0);
  D.enemies = D.enemies.filter(e => !e.dead);
  const fr = Math.exp(-4 * dt);
  for(const q of D.parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= fr; q.vy *= fr; q.life -= dt; }
  D.parts = D.parts.filter(q => q.life > 0);
  for(const f of D.fx) f.life -= dt;
  D.fx = D.fx.filter(f => f.life > 0);
}
function renderDemo(){
  const D = DEMO, st = STAGES[D.si], p = D.p, t = D.t, cam = demoCam();
  ctx.fillStyle = '#090b18'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(ZOOM, ZOOM); ctx.translate(-cam.x, -cam.y);
  const hw = W / 2 / ZOOM + 60, hh = H / 2 / ZOOM + 60;
  drawWorld(st, cam.x, cam.y, hw, hh, t);
  for(const e of D.enemies) drawEnemy(e, t, p.x, p.y);
  addGlow('#5cc8ff', p.x, p.y, 44, .5);
  drawHero('mage', p.x, p.y, 13, Math.atan2(p.fy, p.fx), t, false);
  for(let i = 0; i < 3; i++){
    const a = D.orbA + i * TAU / 3, bx = p.x + Math.cos(a) * 78, by = p.y + Math.sin(a) * 78;
    drawBlade(bx, by, a);
  }
  ctx.globalCompositeOperation = 'lighter';
  for(const s of D.shots){ drawGlow('#7fd8ff', s.x, s.y, 16, .9); }
  for(const f of D.fx){ const k = f.life / f.max, r = f.maxR - (f.maxR - f.r) * k; ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2 + 5 * k; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke(); }
  drawParts(D.parts);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  drawMotes(st, cam.x, cam.y, t);
  ctx.drawImage(vignette, 0, 0, W, H);
  if(D.fade > 0){ ctx.fillStyle = `rgba(9,11,24,${Math.min(1, (0.4 - Math.abs(D.fade - .4)) / .4)})`; ctx.fillRect(0, 0, W, H); }
}

/* =====================================================================
   GAME — input & spatial grid
   ===================================================================== */
let G = null;            // current run state
const MAX_ENEMIES = 360;

const keys = {};
const KEYMAP = {ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown', e => {
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; if(G) e.preventDefault(); }
  if(!G){
    if(!titleEl.hidden && (e.code === 'Enter' || e.code === 'Space') && !e.target.closest('button')){ e.preventDefault(); goHub('stages'); }
    return;
  }
  if((e.code === 'Escape' || e.code === 'KeyP') && (G.state === 'play' || G.state === 'paused')) togglePause();
  if(G.state === 'levelup'){
    if(/^Digit[1-4]$/.test(e.code)) pickOption(+e.code.slice(5) - 1);
    if(e.code === 'KeyR' && G.rerolls > 0){ G.rerolls--; openLevelUp(); }
  }
});
addEventListener('keyup', e => { if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; if(G && G.state === 'play') togglePause(); });

const joy = {active:false, id:null, ox:0, oy:0, dx:0, dy:0};
cv.addEventListener('pointerdown', e => {
  if(!G || G.state !== 'play') return;
  joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener('pointermove', e => {
  if(!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const d = Math.hypot(dx, dy), max = 50;
  if(d > max){ joy.ox += dx / d * (d - max); joy.oy += dy / d * (d - max); dx = dx / d * max; dy = dy / d * max; }
  joy.dx = dx / max; joy.dy = dy / max;
});
const joyEnd = e => { if(e.pointerId === joy.id){ joy.active = false; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', joyEnd);
cv.addEventListener('pointercancel', joyEnd);
$('#pauseBtn').innerHTML = ico('pause');
$('#pauseBtn').addEventListener('click', () => { if(G && (G.state === 'play' || G.state === 'paused')) togglePause(); });

const CELL = 64;
const grid = new Map();
const gkey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
function gridBuild(){
  grid.clear();
  for(const e of G.enemies){
    if(e.dead) continue;
    const k = gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let a = grid.get(k); if(!a){ a = []; grid.set(k, a); }
    a.push(e);
  }
}
function query(x, y, r, out){
  out.length = 0;
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL);
  const y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for(let cx = x0; cx <= x1; cx++) for(let cy = y0; cy <= y1; cy++){
    const a = grid.get(gkey(cx, cy));
    if(a) for(const e of a) if(!e.dead) out.push(e);
  }
  return out;
}
const tmpA = [], tmpB = [];

/* =====================================================================
   RUN SETUP & STATS
   ===================================================================== */
const negF = id => (G.neg[id] === undefined ? 0 : 1 - G.neg[id] / MAX_LV.neg);   // 1 = full penalty, 0 = overcome
const posV = id => (G.pos[id] ? ITEMS[id].lv(G.pos[id]).v / 100 : 0);
const abS = id => ITEMS[id].lv(G.ab[id]);

function needXp(l){ return Math.round(XP_BASE * Math.pow(XP_GROWTH, l - 1)); }

function startRun(stage, charId, items){
  const ch = CHARACTERS[charId];
  G = {
    stage, char:charId, items, combos:new Set(activeCombos(items).map(c => c.id)), cost:loadoutCost(items),
    t:0, kills:0, level:1, xp:0, xpNeed:needXp(1), pendingLevels:0, pendingTreasure:0, state:'play',
    p:{x:0, y:0, r:12, hp:0, maxHp:0, speed:ch.speed, vx:0, vy:0, fx:1, fy:0, inv:0, shield:false, shieldT:0, trail:[], trailT:0},
    enemies:[], projs:[], ebullets:[], gems:[], pickups:[], puddles:[], fx:[], parts:[], texts:[],
    weaponLvl:1, ab:{}, pos:{}, neg:{}, cd:{}, s:{},
    spawnAcc:0, nextWave:40, nextElite:55, boss:null, won:false, endT:0, shake:0, flash:0, orbA:0, droneA:0, puddleT:0, bossShot:0,
    chain:0, chainT:0, maxChain:0, rerolls:2, dmgBy:{}, bonusCoins:0, hudT:0, curOpts:[],
  };
  for(const id of items){
    const it = ITEMS[id];
    if(it.type === 'ability') G.ab[id] = 1;
    else if(it.type === 'pos') G.pos[id] = 1;
    else G.neg[id] = 0;
  }
  recalcStats();
  G.p.hp = G.p.maxHp;
  if(G.ab.shield) G.p.shield = true;
  hub.hidden = true; titleEl.hidden = true;
  $('#hud').hidden = false;
  $('#bossbar').hidden = true;
  $('#chain').hidden = true;
  modal.hidden = true;
  renderIcons();
  updateHud();
  const idx = STAGES.indexOf(stage) + 1;
  const cmb = [...G.combos].map(id => COMBOS.find(c => c.id === id).name).join(' · ');
  showBanner(stage.name, '', `Stage ${idx} · survive ${fmtTime(stage.dur)}${cmb ? ' · Combos: ' + cmb : ''}`);
}

function recalcStats(){
  const p = G.p, ch = CHARACTERS[G.char], s = G.s;
  const oldMax = p.maxHp;
  p.maxHp = Math.max(10, Math.round(ch.hp * (1 + posV('tough') - 0.5 * negF('fragile'))));
  if(oldMax) p.hp = Math.min(p.maxHp, p.hp + Math.max(0, p.maxHp - oldMax));
  p.speed = ch.speed * (1 + posV('swift') - 0.25 * negF('sluggish'));
  s.dmgMul = 1 + posV('power');
  s.cdMul = 1 - posV('haste');
  s.pickup = 70 * (1 + posV('magnet')) * (1 - 0.5 * negF('clumsy'));
  s.crit = 0.05 + posV('lucky');
  s.regen = G.pos.regen ? ITEMS.regen.lv(G.pos.regen).v : 0;
  s.xpMul = 1 + posV('scholar') - 0.3 * negF('dull');
  s.armor = ch.armor + (G.combos.has('fortress') ? 2 : 0);
  s.dmgTaken = 1 + 0.3 * negF('brittle');
  s.enemyHp = 1 + 0.25 * negF('cursed');
  s.vision = visionFor(negF('nearsighted'));
  s.weaponMul = 1 - 0.4 * negF('feeble');
  s.berserkThr = G.combos.has('glass') ? 0.5 : 0.3;
  s.berserkMul = 1 + posV('berserker');
  s.momentum = posV('momentum') * (G.combos.has('perpetual') ? 2 : 1);
  s.restless = negF('restless');
  s.siphon = posV('siphon');
}

/* =====================================================================
   SPAWNING
   ===================================================================== */
function pickType(){
  const st = G.stage;
  let mix = st.mix[0][1];
  for(const [t, m] of st.mix) if(G.t >= t) mix = m;
  let total = 0; for(const k in mix) total += mix[k];
  let r = Math.random() * total;
  for(const k in mix){ r -= mix[k]; if(r <= 0) return k; }
  return Object.keys(mix)[0];
}
function spawnEnemy(type, x, y, elite){
  const d = ENEMIES[type], st = G.stage, p = G.p, skin = st.skins[type];
  if(x === undefined){
    const a = Math.random() * TAU, dist = Math.hypot(W, H) / 2 / ZOOM + 60;
    x = p.x + Math.cos(a) * dist; y = p.y + Math.sin(a) * dist;
  }
  let hp = d.hp * (1 + Math.min(G.t, st.dur) / 100) * st.hpMul * G.s.enemyHp;
  if(elite) hp *= 9;
  G.enemies.push({type, skin, x, y, r:d.r * (elite ? 1.7 : 1), hp, maxHp:hp, speed:d.speed * st.speedMul * rand(0.9, 1.1) * (elite ? 0.85 : 1),
    dmg:d.dmg * (elite ? 1.5 : 1), xp:d.xp, color:SKINS[skin].body, armor:d.armor, elite:!!elite,
    slow:0, flash:0, oT:-9, dead:false, seed:Math.random() * TAU, shape:Array.from({length:9}, () => rand(.82, 1.08))});
}
function spawnBoss(){
  const p = G.p, st = G.stage, a = Math.random() * TAU, sk = SKINS[st.boss];
  const hp = st.bossHp * G.s.enemyHp;
  const b = {type:'boss', skin:st.boss, boss:true, x:p.x + Math.cos(a) * 420, y:p.y + Math.sin(a) * 420, r:44, hp, maxHp:hp,
    speed:88 * st.speedMul, dmg:28, xp:0, color:sk.body, armor:st.bossArmor, slow:0, flash:0, oT:-9, dead:false, seed:0, shape:SHAPE};
  G.enemies.push(b); G.boss = b;
  $('#bossName').textContent = sk.name;
  $('#bossbar').hidden = false;
  showBanner('WARNING', 'warn', `${sk.name} has arrived. Defeat it to clear the stage`);
  G.shake = 0.4;
}

/* =====================================================================
   DAMAGE, DROPS, FEEDBACK
   ===================================================================== */
// kind: undefined = normal hit, 1 = crit, 2 = message
function addText(x, y, txt, kind){
  if(G.texts.length > 90 && kind !== 2) return;
  G.texts.push({x, y, txt, kind:kind || 0, life:kind === 2 ? 1.6 : 0.7, max:kind === 2 ? 1.6 : 0.7});
}
function burst(x, y, color, n, speed, size){
  const arr = G ? G.parts : DEMO.parts;
  for(let i = 0; i < n && arr.length < 700; i++){
    const a = Math.random() * TAU, sp = rand(0.25, 1) * speed;
    arr.push({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:rand(0.3, 0.7), max:0.7, c:color, s:rand(1.5, 3.5) * (size || 1)});
  }
}
function hitEnemy(e, base, src){
  if(e.dead) return;
  const s = G.s, p = G.p;
  let m = s.dmgMul;
  if(src === 'weapon') m *= s.weaponMul;
  if(G.pos.berserker && p.hp / p.maxHp < s.berserkThr) m *= s.berserkMul;
  if(G.pos.momentum){ const sp = Math.hypot(p.vx, p.vy); m *= 1 + s.momentum * Math.min(1.5, sp / 150); }
  if(src === 'fireball' && G.combos.has('thermal') && e.slow > 0) m *= 1.6;
  let crit = false;
  if(Math.random() < s.crit){ m *= 2; crit = true; }
  const d = Math.max(1, base * m - e.armor);
  e.hp -= d; e.flash = 0.07;
  G.dmgBy[src] = (G.dmgBy[src] || 0) + d;
  addText(e.x + rand(-8, 8), e.y - e.r, Math.round(d), crit ? 1 : undefined);
  if(G.parts.length < 500) burst(e.x, e.y, crit ? '#ffd84a' : '#ffffff', crit ? 4 : 1, 140, 0.8);
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  burst(e.x, e.y, e.color, e.elite ? 30 : e.boss ? 60 : 9, e.elite || e.boss ? 300 : 170, e.elite || e.boss ? 1.6 : 1);
  if(e.boss){ onBossDead(e); return; }
  G.kills++;
  G.chain++; G.chainT = 2.2;
  if(G.chain > G.maxChain) G.maxChain = G.chain;
  G.gems.push({x:e.x, y:e.y, v:e.xp * (1 + Math.min(G.t, G.stage.dur) / 150) * (e.elite ? 8 : 1), mag:false});
  if(e.elite){ dropPickup('chest', e.x, e.y); G.fx.push({type:'ring', x:e.x, y:e.y, r:10, maxR:140, life:0.5, max:0.5, color:'#ffd84a'}); G.shake = 0.25; }
  else {
    const r = Math.random();
    if(r < 0.006) dropPickup('heart', e.x, e.y);
    else if(r < 0.010) dropPickup('magnet', e.x, e.y);
    else if(r < 0.013) dropPickup('bomb', e.x, e.y);
    else if((e.type === 'brute' || e.type === 'armored') && r < 0.03) dropPickup('chest', e.x, e.y);
  }
  if(G.pos.siphon && Math.random() < G.s.siphon) G.p.hp = Math.min(G.p.maxHp, G.p.hp + 3);
  if(G.gems.length > 320){ const o = G.gems.shift(); G.gems[G.gems.length - 1].v += o.v; }
}
const PICKUPS = {heart:'#ff4f7b', magnet:'#38e1ff', bomb:'#ff8a3d', chest:'#ffd84a'};
function dropPickup(kind, x, y){ G.pickups.push({kind, x, y, t:Math.random() * 6}); }
function collectPickup(pk){
  const p = G.p;
  G.fx.push({type:'ring', x:pk.x, y:pk.y, r:6, maxR:70, life:0.35, max:0.35, color:PICKUPS[pk.kind]});
  switch(pk.kind){
    case 'heart': { const h = p.maxHp * 0.3; p.hp = Math.min(p.maxHp, p.hp + h); addText(p.x, p.y - 30, '+' + Math.round(h) + ' HP', 2); break; }
    case 'magnet': for(const g of G.gems) g.mag = true; addText(p.x, p.y - 30, 'MAGNET', 2); break;
    case 'bomb': {
      const hw = W / 2 / ZOOM, hh = H / 2 / ZOOM, dmg = 60 * (1 + G.t / 100);
      for(const e of G.enemies) if(!e.dead && Math.abs(e.x - p.x) < hw && Math.abs(e.y - p.y) < hh) hitEnemy(e, dmg, 'bomb');
      G.fx.push({type:'ring', x:p.x, y:p.y, r:20, maxR:Math.max(hw, hh), life:0.6, max:0.6, color:'#ff8a3d', fill:true});
      G.shake = 0.45; G.flash = 0.2; break;
    }
    case 'chest': G.pendingTreasure++; if(G.state === 'play' && !G.won) openLevelUp(); break;
  }
}
function onBossDead(b){
  G.won = true; G.endT = 2.2; G.shake = 0.6; G.flash = 0.35;
  G.fx.push({type:'ring', x:b.x, y:b.y, r:0, maxR:700, life:1, max:1, color:'#ffd84a'});
  for(const e of G.enemies) if(!e.dead){ e.dead = true; burst(e.x, e.y, e.color, 5, 160); G.gems.push({x:e.x, y:e.y, v:e.xp, mag:true}); }
  G.ebullets.length = 0;
  $('#bossbar').hidden = true;
  showBanner('STAGE CLEAR', 'elite', `${SKINS[b.skin].name} defeated!`);
}
function hurtPlayer(dmg){
  const p = G.p;
  if(p.inv > 0 || G.won) return;
  if(p.shield){
    p.shield = false; p.shieldT = shieldRecharge(); p.inv = 0.5;
    G.fx.push({type:'ring', x:p.x, y:p.y, r:10, maxR:90, life:0.35, max:0.35, color:'#38e1ff', fill:true});
    const sh = abS('shield').shock;
    if(sh > 0){ query(p.x, p.y, 135, tmpB); for(const e of tmpB) if(Math.hypot(e.x - p.x, e.y - p.y) < 90 + e.r) hitEnemy(e, sh, 'shield'); }
    return;
  }
  const d = Math.max(1, dmg * G.s.dmgTaken - G.s.armor);
  p.hp -= d; p.inv = 0.45; G.shake = 0.22;
  burst(p.x, p.y, '#ff4f7b', 6, 180);
  if(p.hp <= 0){ p.hp = 0; burst(p.x, p.y, CHARACTERS[G.char].color, 50, 320, 1.8); endRun(false); }
}
function shieldRecharge(){ return abS('shield').cd * (G.combos.has('fortress') ? 0.6 : 1) * G.s.cdMul; }

function nearestEnemy(x, y, maxD){
  let best = null, bd = maxD * maxD;
  for(const e of G.enemies){
    if(e.dead) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function shoot(kind, x, y, ang, speed, o){
  G.projs.push(Object.assign({kind, x, y, vx:Math.cos(ang) * speed, vy:Math.sin(ang) * speed, r:5, life:1.2,
    pierce:0, hits:new Set(), age:0}, o));
}

/* =====================================================================
   WEAPONS & ABILITIES
   ===================================================================== */
function fireWeapon(){
  const p = G.p, s = G.s, wid = CHARACTERS[G.char].weapon, st = WEAPONS[wid].lv(G.weaponLvl);
  if(wid === 'bolt'){
    const t = nearestEnemy(p.x, p.y, 520);
    if(!t) return 0.15;
    const base = Math.atan2(t.y - p.y, t.x - p.x);
    for(let i = 0; i < st.count; i++){
      const a = base + (i - (st.count - 1) / 2) * 0.14;
      shoot('bolt', p.x, p.y, a, 470, {src:'weapon', dmg:st.dmg, pierce:st.pierce, color:'#7fd8ff', r:5});
    }
    return st.cd * s.cdMul;
  }
  const R = st.range;
  const near = nearestEnemy(p.x, p.y, R + 80);
  const dirs = [near ? Math.atan2(near.y - p.y, near.x - p.x) : Math.atan2(p.fy, p.fx)];
  if(st.back) dirs.push(dirs[0] + Math.PI);
  for(const dir of dirs){
    query(p.x, p.y, R + 45, tmpA);
    for(const e of tmpA){
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if(d > R + e.r) continue;
      let da = Math.abs(Math.atan2(dy, dx) - dir) % TAU; if(da > Math.PI) da = TAU - da;
      if(da <= Math.PI / 3 || d < e.r + p.r) hitEnemy(e, st.dmg, 'weapon');
    }
    G.fx.push({type:'arc', x:p.x, y:p.y, r:R, dir, life:0.2, max:0.2, color:'#ffc46b'});
  }
  return st.cd * s.cdMul;
}

function useAbility(id){
  const p = G.p, s = G.s, st = abS(id);
  switch(id){
    case 'fireball': {
      for(let i = 0; i < st.n; i++){
        const t = nearestEnemy(p.x, p.y, 520);
        if(!t) return 0.3;
        const a = Math.atan2(t.y - p.y, t.x - p.x) + (i ? (i % 2 ? 0.4 : -0.4) : 0);
        shoot('fire', p.x, p.y, a, 340, {src:'fireball', dmg:st.dmg, r:8, life:1.4, aoe:st.aoe, color:'#ff8a3d'});
      }
      return st.cd * s.cdMul;
    }
    case 'frost': {
      query(p.x, p.y, st.rad + 45, tmpA);
      for(const e of tmpA) if(Math.hypot(e.x - p.x, e.y - p.y) < st.rad + e.r){ e.slow = st.slow; hitEnemy(e, st.dmg, 'frost'); }
      G.fx.push({type:'ring', x:p.x, y:p.y, r:20, maxR:st.rad, life:0.4, max:0.4, color:'#8fe3ff', fill:true});
      G.fx.push({type:'frost', x:p.x, y:p.y, r:st.rad, life:0.5, max:0.5, color:'#c9f4ff'});
      return st.cd * s.cdMul;
    }
    case 'drone': {
      let shot = false;
      for(let i = 0; i < st.n; i++){
        const a = G.droneA + i / st.n * TAU, dx = p.x + Math.cos(a) * 48, dy = p.y + Math.sin(a) * 48;
        const t = nearestEnemy(dx, dy, 480);
        if(!t) continue;
        shot = true;
        shoot('bolt', dx, dy, Math.atan2(t.y - dy, t.x - dx), 430, {src:'drone', dmg:st.dmg, r:4, color:'#6dffc4'});
      }
      return shot ? st.cd * s.cdMul : 0.2;
    }
    case 'lightning': {
      const hw = W / 2 / ZOOM, hh = H / 2 / ZOOM;
      const vis = G.enemies.filter(e => !e.dead && Math.abs(e.x - p.x) < hw && Math.abs(e.y - p.y) < hh);
      if(!vis.length) return 0.3;
      for(let i = 0; i < st.n && vis.length; i++){
        const e = vis.splice(Math.floor(Math.random() * vis.length), 1)[0];
        G.fx.push({type:'bolt', x:e.x, y:e.y, x0:e.x + rand(-50, 50), y0:e.y - hh - 40, life:0.22, max:0.22, color:'#fff07a'});
        G.fx.push({type:'ring', x:e.x, y:e.y, r:4, maxR:34, life:0.25, max:0.25, color:'#fff07a'});
        hitEnemy(e, st.dmg, 'lightning');
        if(G.combos.has('overcharge')){
          query(e.x, e.y, 150, tmpB);
          tmpB.sort((a, b) => ((a.x - e.x) ** 2 + (a.y - e.y) ** 2) - ((b.x - e.x) ** 2 + (b.y - e.y) ** 2));
          let c = 0;
          for(const o of tmpB){
            if(o === e || o.dead) continue;
            G.fx.push({type:'bolt', x:o.x, y:o.y, x0:e.x, y0:e.y, life:0.2, max:0.2, color:'#fff07a'});
            hitEnemy(o, st.dmg * 0.6, 'lightning');
            if(++c >= 2) break;
          }
        }
      }
      G.shake = Math.max(G.shake, 0.06);
      return st.cd * s.cdMul;
    }
    case 'boomerang': {
      const base = Math.atan2(p.fy, p.fx), far = G.combos.has('kite') ? 1.3 : 1;
      for(let i = 0; i < st.n; i++){
        shoot('boom', p.x, p.y, base + (i - (st.n - 1) / 2) * 0.5, 420 * far, {src:'boomerang', dmg:st.dmg, r:12, life:4, hits:new Map(), color:'#ffe08a'});
      }
      return st.cd * s.cdMul;
    }
  }
  return 1;
}

function explode(pr){
  if(pr.exploded) return;
  pr.exploded = true; pr.life = 0;
  query(pr.x, pr.y, pr.aoe + 45, tmpB);
  for(const e of tmpB) if(Math.hypot(e.x - pr.x, e.y - pr.y) < pr.aoe + e.r) hitEnemy(e, pr.dmg, 'fireball');
  G.fx.push({type:'ring', x:pr.x, y:pr.y, r:10, maxR:pr.aoe, life:0.35, max:0.35, color:'#ff8a3d', fill:true});
  burst(pr.x, pr.y, '#ffb23d', 12, 220);
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt){
  const g = G, p = g.p, s = g.s, st = g.stage;
  g.t += dt;

  let ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if(joy.active){ ix += joy.dx; iy += joy.dy; }
  let il = Math.hypot(ix, iy);
  if(il > 1){ ix /= il; iy /= il; il = 1; }
  if(il > 0.05){ p.fx = ix / il; p.fy = iy / il; }
  if(s.restless > 0 && il < s.restless){ ix = p.fx * s.restless; iy = p.fy * s.restless; }
  p.vx = ix * p.speed; p.vy = iy * p.speed;
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.trailT -= dt;
  if(p.trailT <= 0){ p.trailT = 0.035; p.trail.push({x:p.x, y:p.y}); if(p.trail.length > 8) p.trail.shift(); }

  if(s.regen) p.hp = Math.min(p.maxHp, p.hp + s.regen * dt);
  if(p.inv > 0) p.inv -= dt;
  if(g.ab.shield && !p.shield){ p.shieldT -= dt; if(p.shieldT <= 0) p.shield = true; }
  if(g.shake > 0) g.shake = Math.max(0, g.shake - dt);
  if(g.flash > 0) g.flash -= dt;
  if(g.chainT > 0){ g.chainT -= dt; if(g.chainT <= 0) g.chain = 0; }

  if(!g.won){
    if(!g.boss && g.t >= st.dur) spawnBoss();
    const rate = Math.min(11, st.spawn * (1.2 + g.t / 35)) * (g.boss ? 0.35 : 1);
    g.spawnAcc += rate * dt;
    while(g.spawnAcc >= 1){ g.spawnAcc--; if(g.enemies.length < MAX_ENEMIES) spawnEnemy(pickType()); }
    if(g.t >= g.nextWave && !g.boss){
      g.nextWave += 40;
      const type = pickType(), n = 24;
      for(let i = 0; i < n; i++){
        const a = i / n * TAU;
        if(g.enemies.length < MAX_ENEMIES + 40) spawnEnemy(type, p.x + Math.cos(a) * 440, p.y + Math.sin(a) * 440);
      }
      showBanner('SWARM', 'warn', 'You are surrounded');
    }
    if(g.t >= g.nextElite && !g.boss){
      g.nextElite += 55;
      spawnEnemy(pickType(), undefined, undefined, true);
      showBanner('ELITE', 'elite', 'Defeat the golden enemy for a treasure chest');
    }
  }

  for(const e of g.enemies){
    if(e.dead) continue;
    if(e.slow > 0) e.slow -= dt;
    if(e.flash > 0) e.flash -= dt;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    const sp = e.speed * (e.slow > 0 ? 0.5 : 1);
    e.x += dx / d * sp * dt; e.y += dy / d * sp * dt;
    if(e.boss && d > 650){ const a = Math.random() * TAU; e.x = p.x + Math.cos(a) * 420; e.y = p.y + Math.sin(a) * 420; }
    if(d > 1400 && !e.boss){
      const a = Math.atan2(p.fy, p.fx) + rand(-0.8, 0.8), r = Math.hypot(W, H) / 2 / ZOOM + 60;
      e.x = p.x + Math.cos(a) * r; e.y = p.y + Math.sin(a) * r;
    }
  }
  gridBuild();
  for(const e of g.enemies){
    if(e.dead) continue;
    query(e.x, e.y, e.r + 45, tmpA);
    for(const o of tmpA){
      if(o === e) continue;
      const dx = e.x - o.x, dy = e.y - o.y, rr = e.r + o.r, d2 = dx * dx + dy * dy;
      if(d2 < rr * rr && d2 > 0.01){
        const d = Math.sqrt(d2), push = (rr - d) * 0.25 * (e.boss ? 0.1 : 1);
        e.x += dx / d * push; e.y += dy / d * push;
      }
    }
  }
  query(p.x, p.y, 80, tmpA);
  for(const e of tmpA) if(Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) hurtPlayer(e.dmg);
  if(g.state !== 'play') return;

  if(g.boss && !g.boss.dead){
    g.bossShot -= dt;
    if(g.bossShot <= 0){
      g.bossShot = 2.6;
      const n = 14, off = Math.random() * TAU;
      for(let i = 0; i < n; i++){
        const a = off + i / n * TAU;
        g.ebullets.push({x:g.boss.x, y:g.boss.y, vx:Math.cos(a) * 170, vy:Math.sin(a) * 170, r:6, life:5});
      }
    }
  }
  for(const b of g.ebullets){
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if(Math.hypot(b.x - p.x, b.y - p.y) < b.r + p.r){ b.life = 0; hurtPlayer(12); }
  }
  g.ebullets = g.ebullets.filter(b => b.life > 0);
  if(g.state !== 'play') return;

  g.cd.weapon = (g.cd.weapon || 0) - dt;
  if(g.cd.weapon <= 0) g.cd.weapon = fireWeapon();
  for(const id in g.ab){
    if(id === 'orbit' || id === 'shield' || id === 'poison') continue;
    g.cd[id] = (g.cd[id] === undefined ? 0.5 : g.cd[id]) - dt;
    if(g.cd[id] <= 0) g.cd[id] = useAbility(id);
  }
  g.droneA += dt * 1.4;

  if(g.ab.orbit){
    const os = abS('orbit'), n = os.n + (g.combos.has('closeq') ? 1 : 0);
    g.orbA += dt * 3.2;
    for(let i = 0; i < n; i++){
      const a = g.orbA + i / n * TAU, bx = p.x + Math.cos(a) * os.rad, by = p.y + Math.sin(a) * os.rad;
      query(bx, by, 60, tmpA);
      for(const e of tmpA){
        if(g.t - e.oT < 0.35) continue;
        if(Math.hypot(e.x - bx, e.y - by) < e.r + 11){ e.oT = g.t; hitEnemy(e, os.dmg, 'orbit'); }
      }
    }
  }

  if(g.ab.poison){
    const ps = abS('poison'), plague = g.combos.has('plague');
    g.puddleT -= dt;
    if(g.puddleT <= 0 && Math.hypot(p.vx, p.vy) > 20){
      g.puddleT = 0.25;
      const life = ps.life * (plague ? 2 : 1);
      g.puddles.push({x:p.x, y:p.y, r:ps.size * (plague ? 1.5 : 1), life, max:life, tick:0, dps:ps.dps, seed:Math.random() * TAU});
      if(g.puddles.length > 48) g.puddles.shift();
    }
  }
  for(const pd of g.puddles){
    pd.life -= dt; pd.tick -= dt;
    if(pd.tick <= 0){
      pd.tick = 0.25;
      query(pd.x, pd.y, pd.r + 45, tmpA);
      for(const e of tmpA) if(Math.hypot(e.x - pd.x, e.y - pd.y) < pd.r + e.r) hitEnemy(e, pd.dps * 0.25, 'poison');
    }
  }
  g.puddles = g.puddles.filter(pd => pd.life > 0);

  for(const pr of g.projs){
    pr.life -= dt; pr.age += dt;
    if(pr.kind === 'boom'){
      const out = 0.5 * (g.combos.has('kite') ? 1.3 : 1);
      if(pr.age < out){ const k = 1 - pr.age / out; pr.x += pr.vx * dt * k; pr.y += pr.vy * dt * k; }
      else {
        const dx = p.x - pr.x, dy = p.y - pr.y, d = Math.hypot(dx, dy) || 1;
        pr.x += dx / d * 480 * dt; pr.y += dy / d * 480 * dt;
        if(d < 18) pr.life = 0;
      }
    } else { pr.x += pr.vx * dt; pr.y += pr.vy * dt; }
    if(pr.kind === 'fire' && Math.random() < .5 && g.parts.length < 600) g.parts.push({x:pr.x, y:pr.y, vx:rand(-30, 30), vy:rand(-30, 30), life:.35, max:.35, c:'#ff8a3d', s:rand(2, 4)});
    if(pr.life <= 0) continue;
    query(pr.x, pr.y, pr.r + 45, tmpA);
    for(const e of tmpA){
      if(e.dead) continue;
      const rr = e.r + pr.r;
      if((e.x - pr.x) ** 2 + (e.y - pr.y) ** 2 >= rr * rr) continue;
      if(pr.kind === 'boom'){
        const last = pr.hits.get(e);
        if(last !== undefined && g.t - last < 0.3) continue;
        pr.hits.set(e, g.t); hitEnemy(e, pr.dmg, pr.src);
      } else if(pr.kind === 'fire'){
        explode(pr); break;
      } else {
        if(pr.hits.has(e)) continue;
        pr.hits.add(e); hitEnemy(e, pr.dmg, pr.src);
        if(pr.pierce-- <= 0){ pr.life = 0; break; }
      }
    }
    if(pr.kind === 'fire' && pr.life <= 0) explode(pr);
  }
  g.projs = g.projs.filter(pr => pr.life > 0);
  g.enemies = g.enemies.filter(e => !e.dead);

  for(const gm of g.gems){
    const dx = p.x - gm.x, dy = p.y - gm.y, d = Math.hypot(dx, dy) || 1;
    if(gm.mag || d < s.pickup){
      gm.mag = true;
      const sp = (460 + (g.won ? 500 : 0)) * dt;
      gm.x += dx / d * Math.min(d, sp); gm.y += dy / d * Math.min(d, sp);
      if(d < p.r + 8){ gm.taken = true; addXp(gm.v); }
    }
  }
  g.gems = g.gems.filter(gm => !gm.taken);
  for(const pk of g.pickups){
    pk.t += dt;
    if(!pk.taken && Math.hypot(pk.x - p.x, pk.y - p.y) < p.r + 16){ pk.taken = true; collectPickup(pk); }
  }
  g.pickups = g.pickups.filter(pk => !pk.taken);

  const fr = Math.exp(-4 * dt);
  for(const q of g.parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= fr; q.vy *= fr; q.life -= dt; }
  g.parts = g.parts.filter(q => q.life > 0);
  for(const f of g.fx) f.life -= dt;
  g.fx = g.fx.filter(f => f.life > 0);
  for(const t of g.texts){ t.life -= dt; t.y -= (t.kind === 2 ? 26 : 38) * dt; }
  g.texts = g.texts.filter(t => t.life > 0);

  if(g.won){ g.endT -= dt; if(g.endT <= 0) endRun(true); }
}

/* =====================================================================
   LEVELING
   ===================================================================== */
function addXp(v){
  const chainBonus = Math.min(0.5, Math.floor(G.chain / 10) * 0.01);
  G.xp += v * G.s.xpMul * (1 + chainBonus);
  while(G.xp >= G.xpNeed){
    G.xp -= G.xpNeed; G.level++; G.xpNeed = needXp(G.level); G.pendingLevels++;
  }
  if((G.pendingLevels > 0 || G.pendingTreasure > 0) && G.state === 'play' && !G.won) openLevelUp();
}

const FMT = {
  int: v => String(Math.round(v)),
  '1': v => (Math.round(v * 10) / 10).toFixed(1),
  s: v => v.toFixed(2) + 's',
  yes: v => v ? 'Yes' : 'No',
  pct: v => '+' + Math.round(v) + '%',
  mpct: v => '−' + Math.round(v) + '%',
  hp: v => (Math.round(v * 100) / 100) + '/s',
};
const COUNT_KEYS = ['n','count','pierce','back'];
function diffLines(def, L){
  const a = def.lv(L), b = def.lv(L + 1), out = [];
  for(const [k, label, f] of def.show){
    const fa = FMT[f](a[k]), fb = FMT[f](b[k]);
    if(fa !== fb) out.push({label, a:fa, b:fb, star:COUNT_KEYS.includes(k) || (a[k] === 0 && b[k] > 0)});
  }
  return out;
}

function levelOptions(n){
  const opts = [];
  const wid = CHARACTERS[G.char].weapon, w = WEAPONS[wid];
  if(G.weaponLvl < MAX_LV.weapon) opts.push({w:3, cls:'weapon', icon:wid, kind:'Weapon', name:w.name, from:G.weaponLvl, max:MAX_LV.weapon,
    lines:diffLines(w, G.weaponLvl), apply:() => { G.weaponLvl++; }});
  for(const id in G.ab){
    if(G.ab[id] >= MAX_LV.ability) continue;
    const it = ITEMS[id];
    opts.push({w:3, cls:'ability', icon:id, kind:'Ability', name:it.name, from:G.ab[id], max:MAX_LV.ability,
      lines:diffLines(it, G.ab[id]), apply:() => { G.ab[id]++; }});
  }
  for(const id in G.pos){
    if(G.pos[id] >= MAX_LV.pos) continue;
    const it = ITEMS[id];
    opts.push({w:2, cls:'pos', icon:id, kind:'Positive trait', name:it.name, from:G.pos[id], max:MAX_LV.pos,
      lines:diffLines(it, G.pos[id]), apply:() => { G.pos[id]++; recalcStats(); }});
  }
  for(const id in G.neg){
    const m = G.neg[id];
    if(m >= MAX_LV.neg) continue;
    const it = ITEMS[id], f = 1 - m / MAX_LV.neg, f2 = 1 - (m + 1) / MAX_LV.neg;
    opts.push({w:1.3, cls:'neg', icon:id, kind:'Overcome', name:'Overcome ' + it.name, from:m, max:MAX_LV.neg,
      lines:[{wide:true, a:it.pen(f), b:f2 > 0 ? it.pen(f2) : 'Penalty gone', star:f2 === 0}],
      apply:() => { G.neg[id]++; recalcStats(); }});
  }
  const picked = [];
  while(picked.length < n && opts.length){
    let tot = 0; for(const o of opts) tot += o.w;
    let r = Math.random() * tot, i = 0;
    for(; i < opts.length - 1; i++){ r -= opts[i].w; if(r <= 0) break; }
    picked.push(opts.splice(i, 1)[0]);
  }
  if(picked.length < n) picked.push({cls:'item', icon:'heart', kind:'Item', name:'Heal', lines:[{label:'Recover', a:'', b:'30% HP'}],
    apply:() => { G.p.hp = Math.min(G.p.maxHp, G.p.hp + G.p.maxHp * 0.3); }});
  if(picked.length < n) picked.push({cls:'item', icon:'coin', kind:'Item', name:'Coins', lines:[{label:'Gain', a:'', b:'+10 coins'}],
    apply:() => { G.bonusCoins += 10; }});
  return picked;
}

function pipsHtml(from, max){
  let h = '';
  for(let i = 1; i <= max; i++) h += `<i class="${i <= from ? 'f' : i === from + 1 ? 'n' : ''}"></i>`;
  return `<div class="pips">${h}<span>${from} → ${from + 1} / ${max}</span></div>`;
}
function optCard(o, i){
  const lines = o.lines.map(l => l.wide
    ? `<div class="wide ${l.star ? 'star' : ''}"><span>${esc(l.a)}</span><b>→ ${esc(l.b)}</b></div>`
    : `<div class="${l.star ? 'star' : ''}"><span>${esc(l.label)}</span><b>${l.a ? esc(l.a) + ' → ' : ''}${esc(l.b)}</b></div>`).join('');
  return `<button class="choice c-${o.cls}" data-pick="${i}" style="animation-delay:${i * 70}ms">
    <span class="ck">${i + 1}</span><span class="cic">${ico(o.icon)}</span><span class="ckind">${o.kind}</span><span class="cname">${esc(o.name)}</span>
    ${o.max ? pipsHtml(o.from, o.max) : ''}<div class="clines">${lines}</div></button>`;
}
function openLevelUp(){
  G.state = 'levelup';
  joy.active = false; joy.dx = joy.dy = 0;
  const treasure = G.pendingTreasure > 0;
  const waiting = G.pendingLevels + G.pendingTreasure - 1;
  G.curOpts = levelOptions(G.combos.has('bloomer') ? 4 : 3);
  mbox.className = 'mbox lvbox';
  mbox.innerHTML = `<div class="lvhead"><div class="lvtitle ${treasure ? 'tre' : ''}">${treasure ? 'TREASURE' : 'LEVEL UP'}</div>
    <div class="lvsub">${treasure ? 'A free upgrade from the chest' : `You reached level ${G.level - G.pendingLevels + 1}`}${waiting > 0 ? ` · ${waiting} more waiting` : ''}</div></div>
    <div class="choices">${G.curOpts.map(optCard).join('')}</div>
    <div class="lvfoot"><button class="btn" data-act="reroll" ${G.rerolls ? '' : 'disabled'}>${ico('reroll')} Reroll (${G.rerolls} left)</button>
    <span>Keys 1–${G.curOpts.length} to pick · R to reroll</span></div>`;
  modal.hidden = false;
}
function pickOption(i){
  if(!G || G.state !== 'levelup') return;
  const o = G.curOpts[i]; if(!o) return;
  o.apply();
  if(G.pendingTreasure > 0) G.pendingTreasure--; else G.pendingLevels--;
  renderIcons();
  const col = {weapon:'#38e1ff', ability:'#ffb23d', pos:'#3dffa8', neg:'#ff4f7b', item:'#ffd84a'}[o.cls] || '#ffffff';
  G.fx.push({type:'ring', x:G.p.x, y:G.p.y, r:10, maxR:120, life:0.45, max:0.45, color:col, fill:true});
  burst(G.p.x, G.p.y, col, 22, 260);
  G.flash = 0.12;
  if(G.pendingLevels + G.pendingTreasure > 0) openLevelUp();
  else { modal.hidden = true; G.state = 'play'; }
}

function togglePause(){
  if(G.state === 'play'){
    G.state = 'paused';
    const rows = [];
    const wid = CHARACTERS[G.char].weapon;
    rows.push(`${ico(wid)} ${WEAPONS[wid].name} Lv ${G.weaponLvl}`);
    for(const id in G.ab) rows.push(`${ico(id)} ${ITEMS[id].name} Lv ${G.ab[id]}`);
    for(const id in G.pos) rows.push(`${ico(id)} ${ITEMS[id].name} Lv ${G.pos[id]}`);
    for(const id in G.neg){ const f = 1 - G.neg[id] / MAX_LV.neg; rows.push(`${ico(id)} ${f > 0 ? ITEMS[id].pen(f) : ITEMS[id].name + ' overcome'}`); }
    mbox.className = 'mbox';
    mbox.innerHTML = `<h2>Paused</h2><p class="mnote">${G.stage.name} · ${fmtTime(G.t)} · Level ${G.level} · ${G.kills} kills</p>
      <div class="lbl">Your build</div><div class="tchips">${rows.map(r => `<span class="tc static">${r}</span>`).join('')}</div>
      ${G.combos.size ? '<div class="lbl" style="margin-top:12px">Combos</div>' + [...G.combos].map(id => { const c = COMBOS.find(x => x.id === id); return `<div class="cmb"><b>${ico('spark')} ${c.name}</b>${c.desc}</div>`; }).join('') : ''}
      <div class="mfoot"><button class="btn ghost" data-act="quit">Give up</button><button class="btn hot" data-act="resume">${ico('play')} Resume</button></div>`;
    modal.hidden = false;
  } else if(G.state === 'paused'){
    G.state = 'play';
    modal.hidden = true;
  }
}
document.addEventListener('visibilitychange', () => { if(document.hidden && G && G.state === 'play') togglePause(); });

function srcLabel(k){
  if(k === 'weapon'){ const wid = CHARACTERS[G.char].weapon; return ico(wid) + ' ' + WEAPONS[wid].name; }
  if(k === 'bomb') return ico('bomb') + ' Bomb';
  if(k === 'shield') return ico('shield') + ' Aegis shockwave';
  return ITEMS[k] ? ico(k) + ' ' + ITEMS[k].name : k;
}
function endRun(win){
  if(G.state === 'over') return;
  G.state = 'over';
  $('#bossbar').hidden = true;
  const st = G.stage, idx = STAGES.indexOf(st);
  const lines = [];
  lines.push([`Kills (${G.kills})`, Math.floor(G.kills / 5)]);
  lines.push(['Survival time', Math.floor(Math.min(G.t, st.dur) / 10)]);
  if(G.bonusCoins) lines.push(['Level-up coins', G.bonusCoins]);
  const unlocks = [];
  if(win){
    lines.push(['Stage clear', 100 + idx * 50]);
    const unused = Math.max(0, st.budget - G.cost);
    lines.push([`Unused points (${unused})`, Math.min(10, unused) * UNUSED_POINT_COINS]);
    if(!save.cleared[st.id]){
      save.cleared[st.id] = true;
      lines.push(['First clear bonus', st.reward.coins]);
      for(const c of st.reward.chars || []) if(!save.chars.includes(c)){ save.chars.push(c); unlocks.push(ico(c) + ' ' + CHARACTERS[c].name + ' (character)'); }
      for(const i of st.reward.items || []) if(!isUnlocked(i)){ save.unlocked.push(i); unlocks.push(ico(i) + ' ' + ITEMS[i].name); }
      if(STAGES[idx + 1]) unlocks.push(ico('map') + ' ' + STAGES[idx + 1].name);
    }
    save.best[st.id] = `Cleared · Lv ${G.level}`;
  } else if(!save.cleared[st.id]){
    const prev = save.best[st.id];
    if(!prev || !prev.startsWith('Cleared')) save.best[st.id] = `Survived ${fmtTime(G.t)}`;
  }
  const total = lines.reduce((a, l) => a + l[1], 0);
  save.coins += total;
  persist();
  const dm = Object.entries(G.dmgBy).sort((a, b) => b[1] - a[1]), top = dm.length ? dm[0][1] : 1;
  mbox.className = 'mbox res';
  mbox.innerHTML = `<h2 class="${win ? 'win' : 'lose'}">${win ? 'STAGE CLEAR' : 'DEFEATED'}</h2>
    <div class="sub">${st.name}</div>
    <div class="tiles"><div class="tile"><small>TIME</small><b>${fmtTime(G.t)}</b></div><div class="tile"><small>LEVEL</small><b>${G.level}</b></div>
    <div class="tile"><small>KILLS</small><b>${G.kills}</b></div><div class="tile"><small>BEST CHAIN</small><b>${G.maxChain}</b></div></div>
    ${dm.length ? `<h3>Damage dealt</h3>${dm.slice(0, 7).map(([k, v]) => `<div class="dmr"><span>${srcLabel(k)}</span><div><i style="width:${v / top * 100}%"></i></div><b>${fmtNum(v)}</b></div>`).join('')}` : ''}
    <h3>Coins</h3>${lines.map(l => `<div class="row"><span>${l[0]}</span><b>+${l[1]}</b></div>`).join('')}
    <div class="row total"><span>Total</span><b>+${total} ${ico('coin')}</b></div>
    ${unlocks.length ? `<h3>Unlocked</h3><div class="unl">${unlocks.map(u => `<span class="rchip rew">${u}</span>`).join('')}</div>` : ''}
    <div class="mfoot"><button class="btn hot" id="backB" data-act="back">Back to base</button></div>`;
  modal.hidden = false;
}
function backToHub(){
  modal.hidden = true;
  $('#hud').hidden = true;
  G = null;
  joy.active = false;
  goHub(tab === 'stages' || tab === 'loadout' ? tab : 'stages');
}

let lastChain = 0;

  const ch = $('#chain');
  if(G.chain >= 5){
    ch.hidden = false;

/* =====================================================================
   RENDER
   ===================================================================== */
function drawBlade(bx, by, a){
  addGlow('#8fb8ff', bx, by, 20, .7);
  ctx.save(); ctx.translate(bx, by); ctx.rotate(a + Math.PI / 2);
  ctx.fillStyle = '#e6eeff'; ctx.strokeStyle = '#5a76b8'; ctx.lineWidth = 1.2;
  pts([[0, -14], [5, -2], [0, 14], [-5, -2]]); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,118,184,.8)'; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 11); ctx.stroke();
  ctx.restore();
}
function drawParts(list){
  for(const q of list){
    const k = q.life / q.max, s = q.s * (0.4 + k);
    ctx.globalAlpha = Math.min(1, k * 1.5); ctx.fillStyle = q.c;
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

function render(now){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(!G){
    if(!titleEl.hidden) renderDemo(); else renderBackdrop(now);
    return;
  }
  const g = G, p = g.p, st = g.stage, t = g.t;
  ctx.fillStyle = '#090b18'; ctx.fillRect(0, 0, W, H);
  const sh = REDUCED ? 0 : Math.min(14, g.shake * 36);
  ctx.save();
  ctx.translate(W / 2 + rand(-sh, sh), H / 2 + rand(-sh, sh));
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-p.x, -p.y);
  const hw = W / 2 / ZOOM + 80, hh = H / 2 / ZOOM + 80;
  const inView = (x, y) => Math.abs(x - p.x) < hw && Math.abs(y - p.y) < hh;
  drawWorld(st, p.x, p.y, hw, hh, t);

  // pickup radius hint
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1; ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(p.x, p.y, g.s.pickup, 0, TAU); ctx.stroke(); ctx.setLineDash([]);

  // poison puddles
  for(const pd of g.puddles){
    const k = Math.min(1, pd.life / pd.max * 2);
    ell(pd.x, pd.y, pd.r, pd.r * .75, pd.seed, `rgba(60,170,40,${.35 * k})`);
    addGlow('#7dff6a', pd.x, pd.y, pd.r * 1.3, .35 * k);
    dot(pd.x + Math.cos(pd.seed + t * 3) * pd.r * .4, pd.y + Math.sin(pd.seed * 2 + t * 2) * pd.r * .3, 2.5, `rgba(200,255,170,${.7 * k})`);
  }
  // gems
  ctx.globalCompositeOperation = 'lighter';
  for(const gm of g.gems){
    if(!inView(gm.x, gm.y)) continue;
    drawGlow(gm.v >= 10 ? '#ff5ce1' : gm.v >= 3 ? '#3dffa8' : '#38e1ff', gm.x, gm.y, gm.v >= 10 ? 16 : 11, .7);
  }
  ctx.globalCompositeOperation = 'source-over';
  for(const gm of g.gems){
    if(!inView(gm.x, gm.y)) continue;
    const r = gm.v >= 10 ? 6.5 : gm.v >= 3 ? 5 : 3.8;
    ctx.fillStyle = gm.v >= 10 ? '#ffc4f5' : gm.v >= 3 ? '#c4ffe6' : '#c8f6ff';
    pts([[gm.x, gm.y - r * 1.3], [gm.x + r, gm.y], [gm.x, gm.y + r * 1.3], [gm.x - r, gm.y]]); ctx.fill();
  }
  // pickups
  for(const pk of g.pickups){
    if(!inView(pk.x, pk.y)) continue;
    const by = pk.y + Math.sin(pk.t * 4) * 4, col = PICKUPS[pk.kind];
    addGlow(col, pk.x, by, 32, .6 + .25 * Math.sin(pk.t * 6));
    dot(pk.x, by, 13, 'rgba(9,11,24,.85)');
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pk.x, by, 13, 0, TAU); ctx.stroke();
    drawIcon(pk.kind, pk.x, by, 17, '#ffffff', 2.4);
  }

  // enemies
  for(const e of g.enemies) if(inView(e.x, e.y)) drawEnemy(e, t, p.x, p.y);

  // projectiles (glow pass, then cores)
  ctx.globalCompositeOperation = 'lighter';
  for(const b of g.ebullets) drawGlow('#ff4fa0', b.x, b.y, 18, .9);
  for(const pr of g.projs){
    if(pr.kind === 'fire') drawGlow(pr.color, pr.x, pr.y, 32, .95);
    else if(pr.kind === 'boom') drawGlow(pr.color, pr.x, pr.y, 26, .55);
    else {
      drawGlow(pr.color, pr.x, pr.y, 16, .9);
      ctx.strokeStyle = hexA(pr.color, .55); ctx.lineWidth = pr.r * 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(pr.x, pr.y); ctx.lineTo(pr.x - pr.vx * .045, pr.y - pr.vy * .045); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for(const b of g.ebullets){ dot(b.x, b.y, b.r * .7, '#ffd6ec'); }
  for(const pr of g.projs){
    if(pr.kind === 'boom'){
      ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.age * 18);
      ctx.fillStyle = '#fff4c4'; ctx.strokeStyle = '#a07a2a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-pr.r, -3); ctx.quadraticCurveTo(0, -pr.r * .9, pr.r, -3); ctx.lineTo(pr.r * .6, 3); ctx.quadraticCurveTo(0, -pr.r * .3, -pr.r * .6, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if(pr.kind === 'fire'){
      dot(pr.x, pr.y, pr.r * .9, '#ffd08a'); dot(pr.x, pr.y, pr.r * .5, '#ffffff');
    } else {
      const a = Math.atan2(pr.vy, pr.vx);
      ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(a);
      ctx.fillStyle = '#ffffff'; pts([[pr.r * 1.6, 0], [0, -pr.r * .55], [-pr.r * 1.2, 0], [0, pr.r * .55]]); ctx.fill();
      ctx.restore();
    }
  }

  // orbit blades & drones
  if(g.ab.orbit){
    const os = abS('orbit'), n = os.n + (g.combos.has('closeq') ? 1 : 0);
    for(let i = 0; i < n; i++){ const a = g.orbA + i / n * TAU; drawBlade(p.x + Math.cos(a) * os.rad, p.y + Math.sin(a) * os.rad, a); }
  }
  if(g.ab.drone){
    const n = abS('drone').n;
    for(let i = 0; i < n; i++){
      const a = g.droneA + i / n * TAU, dx = p.x + Math.cos(a) * 48, dy = p.y + Math.sin(a) * 48;
      addGlow('#6dffc4', dx, dy, 16, .8);
      ctx.save(); ctx.translate(dx, dy); ctx.rotate(t * 2 + i);
      ctx.fillStyle = '#3a4a5c'; ctx.beginPath(); polyPath(0, 0, 7, 3, 0); ctx.fill();
      ctx.strokeStyle = '#a8ffe0'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      dot(dx, dy, 2.2, '#e0fff2');
    }
  }

  // player
  const pc = CHARACTERS[g.char].color;
  ctx.globalCompositeOperation = 'lighter';
  p.trail.forEach((q, i) => drawGlow(pc, q.x, q.y, 10 + i, .05 * i));
  drawGlow(pc, p.x, p.y, 46, .45);
  ctx.globalCompositeOperation = 'source-over';
  if(g.state !== 'over') drawHero(g.char, p.x, p.y, 13, Math.atan2(p.fy, p.fx), t, p.inv > 0 && Math.floor(p.inv * 20) % 2);
  if(p.shield){ ctx.strokeStyle = 'rgba(56,225,255,.85)'; ctx.lineWidth = 2.5; ctx.beginPath(); polyPath(p.x, p.y, p.r + 14, 6, t); ctx.stroke(); }
  if(g.pos.berserker && p.hp / p.maxHp < g.s.berserkThr){
    ctx.strokeStyle = 'rgba(255,60,60,.75)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 18 + Math.sin(t * 12) * 2, 0, TAU); ctx.stroke();
  }

  // effects
  ctx.globalCompositeOperation = 'lighter';
  for(const f of g.fx){
    const k = Math.max(0, f.life / f.max);
    if(f.type === 'ring'){
      const r = f.maxR - (f.maxR - f.r) * k;
      if(f.fill){ ctx.globalAlpha = k * .22; ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2 + 5 * k;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke();
    } else if(f.type === 'frost'){
      ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2;
      const r = f.r * (1.05 - k * .3);
      ctx.beginPath();
      for(let i = 0; i < 12; i++){ const a = i / 12 * TAU; ctx.moveTo(f.x + Math.cos(a) * r * .55, f.y + Math.sin(a) * r * .55); ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r);
        ctx.moveTo(f.x + Math.cos(a) * r * .8, f.y + Math.sin(a) * r * .8); ctx.lineTo(f.x + Math.cos(a + .08) * r * .9, f.y + Math.sin(a + .08) * r * .9); }
      ctx.stroke();
    } else if(f.type === 'arc'){
      ctx.globalAlpha = k * .7; ctx.fillStyle = f.color;
      const sw = (1 - k) * .3, a0 = f.dir - Math.PI / 3 + sw, a1 = f.dir + Math.PI / 3 + sw;
      ctx.beginPath(); ctx.arc(p.x, p.y, f.r, a0, a1); ctx.arc(p.x, p.y, f.r * .55, a1, a0, true); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = k; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, f.r, a0, a1); ctx.stroke();
    } else if(f.type === 'bolt'){
      const ptsL = [[f.x0, f.y0]];
      for(let i = 1; i < 7; i++){ const q = i / 7; ptsL.push([f.x0 + (f.x - f.x0) * q + rand(-14, 14), f.y0 + (f.y - f.y0) * q + rand(-6, 6)]); }
      ptsL.push([f.x, f.y]);
      for(const [lw, col, al] of [[9, f.color, .35], [3, '#ffffff', 1]]){
        ctx.globalAlpha = k * al; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round';
        ctx.beginPath(); ptsL.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  drawParts(g.parts);
  ctx.globalCompositeOperation = 'source-over';

  // damage numbers
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for(const tx of g.texts){
    const k = tx.life / tx.max, pop = 1 + Math.max(0, (k - .75) / .25) * .6;
    ctx.globalAlpha = Math.min(1, k * 2.5);
    const size = (tx.kind === 1 ? 19 : tx.kind === 2 ? 20 : 13) * pop;
    ctx.font = `700 ${size}px "Chakra Petch", system-ui, sans-serif`;
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 3;
    const txt = tx.kind === 1 ? tx.txt + '!' : String(tx.txt);
    ctx.strokeText(txt, tx.x, tx.y);
    ctx.fillStyle = tx.kind === 1 ? '#ffc23d' : '#f2f4ff';
    ctx.fillText(txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // screen-space overlays
  drawMotes(st, p.x, p.y, t);
  ctx.drawImage(vignette, 0, 0, W, H);
  if(isFinite(g.s.vision)){
    const v = g.s.vision * ZOOM;
    const grd = ctx.createRadialGradient(W / 2, H / 2, v * .55, W / 2, H / 2, v);
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(2,6,4,0.96)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  }
  const hpR = p.hp / p.maxHp;
  if(hpR < .35 && g.state !== 'over'){
    const a = (.35 - hpR) / .35 * (.35 + .15 * Math.sin(now / 160));
    const grd = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) / 2);
    grd.addColorStop(0, 'rgba(255,30,70,0)'); grd.addColorStop(1, `rgba(255,30,70,${a})`);
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  }
  if(g.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${Math.min(.5, g.flash * 1.6)})`; ctx.fillRect(0, 0, W, H); }

  if(joy.active){
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, TAU); ctx.stroke();
    dot(joy.ox + joy.dx * 50, joy.oy + joy.dy * 50, 18, 'rgba(255,255,255,.35)');
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if(G && G.state === 'play') update(dt);
  else if(!G && !titleEl.hidden) demoUpdate(REDUCED ? dt * .4 : dt);
  if(G){ G.hudT -= dt; if(G.hudT <= 0){ G.hudT = 0.08; updateHud(); } }
  render(now);
  requestAnimationFrame(frame);
}

applyStageRules();
renderTitle();
requestAnimationFrame(frame);
</script>
