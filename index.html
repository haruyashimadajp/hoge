<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Loadout Survivors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: arcade cabinet — stage strip on top, item pool left, loadout rack right, sticky launch bar at the bottom */
:root{
  color-scheme:dark;
  --ink:#090b18;--ink2:#0f1328;--panel:#141a33;--panel2:#1b2244;--line:#283062;--line2:#3a4485;
  --text:#eef0ff;--mute:#959cc9;--dim:#5f679b;
  --hot:#ff6a3d;--hot2:#ffb23d;--cyan:#38e1ff;--violet:#9b8cff;
  --abil:#ffb23d;--pos:#3dffa8;--neg:#ff4f7b;--combo:#c77dff;--gold:#ffd84a;
  --display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
input[type=text]{width:100%;background:var(--ink2);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}

/* ---------- hub ---------- */
#hub{position:fixed;inset:0;overflow-y:auto;z-index:5;
  background:linear-gradient(180deg,rgba(9,11,24,.45),rgba(9,11,24,.82) 30%,rgba(9,11,24,.9))}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 8px}
.bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:16px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));background:rgba(9,11,24,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;line-height:.92;letter-spacing:.08em;user-select:none}
.logo .l1{display:block;font-size:12px;color:var(--mute)}
.logo .l2{display:block;font-size:21px;background:linear-gradient(90deg,var(--hot),var(--hot2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px;border-radius:9px;color:var(--mute);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--hot)}
.wallet{margin-left:auto;font-family:var(--display);font-weight:700;color:var(--gold);font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:680px){.bar{flex-wrap:wrap;gap:6px 10px}.tabs{order:3;width:100%}}

.intro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:14px;align-items:center;margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.intro div{font-size:13px;color:var(--mute);line-height:1.45}
.intro b{display:block;color:var(--text);font-family:var(--display);font-size:15px;margin-bottom:2px}
@media (max-width:760px){.intro{grid-template-columns:1fr}}

.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0}
.stg{--sc:var(--hot);position:relative;text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:150px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--sc) 24%,var(--panel)),var(--panel) 72%);display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .12s,border-color .12s,box-shadow .12s}
.stg:hover:not(:disabled){transform:translateY(-2px)}
.stg.on{border-color:var(--sc);box-shadow:0 0 0 1px var(--sc),0 10px 30px -12px var(--sc)}
.stg:disabled{opacity:.42;filter:grayscale(.7)}
.stg .sn{font-family:var(--display);font-size:30px;font-weight:700;color:var(--sc);line-height:1}
.stg .sname{font-family:var(--display);font-weight:700;font-size:15px}
.stg .smeta{font-size:12px;color:var(--mute)}
.stg .sdesc{font-size:13px;color:#c9cef0;margin-top:auto;padding-top:8px;line-height:1.35}
.stg .sn{font-size:38px}
.stg .sclr{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--pos);border:1px solid currentColor;border-radius:5px;padding:1px 5px}
@media (max-width:520px){
  .stages{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stg{min-height:128px;padding:12px}
  .stg .sdesc{display:none}
}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.pagehead h2{font-family:var(--display);font-size:24px;margin:0}
.pagehead p{margin:2px 0 0;color:var(--mute);font-size:14px}
.target{--sc:var(--hot);display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--sc) 55%,var(--line));
  background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 16%,var(--panel)),var(--panel) 60%)}
.target .tn{font-family:var(--display);font-size:28px;font-weight:700;color:var(--sc);line-height:1}
.target .tt{min-width:0}
.target .tt small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.target .tt b{font-family:var(--display);font-size:17px}
.target .chips{flex:1 1 200px;min-width:0}
@media (max-width:600px){.target .chips{order:3;flex-basis:100%}.target .btn{margin-left:auto}}
.preview{border:1px solid var(--line2);border-radius:18px;padding:14px;display:grid;gap:12px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.pvrow{display:flex;align-items:center;gap:12px}
.pvrow .ci{font-size:30px}
.pvrow b{display:block;font-size:15px}
.pvrow small{color:var(--mute);font-size:12px}
.pvpts{margin-left:auto;text-align:right;font-family:var(--display)}
.pvpts b{font-size:26px;line-height:1}
.pvpts.over b{color:var(--neg)}
.pvpts small{display:block;font-family:var(--body)}
.tc.static{cursor:default}
.tc.ability{border-color:color-mix(in srgb,var(--abil) 55%,transparent)}
.tc.ability em{color:var(--abil)}
.btn.wide{width:100%;padding:11px;font-size:14px}

.play{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.play.split{grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:900px){.play{grid-template-columns:minmax(0,1fr)}.rack{order:-1}}

.brief{--sc:var(--hot);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;
  background:radial-gradient(120% 150% at 100% 0%,color-mix(in srgb,var(--sc) 20%,transparent),transparent 60%),var(--panel)}
.brief h2{font-family:var(--display);font-size:28px;margin:0;letter-spacing:.02em;text-wrap:balance}
.brief p{margin:2px 0 0;color:var(--mute)}
.bstats{display:flex;gap:22px;flex-wrap:wrap}
.bstats div{display:flex;flex-direction:column}
.bstats small{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.bstats b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.rchip.forced{border-color:color-mix(in srgb,var(--neg) 60%,transparent);color:#ffc4d3}
.rchip.banned{color:var(--mute)}
.rchip.rew{border-color:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold)}
.rchip.done{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 50%,transparent)}

.poolhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 4px;flex-wrap:wrap}
.poolhead h3{margin:0;font-family:var(--display);font-size:19px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:13px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text)}
.ghead{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.ghead span{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--mute);font-size:12px}
.ghead.t-ability{color:var(--abil)}.ghead.t-pos{color:var(--pos)}.ghead.t-neg{color:var(--neg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.it{--tc:var(--abil);position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  padding:10px;border-radius:13px;border:1px solid var(--line);background:var(--panel);transition:border-color .12s,background .12s,transform .12s}
.it.t-pos{--tc:var(--pos)}.it.t-neg{--tc:var(--neg)}
button.it:hover:not(:disabled){border-color:color-mix(in srgb,var(--tc) 65%,var(--line));transform:translateY(-1px)}
.it .ic{width:42px;height:42px;display:grid;place-items:center;font-size:22px;border-radius:11px;background:color-mix(in srgb,var(--tc) 15%,var(--panel2))}
.it .nm{font-weight:700;font-size:15px;display:block}
.it .ds{font-size:12.5px;color:var(--mute);display:block;line-height:1.35;margin-top:1px}
.it .pt{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:4px 6px;border-radius:9px;background:var(--ink2);font-family:var(--display)}
.it .pt small{font-size:9px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.it .pt b{font-size:19px;color:var(--tc);line-height:1.1;font-variant-numeric:tabular-nums}
.it .pt s{font-size:12px;color:var(--dim);margin-right:3px;font-weight:500}
.it.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--panel));box-shadow:inset 0 0 0 1px var(--tc)}
.it.sel::after{content:'✓';position:absolute;top:-7px;left:-7px;width:21px;height:21px;border-radius:50%;background:var(--tc);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center}
.it:disabled{opacity:.38}
.it.dim{opacity:.5}
.it .tag{grid-column:1/-1;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--mute)}
.it .tag.combo{color:var(--combo)}
.it.lk{opacity:.55}
.it.lk.own{opacity:1}
.lockline{margin-top:8px;font-size:12.5px;color:var(--dim)}
.lockline button{background:none;border:0;color:var(--cyan);padding:0;text-decoration:underline;font-size:inherit}

.rack{position:sticky;top:86px;border:1px solid var(--line2);border-radius:18px;padding:14px;display:grid;gap:14px;
  background:linear-gradient(180deg,var(--panel2),var(--panel))}
@media (max-width:900px){.rack{position:static}}
.rk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rk-head h3{margin:0;font-family:var(--display);font-size:19px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel);text-align:left}
.chr .ci{font-size:22px}
.chr b{display:block;font-size:14px}
.chr small{display:block;color:var(--mute);font-size:11px}
.chr.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.chr:disabled{opacity:.4}
.gauge{padding:12px;border-radius:13px;background:var(--ink2);border:1px solid var(--line)}
.gnum{display:flex;align-items:baseline;gap:6px;font-family:var(--display)}
.gnum b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.gnum span{color:var(--mute);font-size:15px}
.gnum.over b{color:var(--neg)}
.gbar{height:10px;border-radius:5px;background:var(--panel2);margin:9px 0 7px;overflow:hidden;position:relative}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--hot),var(--hot2));border-radius:5px;transition:width .2s}
.gbar.over i{background:var(--neg)}
.gsub{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:3px 12px}
.gsub b{color:var(--text)}
.gsub .bad,.gsub .bad b{color:var(--neg)}
.slots{display:grid;gap:6px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;border:1px dashed var(--line2);background:none;color:var(--dim);font-size:13px;text-align:left;min-height:46px;width:100%}
.slot.fill{border-style:solid;border-color:color-mix(in srgb,var(--abil) 55%,transparent);background:color-mix(in srgb,var(--abil) 9%,transparent);color:var(--text);font-weight:600}
.slot .si{font-size:20px}
.slot .x{margin-left:auto;color:var(--dim);font-size:12px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.tc.pos{border-color:color-mix(in srgb,var(--pos) 55%,transparent)}
.tc.neg{border-color:color-mix(in srgb,var(--neg) 55%,transparent)}
.tc em{font-style:normal;font-family:var(--display)}
.tc.pos em{color:var(--pos)}.tc.neg em{color:var(--neg)}
.tc .x{color:var(--dim);font-size:11px}
.empty{font-size:12.5px;color:var(--dim)}
.cmb{padding:8px 10px;border-radius:11px;border:1px solid color-mix(in srgb,var(--combo) 50%,transparent);background:color-mix(in srgb,var(--combo) 10%,transparent);font-size:12.5px;line-height:1.4}
.cmb b{display:block;color:var(--combo);font-family:var(--display);font-size:14px;letter-spacing:.03em}
.cmb + .cmb{margin-top:6px}
.items .cmb + .cmb{margin-top:0}
.cmb.unk{border-style:dashed;color:var(--dim)}

.launch{position:sticky;bottom:0;z-index:3;margin-top:22px;display:flex;align-items:center;gap:12px;padding:12px max(16px,calc((100% - 1148px)/2));
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(9,11,24,.93);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.lstat{min-width:0;display:flex;flex-direction:column}
.lstat .st{font-weight:700;font-size:14px}
.lstat .st.bad{color:var(--neg)}.lstat .st.good{color:var(--pos)}
.lstat small{color:var(--mute);font-size:12.5px}
.go{margin-left:auto;border:0;border-radius:13px;padding:14px 28px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.1em;color:#1d0d03;
  background:linear-gradient(90deg,var(--hot),var(--hot2));box-shadow:0 8px 30px -8px var(--hot);white-space:nowrap;transition:transform .1s,filter .1s}
.go:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
.go:disabled{background:var(--panel2);color:var(--dim);box-shadow:none}

.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--cyan)}
.btn:disabled{opacity:.4}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.hot{background:linear-gradient(90deg,var(--hot),var(--hot2));border:0;color:#1d0d03;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:15px;padding:11px 18px}
.btn.hot:disabled{background:var(--panel2);color:var(--dim)}

.machine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin-top:18px;padding:20px;border-radius:18px;border:1px solid var(--line2);
  background:radial-gradient(100% 140% at 0% 0%,color-mix(in srgb,var(--hot) 22%,transparent),transparent 60%),var(--panel)}
.machine h2{font-family:var(--display);font-size:30px;margin:0}
.machine p{color:var(--mute);margin:6px 0 0;max-width:60ch}
.rates{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;font-weight:600}
.r1{color:#c0c6ee}.r2{color:var(--cyan)}.r3{color:var(--gold)}
.pullbtns{display:flex;flex-direction:column;gap:8px}
@media (max-width:640px){.machine{grid-template-columns:1fr}}
.pulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
.pull{position:relative;border-radius:15px;padding:16px 10px;text-align:center;border:1px solid var(--line);background:var(--panel);animation:reveal .55s cubic-bezier(.2,1.4,.4,1) both}
.pull.r2{border-color:var(--cyan);box-shadow:0 0 24px -8px var(--cyan)}
.pull.r3{border-color:var(--gold);box-shadow:0 0 32px -6px var(--gold);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),var(--panel)}
.pull .pi{font-size:36px}
.pull b{display:block;margin-top:6px}
.pull small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.pull .new{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;color:var(--ink);background:var(--gold);padding:2px 6px;border-radius:5px}
@keyframes reveal{0%{transform:scale(.4) rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}

.sec{margin-top:18px}
.sec h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.sec > p{color:var(--mute);margin:0 0 10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.step{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);line-height:1.5;color:#cdd2f0;font-size:14px}
.step b{display:block;font-family:var(--display);font-size:16px;color:var(--text);margin-bottom:4px}
.step .n{font-family:var(--display);color:var(--hot);font-weight:700}
kbd{font-family:var(--display);font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);background:var(--ink2)}
footer{margin:26px 0 6px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--dim)}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;pointer-events:none;
  padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#toast.combo{border-color:var(--combo);color:#ecd5ff}
#toast.bad{border-color:var(--neg)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:10;background:rgba(4,5,12,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.mbox{width:100%;max-width:560px;max-height:100%;overflow-y:auto;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel));padding:20px;animation:mIn .2s ease-out}
.mbox h2{font-family:var(--display);font-size:24px;margin:0 0 6px}
.mbox .mnote{color:var(--mute);font-size:13.5px;margin:0 0 12px;line-height:1.45}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
@keyframes mIn{from{transform:scale(.96);opacity:0}}
.decks{margin-top:10px}
.dk{display:flex;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--line)}
.dk .dn{flex:1;min-width:0}
.dk .dn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .dn span{font-size:13px}

.lvbox{background:none;border:0;max-width:980px;padding:4px}
.lvhead{text-align:center;margin-bottom:16px}
.lvtitle{font-family:var(--display);font-weight:700;font-size:clamp(36px,7vw,52px);letter-spacing:.14em;line-height:1;
  background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;animation:lvIn .45s cubic-bezier(.2,1.5,.4,1)}
.lvtitle.tre{background-image:linear-gradient(90deg,var(--gold),var(--hot))}
.lvsub{color:var(--mute);font-weight:600;margin-top:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.choice{--cc:var(--cyan);position:relative;text-align:left;padding:16px;border-radius:18px;border:1px solid color-mix(in srgb,var(--cc) 50%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 15%,var(--panel2)),var(--panel));display:flex;flex-direction:column;gap:6px;
  animation:cardIn .4s cubic-bezier(.2,1.3,.4,1) both;transition:transform .12s,box-shadow .12s}
.choice:hover{transform:translateY(-4px);box-shadow:0 14px 36px -12px var(--cc)}
.choice.c-ability{--cc:var(--abil)}.choice.c-pos{--cc:var(--pos)}.choice.c-neg{--cc:var(--neg)}.choice.c-weapon{--cc:var(--cyan)}.choice.c-item{--cc:var(--gold)}
.choice .ck{position:absolute;top:12px;right:12px;font-family:var(--display);font-size:12px;color:var(--mute);border:1px solid var(--line2);border-radius:6px;padding:0 7px}
.choice .cic{font-size:36px;line-height:1}
.choice .ckind{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--cc);text-transform:uppercase}
.choice .cname{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.pips{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.pips i{width:13px;height:6px;border-radius:2px;background:var(--line2)}
.pips i.f{background:var(--cc)}
.pips i.n{background:var(--text);animation:blink .7s infinite alternate}
.pips span{font-size:11px;color:var(--mute);margin-left:6px;font-weight:700;font-family:var(--display)}
.clines{display:grid;gap:4px;font-size:13.5px;margin-top:4px}
.clines div{display:flex;justify-content:space-between;gap:10px}
.clines div.wide{flex-direction:column;gap:1px}
.clines span{color:var(--mute)}
.clines b{font-variant-numeric:tabular-nums;white-space:nowrap}
.clines .star b{color:var(--gold)}
.clines .star span::before{content:'★ ';color:var(--gold)}
.lvfoot{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px;color:var(--dim);font-size:12.5px;flex-wrap:wrap}
@keyframes cardIn{from{transform:translateY(26px) scale(.94);opacity:0}}
@keyframes lvIn{from{transform:scale(1.7);opacity:0}}
@keyframes blink{to{opacity:.3}}

.res h2{font-family:var(--display);font-size:clamp(32px,6vw,44px);letter-spacing:.08em;margin:0;text-align:center}
.res h2.win{color:var(--gold);text-shadow:0 0 30px color-mix(in srgb,var(--gold) 60%,transparent)}
.res h2.lose{color:var(--neg)}
.res .sub{text-align:center;color:var(--mute);margin:4px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{padding:10px;border-radius:12px;background:var(--ink2);border:1px solid var(--line);text-align:center}
.tile small{display:block;font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.tile b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.res h3{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.dmr{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.dmr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmr div{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.dmr i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--hot2))}
.dmr b{font-variant-numeric:tabular-nums;font-size:12.5px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:4px 0}
.row b{font-variant-numeric:tabular-nums;color:var(--gold)}
.row.total{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-weight:700}
.unl{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- in-game HUD ---------- */
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.xptop{position:absolute;left:0;right:0;top:0;height:7px;background:rgba(0,0,0,.55)}
.xptop i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 14px var(--cyan)}
.hudrow{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:flex-start;gap:10px;padding:0 12px}
.lvb{font-family:var(--display);font-weight:700;font-size:12px;padding:4px 9px;border-radius:9px;background:rgba(9,11,24,.75);border:1px solid var(--line2);letter-spacing:.08em}
.lvb b{font-size:19px;color:var(--cyan);margin-left:3px}
.hpw{flex:0 1 260px;min-width:100px}
.hpbar{height:15px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d6a,#ff8a5c);transition:width .12s}
.hpt{font-size:11.5px;font-weight:700;margin-top:3px;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.clock{position:absolute;left:50%;top:0;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:30px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.9);font-variant-numeric:tabular-nums}
.clock.boss{color:var(--neg)}
.kills{white-space:nowrap;margin-left:auto;font-family:var(--display);font-weight:700;font-size:17px;text-shadow:0 1px 3px #000;padding-top:4px;font-variant-numeric:tabular-nums}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:11px;border:1px solid var(--line2);background:rgba(9,11,24,.75);font-weight:800;font-size:14px}
.chain{position:absolute;right:14px;top:calc(68px + env(safe-area-inset-top,0px));text-align:right;font-family:var(--display);font-weight:700}
.chain b{display:block;font-size:32px;line-height:1;color:var(--hot2);text-shadow:0 0 18px var(--hot)}
.chain small{font-size:11px;color:#d6daf5;letter-spacing:.12em;text-shadow:0 1px 3px #000}
.chain.pop b{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(1.35)}}
.bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));width:min(520px,70vw);text-align:center}
.bossbar span{font-family:var(--display);font-weight:700;letter-spacing:.24em;font-size:12px;color:var(--neg);text-shadow:0 1px 3px #000}
.bossbar div{height:11px;border-radius:6px;background:rgba(0,0,0,.65);border:1px solid var(--neg);overflow:hidden;margin-top:3px}
.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#ff2e63,#ff8a5c)}
#icons{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 90px)}
.hi{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:rgba(9,11,24,.78);border:1px solid var(--line2)}
.hi b{position:absolute;right:-5px;bottom:-5px;font-size:10px;font-family:var(--display);background:var(--ink);border:1px solid currentColor;border-radius:5px;padding:0 4px;line-height:15px}
.hi.w{border-color:color-mix(in srgb,var(--cyan) 60%,transparent);color:var(--cyan)}
.hi.a{border-color:color-mix(in srgb,var(--abil) 60%,transparent);color:var(--abil)}
.hi.p{border-color:color-mix(in srgb,var(--pos) 60%,transparent);color:var(--pos)}
.hi.n{border-color:color-mix(in srgb,var(--neg) 60%,transparent);color:var(--neg)}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;padding:0 16px}
#banner.show{animation:ban 2.3s ease-out forwards}
#banner .bt{font-family:var(--display);font-weight:700;font-size:clamp(28px,6.5vw,58px);letter-spacing:.16em;color:var(--text);text-shadow:0 0 26px var(--hot)}
#banner .bs{color:#d6daf5;font-weight:600;margin-top:6px;text-shadow:0 1px 4px #000}
#banner.warn .bt{color:var(--neg);text-shadow:0 0 34px var(--neg)}
#banner.warn::before{content:'';position:absolute;left:0;right:0;top:-14px;bottom:-14px;z-index:-1;opacity:.3;
  background:repeating-linear-gradient(135deg,var(--neg) 0 18px,transparent 18px 36px)}
#banner.elite .bt{color:var(--gold);text-shadow:0 0 28px var(--gold)}
@media (max-width:560px){
  .clock{top:40px;font-size:24px}
  .chain{top:calc(122px + env(safe-area-inset-top,0px))}
  .chain b{font-size:26px}
  .bossbar{top:calc(84px + env(safe-area-inset-top,0px))}
  .kills{font-size:15px}
}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="xptop"><i id="xpFill"></i></div>
  <div class="hudrow">
    <div class="lvb">LV<b id="lvN">1</b></div>
    <div class="hpw"><div class="hpbar"><i id="hpFill"></i></div><div class="hpt" id="hpT"></div></div>
    <div class="clock" id="clock"></div>
    <div class="kills" id="killN"></div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
  </div>
  <div class="chain" id="chain" hidden><b id="chainN">0</b><small id="chainS">CHAIN</small></div>
  <div class="bossbar" id="bossbar" hidden><span>BOSS</span><div><i id="bossFill"></i></div></div>
  <div id="icons"></div>
  <div id="banner"></div>
</div>

<div id="hub">
  <header class="bar" id="topbar"></header>
  <main class="wrap" id="main"></main>
  <div class="launch" id="launch"></div>
</div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   DATA — add new content here. Everything else reads from these tables.
   lv(L) returns the numbers for level L; `show` lists which of them the
   level-up cards display as "before → after".
   ===================================================================== */

const MAX_LV = {weapon:10, ability:10, pos:8, neg:4};

const CHARACTERS = {
  mage:  {name:'Mage',  icon:'🧙', hp:90,  speed:160, armor:0, weapon:'bolt',   color:'#5cc8ff',
          desc:'Ranged. Fires arcane bolts at the nearest enemy.'},
  knight:{name:'Knight',icon:'🛡️', hp:140, speed:140, armor:1, weapon:'cleave', color:'#ffb23d',
          desc:'Melee. Cleaves nearby enemies. High HP, 1 armor.'},
};

const WEAPONS = {
  bolt:  {name:'Arcane Bolt', icon:'✨',
    lv:L => ({dmg:14 * (1 + 0.08 * (L - 1)), count:1 + (L >= 3) + (L >= 6) + (L >= 9), pierce:(L >= 5) + (L >= 10), cd:0.6 * (1 - 0.025 * (L - 1))}),
    show:[['dmg','Damage','1'],['count','Bolts','int'],['pierce','Pierce','int'],['cd','Cooldown','s']]},
  cleave:{name:'Cleave', icon:'🗡️',
    lv:L => ({dmg:26 * (1 + 0.1 * (L - 1)), range:95 * (1 + 0.03 * (L - 1)), back:L >= 6 ? 1 : 0, cd:0.9 * (1 - 0.03 * (L - 1))}),
    show:[['dmg','Damage','1'],['range','Range','int'],['back','Back slash','yes'],['cd','Cooldown','s']]},
};

// type: ability | pos (positive trait) | neg (negative trait)
// cost: points it uses (ability/pos) or points it gives back (neg)
// rarity: 1 common, 2 rare, 3 epic (gacha weight)
const ITEMS = {
  orbit:     {type:'ability',icon:'🌀',name:'Orbit Blades',cost:3,rarity:1,desc:'2 blades circle around you.',
    lv:L => ({n:2 + (L >= 4) + (L >= 7) + (L >= 10), dmg:8 * (1 + 0.1 * (L - 1)), rad:75 + 3 * (L - 1)}),
    show:[['n','Blades','int'],['dmg','Damage','1'],['rad','Radius','int']]},
  fireball:  {type:'ability',icon:'🔥',name:'Fireball',cost:4,rarity:1,desc:'Explodes on the nearest enemy, hitting an area.',
    lv:L => ({dmg:26 * (1 + 0.1 * (L - 1)), aoe:55 * (1 + 0.05 * (L - 1)), n:1 + (L >= 6) + (L >= 10), cd:2 * (1 - 0.04 * (L - 1))}),
    show:[['n','Fireballs','int'],['dmg','Damage','1'],['aoe','Blast radius','int'],['cd','Cooldown','s']]},
  frost:     {type:'ability',icon:'❄️',name:'Frost Nova',cost:3,rarity:1,desc:'A pulse that damages and slows nearby enemies.',
    lv:L => ({dmg:9 * (1 + 0.12 * (L - 1)), rad:105 * (1 + 0.05 * (L - 1)), cd:3 * (1 - 0.035 * (L - 1)), slow:2 + 0.1 * (L - 1)}),
    show:[['dmg','Damage','1'],['rad','Radius','int'],['slow','Slow time','s'],['cd','Cooldown','s']]},
  drone:     {type:'ability',icon:'🛸',name:'Drone',cost:2,rarity:1,desc:'A small drone follows you and shoots.',
    lv:L => ({n:1 + (L >= 5) + (L >= 10), dmg:8 * (1 + 0.1 * (L - 1)), cd:0.9 * (1 - 0.045 * (L - 1))}),
    show:[['n','Drones','int'],['dmg','Damage','1'],['cd','Fire interval','s']]},
  lightning: {type:'ability',icon:'⚡',name:'Lightning',cost:4,rarity:2,desc:'Strikes random enemies on screen.',
    lv:L => ({n:1 + (L >= 4) + (L >= 7) + (L >= 10), dmg:30 * (1 + 0.1 * (L - 1)), cd:1.8 * (1 - 0.035 * (L - 1))}),
    show:[['n','Strikes','int'],['dmg','Damage','1'],['cd','Cooldown','s']]},
  poison:    {type:'ability',icon:'☠️',name:'Toxic Trail',cost:2,rarity:2,desc:'Leaves poison puddles while you move.',
    lv:L => ({dps:12 * (1 + 0.12 * (L - 1)), size:22 * (1 + 0.05 * (L - 1)), life:2 + 0.1 * (L - 1)}),
    show:[['dps','Damage / s','1'],['size','Puddle size','int'],['life','Duration','s']]},
  shield:    {type:'ability',icon:'🔰',name:'Aegis',cost:3,rarity:2,desc:'Blocks one hit. Recharges in 8 s.',
    lv:L => ({cd:8 * (1 - 0.05 * (L - 1)), shock:L >= 5 ? 20 + 6 * (L - 5) : 0}),
    show:[['cd','Recharge','s'],['shock','Block shockwave','int']]},
  boomerang: {type:'ability',icon:'🪃',name:'Boomerang',cost:3,rarity:2,desc:'Flies forward, comes back, hits everything.',
    lv:L => ({n:1 + (L >= 4) + (L >= 8), dmg:14 * (1 + 0.1 * (L - 1)), cd:1.6 * (1 - 0.04 * (L - 1))}),
    show:[['n','Boomerangs','int'],['dmg','Damage','1'],['cd','Cooldown','s']]},

  tough:     {type:'pos',icon:'💪',name:'Tough',cost:2,rarity:1,desc:'Max HP +30%.',            lv:L => ({v:30 + 5 * (L - 1)}),     show:[['v','Max HP','pct']]},
  swift:     {type:'pos',icon:'👟',name:'Swift',cost:2,rarity:1,desc:'Move speed +20%.',         lv:L => ({v:20 + 3 * (L - 1)}),     show:[['v','Move speed','pct']]},
  power:     {type:'pos',icon:'⚔️',name:'Power',cost:3,rarity:1,desc:'All damage +20%.',         lv:L => ({v:20 + 4 * (L - 1)}),     show:[['v','Damage','pct']]},
  magnet:    {type:'pos',icon:'🧲',name:'Magnet',cost:1,rarity:1,desc:'Pickup range ×2.',         lv:L => ({v:100 + 20 * (L - 1)}),   show:[['v','Pickup range','pct']]},
  regen:     {type:'pos',icon:'💚',name:'Regeneration',cost:2,rarity:1,desc:'Recover 1 HP per second.', lv:L => ({v:1 + 0.25 * (L - 1)}), show:[['v','HP per second','hp']]},
  haste:     {type:'pos',icon:'⏱️',name:'Haste',cost:3,rarity:2,desc:'All cooldowns -12%.',      lv:L => ({v:12 + 2 * (L - 1)}),     show:[['v','Cooldowns','mpct']]},
  lucky:     {type:'pos',icon:'🍀',name:'Lucky',cost:2,rarity:2,desc:'Crit chance +12% (crits deal ×2).', lv:L => ({v:12 + 2.5 * (L - 1)}), show:[['v','Crit chance','pct']]},
  scholar:   {type:'pos',icon:'📘',name:'Scholar',cost:2,rarity:2,desc:'XP gained +25%.',         lv:L => ({v:25 + 5 * (L - 1)}),     show:[['v','XP gain','pct']]},
  berserker: {type:'pos',icon:'😡',name:'Berserker',cost:2,rarity:3,desc:'Damage ×2 while HP is below 30%.', lv:L => ({v:100 + 15 * (L - 1)}), show:[['v','Low-HP damage','pct']]},
  momentum:  {type:'pos',icon:'🏃',name:'Momentum',cost:2,rarity:3,desc:'While moving, damage +30% (scales with speed).', lv:L => ({v:30 + 5 * (L - 1)}), show:[['v','Moving damage','pct']]},
  siphon:    {type:'pos',icon:'🩸',name:'Siphon',cost:3,rarity:3,desc:'Kills have a 10% chance to heal 3 HP.', lv:L => ({v:10 + 1.5 * (L - 1)}), show:[['v','Heal chance','pct']]},

  // pen(f): the penalty text at strength f (1 = full, 0 = overcome)
  fragile:    {type:'neg',icon:'🥚',name:'Fragile',cost:4,rarity:1,desc:'Max HP -50%.',              pen:f => `Max HP −${r0(50 * f)}%`},
  sluggish:   {type:'neg',icon:'🐢',name:'Sluggish',cost:3,rarity:1,desc:'Move speed -25%.',         pen:f => `Move speed −${r0(25 * f)}%`},
  feeble:     {type:'neg',icon:'🪶',name:'Feeble',cost:3,rarity:1,desc:'Main weapon damage -40%.',   pen:f => `Weapon damage −${r0(40 * f)}%`},
  clumsy:     {type:'neg',icon:'🧤',name:'Clumsy',cost:2,rarity:1,desc:'Pickup range -50%.',         pen:f => `Pickup range −${r0(50 * f)}%`},
  brittle:    {type:'neg',icon:'🦴',name:'Brittle',cost:2,rarity:1,desc:'Damage taken +30%.',        pen:f => `Damage taken +${r0(30 * f)}%`},
  restless:   {type:'neg',icon:'🌪️',name:'Restless',cost:3,rarity:2,desc:'You can never stop moving.', pen:f => f > 0 ? `Always moving at ${r0(100 * f)}% speed` : 'Can stop freely'},
  nearsighted:{type:'neg',icon:'🌑',name:'Nearsighted',cost:3,rarity:2,desc:'You can only see a small area around you.', pen:f => f > 0 ? `Vision radius ${r0(visionFor(f))}` : 'Full vision'},
  dull:       {type:'neg',icon:'💤',name:'Dull',cost:3,rarity:2,desc:'XP gained -30%.',            pen:f => `XP gain −${r0(30 * f)}%`},
  cursed:     {type:'neg',icon:'💀',name:'Cursed',cost:2,rarity:2,desc:'Enemies have +25% HP.',    pen:f => `Enemy HP +${r0(25 * f)}%`},
};

// Combos: when every item in req is in the loadout, cost and/or effects change.
const COMBOS = [
  {id:'glass',     name:'Glass Cannon',    req:['fragile','berserker'], cost:{berserker:-1}, desc:'Berserker costs 1 less and triggers below 50% HP.'},
  {id:'perpetual', name:'Perpetual Motion',req:['restless','momentum'], cost:{momentum:-1},  desc:'Momentum costs 1 less and its bonus is doubled.'},
  {id:'thermal',   name:'Thermal Shock',   req:['fireball','frost'],                         desc:'Fireball deals +60% damage to slowed enemies.'},
  {id:'closeq',    name:'Close Quarters',  req:['nearsighted','orbit'], cost:{orbit:-1},     desc:'Orbit Blades costs 1 less and gets +1 blade.'},
  {id:'fortress',  name:'Fortress',        req:['sluggish','shield'],                        desc:'Aegis recharges 40% faster and you gain +2 armor.'},
  {id:'overcharge',name:'Overcharge',      req:['lightning','power'],   cost:{lightning:+1}, desc:'Lightning costs 1 MORE, but each strike chains to 2 more enemies.'},
  {id:'plague',    name:'Plague Walker',   req:['poison','restless'],                        desc:'Poison puddles are 50% bigger and last twice as long.'},
  {id:'bloomer',   name:'Late Bloomer',    req:['dull','scholar'],                           desc:'Level-ups offer 4 choices instead of 3.'},
  {id:'kite',      name:'Kite Runner',     req:['boomerang','swift'],   cost:{boomerang:-1}, desc:'Boomerang costs 1 less and flies 30% farther.'},
];

const ENEMIES = {
  chaser: {hp:12, speed:70,  dmg:7,  r:11, xp:1, color:'#ff4f7b', dark:'#6e0f2e', armor:0},
  runner: {hp:7,  speed:125, dmg:5,  r:9,  xp:1, color:'#b07cff', dark:'#341a66', armor:0},
  brute:  {hp:70, speed:48,  dmg:16, r:19, xp:4, color:'#ff8a3d', dark:'#6a2806', armor:0},
  armored:{hp:40, speed:58,  dmg:11, r:14, xp:3, color:'#a9b8de', dark:'#2a3352', armor:4},
};

// mix: [startTime, {enemyType: weight}] — the last entry whose time has passed is used
const STAGES = [
  {id:'s1',name:'Green Meadow',budget:6,dur:180,spawn:0.9,hpMul:1,speedMul:1,bossHp:1500,bossArmor:2,
   bg:'#0c1a14',grid:'#173126',accent:'#3dffa8',desc:'A calm field. Learn the basics.',rules:[],banned:[],forced:[],
   mix:[[0,{chaser:1}],[45,{chaser:3,runner:1}],[100,{chaser:3,runner:2,brute:1}]],
   reward:{chars:['knight'],items:['lightning'],coins:50}},
  {id:'s2',name:'Bat Cave',budget:5,dur:200,spawn:1.15,hpMul:1.1,speedMul:1.25,bossHp:2600,bossArmor:2,

const STARTER = ['orbit','fireball','frost','drone','tough','swift','power','magnet','regen','fragile','sluggish','feeble','clumsy','brittle'];
const STARTER_LOADOUT = ['orbit','fireball','fragile','tough'];
const MAX_ABILITIES = 3;
const DECK_SLOTS = 6;
const GACHA_COST = 100;
const DUPE_REFUND = 25;
const UNUSED_POINT_COINS = 15;
const TYPE_LABEL = {ability:'Abilities', pos:'Positive traits', neg:'Negative traits'};
const TYPE_ONE = {ability:'Ability', pos:'Positive trait', neg:'Negative trait'};
const TYPE_HINT = {ability:`Cost points · max ${MAX_ABILITIES} · attack automatically`, pos:'Cost points · passive bonus', neg:'Give points back · a handicap you can overcome'};

/* =====================================================================
   HELPERS
   ===================================================================== */
function r0(v){ return Math.round(v); }
function visionFor(f){ return f <= 0 ? Infinity : 190 + (1 - f) * 400; }
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const mod = (a, b) => ((a % b) + b) % b;
function fmtTime(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function fmtNum(v){ return v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   SAVE DATA
   ===================================================================== */
const SAVE_KEY = 'loadout-survivors-v1';
function defaultSave(){
  return {coins:200, unlocked:STARTER.slice(), chars:['mage'], cleared:{}, best:{}, decks:Array(DECK_SLOTS).fill(null), combos:[], seenGuide:false};
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const s = Object.assign(defaultSave(), JSON.parse(raw));
      while(s.decks.length < DECK_SLOTS) s.decks.push(null);
      return s;
    }
  }catch(e){}
  return defaultSave();
}
let save = loadSave();
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
const isUnlocked = id => save.unlocked.includes(id);

/* =====================================================================
   LOADOUT RULES (shared by the builder and the run)
   ===================================================================== */
function activeCombos(items){ return COMBOS.filter(c => c.req.every(r => items.includes(r))); }
function effCost(id, combos){
  let c = ITEMS[id].cost;
  for(const cb of combos) if(cb.cost && cb.cost[id]) c += cb.cost[id];
  return Math.max(0, c);
}
function loadoutCost(items){
  const combos = activeCombos(items);
  let t = 0;
  for(const id of items) t += ITEMS[id].type === 'neg' ? -effCost(id, combos) : effCost(id, combos);
  return t;
}
function abilityCount(items){ return items.filter(id => ITEMS[id].type === 'ability').length; }
function stageUnlocked(i){ return i === 0 || !!save.cleared[STAGES[i - 1].id]; }
function stageById(id){ return STAGES.find(s => s.id === id); }
function validate(stage, charId, items){
  const errs = [];
  const cost = loadoutCost(items);
  if(cost > stage.budget) errs.push(`Over budget by ${cost - stage.budget} pts. Remove an item or add a negative trait.`);
  const ab = abilityCount(items);
  if(ab > MAX_ABILITIES) errs.push(`Too many abilities (${ab}/${MAX_ABILITIES})`);
  if(!save.chars.includes(charId)) errs.push('That character is locked');
  for(const id of items){
    if(!isUnlocked(id) && !stage.forced.includes(id)) errs.push(ITEMS[id].name + ' is locked');
    if(stage.banned.includes(id)) errs.push(ITEMS[id].name + ' is banned on this stage');
  }
  for(const id of stage.forced) if(!items.includes(id)) errs.push(ITEMS[id].name + ' is required on this stage');
  return errs;
}

/* =====================================================================
   HUB UI
   ===================================================================== */
const hub = $('#hub'), modal = $('#modal'), mbox = $('#mbox');
let tab = 'stages';
let lastPulls = [];
let resetArmed = false;
const B = {stage:'s1', char:'mage', items:[], filter:'all', deckName:''};
if(!save.decks.some(Boolean) && !Object.keys(save.cleared).length) B.items = STARTER_LOADOUT.slice();

let toastT = 0;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg; t.className = 'on ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = ''; }, 2200);
}

function applyStageRules(){
  const st = stageById(B.stage);
  B.items = B.items.filter(id => ITEMS[id] && !st.banned.includes(id) && (isUnlocked(id) || st.forced.includes(id)));
  for(const id of st.forced) if(!B.items.includes(id)) B.items.push(id);
}
function unlockSource(id){
  const st = STAGES.find(s => s.reward.items && s.reward.items.includes(id));
  return st ? `Gacha, or first clear of ${st.name}` : 'Gacha';
}

function comboHint(id, sel){
  for(const c of COMBOS){
    if(!c.req.includes(id)) continue;
    if(!c.req.filter(r => r !== id).every(r => B.items.includes(r))) continue;
    if(sel) return `✦ ${c.name} active`;
    return save.combos.includes(c.id) ? `✦ Forms ${c.name}` : '✦ Reacts with your loadout… try it!';
  }
  return '';
}

function itemCard(id, st, combos){
  const it = ITEMS[id];
  const sel = B.items.includes(id), forced = st.forced.includes(id), banned = st.banned.includes(id);
  const full = it.type === 'ability' && !sel && abilityCount(B.items) >= MAX_ABILITIES;
  const eff = effCost(id, sel ? combos : activeCombos([...B.items, id]));
  const ptxt = (eff !== it.cost ? `<s>${it.cost}</s>` : '') + (it.type === 'neg' ? '+' : '') + eff;
  let tag = '';
  if(forced) tag = '<span class="tag">📌 Forced by this stage</span>';
  else if(banned) tag = '<span class="tag">🚫 Banned on this stage</span>';
  else {
    const c = comboHint(id, sel);
    if(c) tag = `<span class="tag combo">${c}</span>`;
    else if(full) tag = '<span class="tag">Ability slots are full</span>';
  }
  return `<button class="it t-${it.type} ${sel ? 'sel' : ''} ${full ? 'dim' : ''}" data-act="item" data-id="${id}" ${banned ? 'disabled' : ''} ${forced ? 'aria-disabled="true"' : ''}>
    <span class="ic">${it.icon}</span><span><span class="nm">${it.name}</span><span class="ds">${it.desc}</span></span>
    <span class="pt"><small>${it.type === 'neg' ? 'GIVES' : 'COST'}</small><b>${ptxt}</b></span>${tag}</button>`;
}

function stageCard(s, i){
  const un = stageUnlocked(i);
  return `<button class="stg ${B.stage === s.id ? 'on' : ''}" style="--sc:${s.accent}" ${un ? `data-act="stage" data-id="${s.id}"` : 'disabled'}>
    ${save.cleared[s.id] ? '<span class="sclr">CLEARED</span>' : ''}
    <span class="sn">${i + 1}</span>
    <span class="sname">${un ? s.name : '🔒 Locked'}</span>
    <span class="smeta">${un ? `Budget ${s.budget} pts · ${fmtTime(s.dur)}` : `Clear ${STAGES[i - 1].name}`}</span>
    ${un ? `<span class="sdesc">${s.desc}</span>` : ''}</button>`;
}

function briefHtml(st){
  const chips = ruleChips(st) || '<span class="rchip">No special rules</span>';
  const rw = [];
  if(save.cleared[st.id]) rw.push('<span class="rchip done">✓ First-clear reward claimed</span>');
  else {
    for(const c of st.reward.chars || []) rw.push(`<span class="rchip rew">${CHARACTERS[c].icon} ${CHARACTERS[c].name}</span>`);
    for(const i of st.reward.items || []) rw.push(`<span class="rchip rew">${ITEMS[i].icon} ${ITEMS[i].name}</span>`);
    rw.push(`<span class="rchip rew">🪙 ${st.reward.coins}</span>`);
  }
  return `<div class="brief" style="--sc:${st.accent}">
    <div><h2>${st.name}</h2><p>${st.desc}</p></div>
    <div class="bstats"><div><small>BUDGET</small><b>${st.budget} pts</b></div><div><small>SURVIVE</small><b>${fmtTime(st.dur)}</b></div><div><small>THEN</small><b>Boss</b></div>
      ${save.best[st.id] ? `<div><small>YOUR BEST</small><b style="font-size:15px;padding-top:6px">${esc(save.best[st.id])}</b></div>` : ''}</div>
    <div><div class="lbl">Stage rules</div><div class="chips">${chips}</div>${st.forced.length ? '<div class="note" style="margin-top:6px">Forced negative traits still give you their points.</div>' : ''}</div>
    <div><div class="lbl">First clear reward</div><div class="chips">${rw.join('')}</div></div></div>`;
}

function poolHtml(st, combos){
  const types = B.filter === 'all' ? ['ability','pos','neg'] : [B.filter];
  let h = `<div class="poolhead" style="margin-top:4px"><h3>Pick your items</h3><div class="seg">${[['all','All'],['ability','Abilities'],['pos','Positive'],['neg','Negative']]
    .map(([k, l]) => `<button data-act="filter" data-id="${k}" class="${B.filter === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
  for(const ty of types){
    const ids = Object.keys(ITEMS).filter(k => ITEMS[k].type === ty);
    const vis = ids.filter(k => isUnlocked(k) || st.forced.includes(k));
    const locked = ids.length - vis.length;
    h += `<div class="ghead t-${ty}">${TYPE_LABEL[ty]}<span>${TYPE_HINT[ty]}</span></div><div class="items">${vis.map(k => itemCard(k, st, combos)).join('')}</div>`;
    if(locked) h += `<div class="lockline">🔒 ${locked} more locked · <button data-act="tab" data-id="collection">See how to unlock them</button></div>`;
  }
  return h;
}

function rackHtml(st, combos){
  const cost = loadoutCost(B.items);
  let spent = 0, refund = 0;
  for(const id of B.items){ const c = effCost(id, combos); if(ITEMS[id].type === 'neg') refund += c; else spent += c; }
  const left = st.budget - cost, over = cost > st.budget;
  const pct = st.budget > 0 ? Math.max(0, Math.min(100, cost / st.budget * 100)) : (cost > 0 ? 100 : 0);
  let h = `<aside class="rack"><div class="rk-head"><h3>Your loadout</h3><button class="btn sm" data-act="decks">💾 Saved loadouts</button></div>`;
  h += '<div><div class="lbl">Character</div><div class="chars">';
  for(const [cid, c] of Object.entries(CHARACTERS)){
    const un = save.chars.includes(cid);
    h += `<button class="chr ${B.char === cid ? 'on' : ''}" ${un ? `data-act="char" data-id="${cid}"` : 'disabled'}>
      <span class="ci">${un ? c.icon : '🔒'}</span><span><b>${c.name}</b><small>${un ? `${c.hp} HP · ${WEAPONS[c.weapon].name}` : 'Clear stage 1'}</small></span></button>`;
  }
  h += '</div></div>';
  h += `<div class="gauge"><div class="lbl">Points</div><div class="gnum ${over ? 'over' : ''}"><b>${cost}</b><span>/ ${st.budget} budget</span></div>
    <div class="gbar ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div>
    <div class="gsub"><span>Spent <b>${spent}</b></span><span>Refunded <b>${refund}</b></span>
    ${over ? `<span class="bad">Over by <b>${-left}</b></span>` : `<span>Left <b>${left}</b> → +${Math.min(10, left) * UNUSED_POINT_COINS} 🪙 on clear</span>`}</div></div>`;
  const abl = B.items.filter(id => ITEMS[id].type === 'ability');
  h += `<div><div class="lbl"><span>Abilities</span><span>${abl.length} / ${MAX_ABILITIES}</span></div><div class="slots">`;
  for(let i = 0; i < MAX_ABILITIES; i++){
    const id = abl[i];
    h += id ? `<button class="slot fill" data-act="item" data-id="${id}"><span class="si">${ITEMS[id].icon}</span>${ITEMS[id].name}<span class="x">${effCost(id, combos)} pts ✕</span></button>`
            : `<div class="slot">Empty ability slot</div>`;
  }
  h += '</div></div>';
  const tr = B.items.filter(id => ITEMS[id].type !== 'ability').sort((a, b) => (ITEMS[a].type === 'neg') - (ITEMS[b].type === 'neg'));
  h += `<div><div class="lbl">Traits</div>${tr.length ? `<div class="tchips">${tr.map(id => {
    const it = ITEMS[id], forced = st.forced.includes(id), c = effCost(id, combos);
    return `<button class="tc ${it.type}" ${forced ? 'aria-disabled="true"' : ''} data-act="item" data-id="${id}" title="${esc(it.desc)}">${it.icon} ${it.name} <em>${it.type === 'neg' ? '+' : '−'}${c}</em>${forced ? ' 📌' : '<span class="x">✕</span>'}</button>`;
  }).join('')}</div>` : '<div class="empty">No traits yet. Negative traits give you extra points to spend.</div>'}</div>`;
  h += `<div><div class="lbl"><span>Combos</span><span>${save.combos.length} / ${COMBOS.length} found</span></div>`;
  h += combos.length ? combos.map(c => `<div class="cmb"><b>✦ ${c.name}</b>${c.desc}</div>`).join('') : '<div class="empty">Some pairs of items change each other. Look for ✦ hints on the cards.</div>';
  h += '</div>';
  if(B.items.length) h += `<div><button class="btn sm ghost" data-act="clear">Clear loadout</button></div>`;
  return h + '</aside>';
}

function ruleChips(st){
  const chips = [];
  for(const id of st.forced) chips.push(`<span class="rchip forced">📌 ${ITEMS[id].icon} ${ITEMS[id].name} forced</span>`);
  for(const id of st.banned) chips.push(`<span class="rchip banned">🚫 ${ITEMS[id].icon} ${ITEMS[id].name} banned</span>`);
  for(const r of st.rules) chips.push(`<span class="rchip">⚠ ${esc(r)}</span>`);
  return chips.join('');
}

function previewHtml(st){
  const ch = CHARACTERS[B.char], cost = loadoutCost(B.items), over = cost > st.budget, combos = activeCombos(B.items);
  const order = {ability:0, pos:1, neg:2};
  const items = B.items.slice().sort((a, b) => order[ITEMS[a].type] - order[ITEMS[b].type]);
  return `<aside class="preview">
    <div class="rk-head"><h3>Your loadout</h3><button class="btn sm" data-act="decks">💾 Saved loadouts</button></div>
    <div class="pvrow"><span class="ci">${ch.icon}</span><span><b>${ch.name}</b><small>${ch.hp} HP · ${WEAPONS[ch.weapon].name}</small></span>
      <span class="pvpts ${over ? 'over' : ''}"><b>${cost} / ${st.budget}</b><small>${over ? `Over by ${cost - st.budget} pts` : 'points used'}</small></span></div>
    ${items.length ? `<div class="tchips">${items.map(id => { const it = ITEMS[id];
      return `<span class="tc static ${it.type}">${it.icon} ${it.name} <em>${it.type === 'neg' ? '+' : '−'}${effCost(id, combos)}</em></span>`; }).join('')}</div>`
      : '<div class="empty">Your loadout is empty. You can still start, but you will only have your weapon.</div>'}

    <button class="btn wide" data-act="tab" data-id="loadout">✏️ Edit loadout</button></aside>`;
}

function renderGacha(){
  const pool = Object.keys(ITEMS), owned = pool.filter(isUnlocked).length;
  let h = `<div class="machine"><div><h2>Item Gacha</h2>
    <p>Each pull gives a random ability or trait. Duplicates refund ${DUPE_REFUND} 🪙. Negative traits are worth having too: they give you points.</p>
    <div class="rates"><span class="r1">Common 60%</span><span class="r2">Rare 30%</span><span class="r3">Epic 10%</span><span>Collection ${owned} / ${pool.length}</span></div></div>
    <div class="pullbtns"><button class="btn hot" data-act="pull" data-n="1" ${save.coins < GACHA_COST ? 'disabled' : ''}>Pull ×1 · ${GACHA_COST} 🪙</button>
    <button class="btn hot" data-act="pull" data-n="10" ${save.coins < GACHA_COST * 9 ? 'disabled' : ''}>Pull ×10 · ${GACHA_COST * 9} 🪙</button></div></div>`;
  if(lastPulls.length){
    h += '<div class="pulls">' + lastPulls.map((r, i) => {
      const it = ITEMS[r.id];

function renderCollection(){
  let h = `<div class="sec"><h2>Collection</h2><p>Every item in the game and how to get it.</p>`;
  for(const ty of ['ability','pos','neg']){
    h += `<div class="ghead t-${ty}">${TYPE_LABEL[ty]}</div><div class="items">`;
    for(const id of Object.keys(ITEMS).filter(k => ITEMS[k].type === ty)){

        ? `<div class="it t-${ty} lk own"><span class="ic">${it.icon}</span><span><span class="nm">${it.name}</span><span class="ds">${it.desc}</span></span><span class="pt"><small>${lbl}</small><b>${ty === 'neg' ? '+' : ''}${it.cost}</b></span></div>`
        : `<div class="it t-${ty} lk"><span class="ic">🔒</span><span><span class="nm">???</span><span class="ds">${['','Common','Rare','Epic'][it.rarity]} · ${unlockSource(id)}</span></span><span class="pt"><small>${lbl}</small><b>?</b></span></div>`;

  for(const c of COMBOS){
    h += save.combos.includes(c.id)
      ? `<div class="cmb"><b>✦ ${c.name}</b>${c.req.map(r => ITEMS[r].icon + ' ' + ITEMS[r].name).join(' + ')}<br>${c.desc}</div>`
      : `<div class="cmb unk"><b>✦ ???</b>Hint: involves ${ITEMS[c.req[0]].type === 'neg' ? 'a negative trait' : ITEMS[c.req[0]].type === 'pos' ? 'a positive trait' : 'an ability'}</div>`;
  }
  return h + '</div></div>';
}

function renderGuide(){
  return `<div class="sec"><h2>How to play</h2><p>One run takes about 4–5 minutes.</p><div class="steps">

function discoverCombos(){
  for(const c of activeCombos(B.items)) if(!save.combos.includes(c.id)){
    save.combos.push(c.id); persist();
    toast(`✦ New combo found: ${c.name}!`, 'combo');
  }
}

function gachaPull(n){
  const cost = n === 10 ? GACHA_COST * 9 : GACHA_COST;
  if(save.coins < cost) return;
  save.coins -= cost;
  lastPulls = [];
  for(let i = 0; i < n; i++){
    const roll = Math.random();
    const rarity = roll < 0.6 ? 1 : roll < 0.9 ? 2 : 3;
    const pool = Object.keys(ITEMS).filter(k => ITEMS[k].rarity === rarity);
    const id = pool[Math.floor(Math.random() * pool.length)];
    const isNew = !isUnlocked(id);
    if(isNew) save.unlocked.push(id); else save.coins += DUPE_REFUND;
    lastPulls.push({id, isNew});
  }
  persist();
}

hub.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  const act = t.dataset.act, id = t.dataset.id;
  if(act !== 'reset') resetArmed = false;
  switch(act){
    case 'tab': tab = id; hub.scrollTop = 0; break;
    case 'stage': {
      const before = B.items.slice();
      B.stage = id; applyStageRules();
      const removed = before.filter(x => !B.items.includes(x)), added = B.items.filter(x => !before.includes(x));
      const msg = [];
      if(removed.length) msg.push('Removed ' + removed.map(x => ITEMS[x].name).join(', ') + ' (banned here)');
      if(added.length) msg.push('Added ' + added.map(x => ITEMS[x].name).join(', ') + ' (forced here)');
      if(msg.length) toast(msg.join(' · '));
      break;
    }
    case 'char': B.char = id; break;
    case 'filter': B.filter = id; break;
    case 'hideIntro': save.seenGuide = true; persist(); break;
    case 'clear': B.items = stageById(B.stage).forced.slice(); break;
    case 'item': {
      const st = stageById(B.stage), it = ITEMS[id];
      if(st.forced.includes(id)){ toast(`${it.name} is forced by this stage.`, 'bad'); return; }
      if(st.banned.includes(id) || !isUnlocked(id)) return;
      if(B.items.includes(id)) B.items = B.items.filter(x => x !== id);
      else {
        if(it.type === 'ability' && abilityCount(B.items) >= MAX_ABILITIES){ toast(`Ability slots are full (${MAX_ABILITIES}). Remove one first.`, 'bad'); return; }
        B.items.push(id);
      }
      discoverCombos();
      break;
    }
    case 'decks': openDecks(); return;
    case 'start': {
      const st = stageById(B.stage);
      if(validate(st, B.char, B.items).length) return;
      startRun(st, B.char, B.items.slice()); return;
    }
    case 'pull': gachaPull(+t.dataset.n); break;
    case 'reset':
      if(!resetArmed){ resetArmed = true; break; }
      resetArmed = false; save = defaultSave(); persist();
      B.stage = 's1'; B.char = 'mage'; B.items = STARTER_LOADOUT.slice(); lastPulls = []; break;
  }
  renderHub();
});
