    if(G.t > (e.sideT || 0)){ e.sideT = G.t + rand(1.5, 3); e.side = -e.side; }
    const a = want + e.side * .95;
    e.x += Math.cos(a) * sp * dt; e.y += Math.sin(a) * sp * dt;
    return true;
  },
  // floats in place-ish and fires slowing bubbles; every few shots a bubble that traps you
  siren(e, ai, dt, d, dx, dy, sp){
    const p = G.p;
    if(e.aT <= 0 && d < ai.range && dgLos(e.x, e.y, p.x, p.y)){
      e.aT = ai.cd; e.shots = (e.shots || 0) + 1;
      const a0 = Math.atan2(dy, dx);
      if(e.shots % ai.trapEvery === 0) ebullet(e.x, e.y, a0, ai.bs * .75, ai.dmg * (e.pow || 1), '#e6fbff', {root:ai.trap, r:15, bubble:true});
      else for(const o of [-.16, 0, .16]) ebullet(e.x, e.y, a0 + o, ai.bs, ai.dmg * .7 * (e.pow || 1), '#9fe8ff', {slow:ai.slow, r:7, bubble:true});
    }
    if(d < ai.keep){ e.x -= dx / d * sp * .7 * dt; e.y -= dy / d * sp * .7 * dt; return true; }
    return d < ai.keep + 60;
  },
  // quick in water, sluggish on land; now and then it charges the water around itself
  eel(e, ai, dt, d, dx, dy, sp){
    if(e.aT <= 0 && d < 300 && dgWaterAt(e.x, e.y)){
      e.aT = ai.cd;
      addCircle(e.x, e.y, ai.r, ai.warn, ai.dmg * (e.pow || 1), '#fff07a');
      e.stunT = ai.warn * .7;
    }
    dgChase(e, sp, dt, dx, dy, d);
    return true;
  },
  // drifts toward you
  jelly(e, ai, dt, d, dx, dy, sp){ dgChase(e, sp, dt, dx, dy, d); return true; },
  // the Siren Matriarch's mirror images: they stay put, shoot bubbles and fade away
  decoy(e, ai, dt, d, dx, dy){
    e.lifeT = (e.lifeT === undefined ? ai.life : e.lifeT) - dt;
    if(e.lifeT <= 0){ e.dead = true; burst(e.x, e.y, '#9fe8ff', 16, 180); return true; }
    if(e.aT <= 0){ e.aT = ai.cd; ebullet(e.x, e.y, Math.atan2(dy, dx), 200, ai.dmg, '#9fe8ff', {slow:1, r:8, bubble:true}); }
    return true;
  },
};

// tide wraiths climb out of the flood water when it reaches its height, somewhere near you
function dgFloodWraiths(n){
  const D = G.dg, L = D.L, p = G.p, pool = [];
  const tx = Math.floor(p.x / DT), ty = Math.floor(p.y / DT);
  for(let y = ty - 11; y <= ty + 11; y++) for(let x = tx - 11; x <= tx + 11; x++){
    if(x < 0 || y < 0 || x >= L.W || y >= L.H) continue;
    const i = y * L.W + x, d = Math.hypot(x - tx, y - ty);
    if(L.low[i] && L.t[i] !== TT.WALL && !L.z[i] && d > 4.5) pool.push([(x + .5) * DT, (y + .5) * DT]);
  }
  if(!pool.length) return;
  for(let k = 0; k < n; k++){
    const s = pool[Math.floor(Math.random() * pool.length)], e = dgSpawn('wraith', s[0], s[1], false, 0);
    if(e) e.flood = true;
  }
  addText(p.x, p.y - 56, 'Tide wraiths rise from the water', 2);
}
/* ---------- dungeon: floor objectives, the reservoir hunter and the new enemies (floors 6–10) ----------
   def.objective.kind: valves (stand at each valve until it turns; it drains part of the canal),
   nests (break every brood clutch), lanterns (light them all), pumps (stay by each pump until it runs;
   its hall drains), admiral (beat the floor boss; the reservoir drains). Until it is done, the gates
   of the boss zone (or def.objective.gateZone) stay locked. */
function dgObjInit(){
  const D = G.dg, L = D.L, def = D.def, O = def.objective;
  D.obj = null; D.later = [];
  D.hunter = def.hunter ? {x:20.5 * DT, y:55.5 * DT, a:0, cd:0, spitT:4, alpha:1, state:'patrol'} : null;
  if(D.hunter) dgHunterPass();
  if(O){
    const sites = O.kind === 'lanterns' ? L.lanterns.filter(o => L.z[o.i] !== 10) : O.kind === 'admiral' ? [] : L.sites;
    D.obj = {kind:O.kind, O, need:O.kind === 'admiral' ? 1 : sites.length, done:0, complete:false, after:O.after || '',
      sites:sites.map((st, k) => Object.assign(st, {k, prog:0, state:'idle', name:(O.sites && O.sites[k] && O.sites[k].name) || '', drain:(O.sites && O.sites[k] && O.sites[k].drain) || []}))};
    const gz = O.gateZone || 10;
    for(const g of L.gates) if(g.zones.includes(gz)){ g.locked = true; dgSetGate(g, false); }
    if(O.kind === 'nests') for(const st of D.obj.sites){
      const e = dgSpawn('nest', (st.x + .5) * DT, (st.y + .5) * DT, false, 0);
      if(e){ e.rise = e.riseMax = 0; st.e = e; }
    }
  }
  // some groups are there from the start (anglers waiting in the dark)
  const PK = def.packs || DG_PACKS;
  for(const pk of L.packs) if(PK[pk.kind] && PK[pk.kind].early){
    pk.done = true;
    const comp = PK[pk.kind].make(D.floor); if(pk.elite) comp.elite = PK[pk.kind].elite;
    dgSpawnGroup(comp, (pk.x + .5) * DT, (pk.y + .5) * DT, 0, true);
  }
}
const dgSitePos = st => [(st.x + .5) * DT, (st.y + .5) * DT];
function dgObjText(){
  const O = G.dg.obj, T = O.O.text;
  const run = O.sites.find(st => st.state === 'run');
  if(run && O.kind === 'valves') return `Turning the ${run.name.toLowerCase()} · ${Math.round(run.prog * 100)}%${run.near ? '' : ' · go back to it'}`;
  if(run && O.kind === 'pumps') return `${run.name} ${Math.round(run.prog * 100)}%${run.near ? ' · hold on' : ' · stay next to it!'}`;
  if(O.kind === 'admiral') return T;
  return `${T} · ${O.done} / ${O.need}`;
}
function dgObjTick(dt){
  const D = G.dg, O = D.obj, p = G.p;
  for(let k = D.later.length - 1; k >= 0; k--){ const l = D.later[k]; l.t -= dt; if(l.t <= 0){ D.later.splice(k, 1); l.fn(); } }
  if(!O || O.complete) return;
  const def = O.O;
  if(O.kind === 'valves' || O.kind === 'pumps'){
    const R = O.kind === 'valves' ? 96 : def.radius;
    let busy = false;
    for(const st of O.sites){
      if(st.state === 'done') continue;
      const [x, y] = dgSitePos(st);
      st.near = Math.hypot(p.x - x, p.y - y) < R;
      if(st.near && st.state === 'idle'){ st.state = 'run'; dgSiteStart(st); }
      if(st.state !== 'run') continue;
      busy = true;
      if(st.near) st.prog = Math.min(1, st.prog + dt / def.time);
      else if(O.kind === 'valves') st.prog = Math.max(0, st.prog - dt * .08);
      if(O.kind === 'pumps' && st.near){ st.waveT -= dt; if(st.waveT <= 0){ st.waveT = def.wave.every; dgSiteWave(st); } }   // walk away and the pump (and the water) goes quiet
      if(st.prog >= 1) dgSiteDone(st);
    }
    if(busy) dgObjective();
  } else if(O.kind === 'lanterns'){
    const lit = O.sites.filter(o => o.lit);
    if(lit.length !== O.done){
      O.done = lit.length;
      const o = lit[lit.length - 1];
      if(o && O.done < O.need) addText((o.x + .5) * DT, (o.y + .5) * DT - 70, `LANTERN ${O.done} / ${O.need}`, 2);
      dgObjective();
    }
  }
  if(O.done >= O.need) dgObjComplete();
}
// a valve starts turning (an ambush answers) or a pump starts up (the water fights back)
function dgSiteStart(st){
  const O = G.dg.obj, def = O.O, [x, y] = dgSitePos(st);
  sfx('charge'); G.shake = .25;
  if(O.kind === 'valves'){
    showBanner(st.name.toUpperCase(), 'warn', 'The valve screams. Something heard it');
    const [cx, cy] = dgFarSpot(x, y, 330);
    // the first valve brings a small ambush, every next one a bigger one, and the last an elite
    const k = .55 + .25 * O.done, comp = {};
    for(const t in def.ambush) comp[t] = Math.max(1, Math.round(def.ambush[t] * k));
    if(O.done === O.need - 1) comp.elite = 'sailor';
    dgSpawnGroup(comp, cx, cy, 0);
  } else {
    showBanner(st.name.toUpperCase(), 'warn', 'Stay next to the pump until it runs');
    st.waveT = 1.2;
  }
}
// pumps: wraiths and eels climb out of the hall's water, away from you
function dgSiteWave(st){
  const D = G.dg, L = D.L, p = G.p, base = D.obj.O.wave.comp, [r0] = st.drain;
  const comp = Object.assign({}, base); comp.wraith = (comp.wraith || 0) + D.obj.done;   // each pump fights back harder than the last
  if(!r0) return;
  const pool = [];
  for(let y = r0[1]; y <= r0[3]; y++) for(let x = r0[0]; x <= r0[2]; x++){
    const i = y * L.W + x, wx = (x + .5) * DT, wy = (y + .5) * DT, d = Math.hypot(wx - p.x, wy - p.y);
    if(!dgWalkBlocked(L, x, y) && d > 300 && d < 720 && (L.low[i] || L.t[i] === TT.DEEP)) pool.push([wx, wy]);
  }
  for(const type in comp) for(let k = 0; k < comp[type]; k++){
    const s = pool.length ? pool[Math.floor(Math.random() * pool.length)] : dgFarSpot(p.x, p.y, 380);
    dgSpawn(type, s[0], s[1], false, 0);
  }
}
function dgSiteDone(st){
  const D = G.dg, O = D.obj;
  st.state = 'done'; O.done++; G.shake = .4;
  if(O.kind === 'valves') showBanner(`${st.name.toUpperCase()} OPEN`, 'elite', `The canal drains · ${O.done} / ${O.need}`);
  else showBanner(`${st.name.toUpperCase()} RUNNING`, 'elite', `The hall drains for good · ${O.done} / ${O.need}`);
  sfx('treasure'); sfx('splash');
  dgDrain(st.drain);
  dgObjective();
}
function dgObjKill(e){
  const O = G.dg.obj;
  if(!O || O.complete || O.kind !== 'nests' || e.type !== 'nest') return;
  O.done++;
  showBanner(`CLUTCH ${O.done} / ${O.need}`, 'elite', O.done < O.need ? 'Its hatchlings scatter' : ''); sfx('treasure');
  for(const o of G.enemies) if(o.mom === e && !o.dead) o.mom = null;
  burst(e.x, e.y, '#ffcf6a', 30, 260);
  dgObjective();
}
function dgObjComplete(quiet){
  const D = G.dg, O = D.obj;
  if(O.complete) return;
  O.complete = true;
  for(const g of D.L.gates) if(g.locked){ g.locked = false; dgSetGate(g, true); }
  if(!quiet){ showBanner('THE WAY IS OPEN', 'elite', `${SKINS[D.def.boss].name} is waiting`); sfx('gate'); }
  dgObjective();
}
// a walkable spot about `r` from (x, y), as far from you as possible
function dgFarSpot(x, y, r){
  const L = G.dg.L, p = G.p; let best = null, bd = -1;
  for(let k = 0; k < 28; k++){
    const a = k / 28 * TAU, sx = x + Math.cos(a) * r, sy = y + Math.sin(a) * r;
    if(dgWalkBlocked(L, Math.floor(sx / DT), Math.floor(sy / DT)) || !dgLos(x, y, sx, sy)) continue;
    const d = Math.hypot(sx - p.x, sy - p.y); if(d > bd){ bd = d; best = [sx, sy]; }
  }
  return best || [x, y];
}
// water runs out of part of the map: canals and tanks become floor, low halls stop flooding
function dgDrain(rects){
  const D = G.dg, L = D.L;
  for(const [x0, y0, x1, y1] of rects) for(let y = y0; y <= y1; y++) for(let x = x0; x <= x1; x++){
    const i = y * L.W + x, t = L.t[i];
    if(t === TT.CURRENT || t === TT.DEEP){ L.t[i] = TT.FLOOR; L.cur[i] = 0; L.moss[i] = hash3(x, y, 77) < .4 ? 1 : 0; }
    L.low[i] = 0;
    if(Math.random() < .05) G.parts.push({x:(x + Math.random()) * DT, y:(y + Math.random()) * DT, vx:0, vy:-20, life:1.2, max:1.2, c:'#bff4ff', s:3});
  }
  D.flowDirty = true; D.mapDirty = true;
  if(D3.level) d3BuildLevel();
}
// floor 10: the Admiral's wreck breaks the great drain open
function dgReservoirDrain(){
  const D = G.dg, L = D.L;
  showBanner('THE RESERVOIR DRAINS', 'elite', 'The wreck breaks open the great drain. The lair gates grind open'); sfx('clear'); sfx('splash'); G.shake = .9;
  D.flood.full = false;
  if(D.hunter) D.hunter.flee = true;
  D.zones[10].state = 'cleared';
  for(const g of L.gates) if(g.zones.includes(10) && !g.locked) dgSetGate(g, true);
  setMusic(dgThemeOf(D.floor).song, 0);
  dgObjComplete(true);
}
function dgLater(t, fn){ G.dg.later.push({t, fn}); }
// something thrown in an arc: a warning circle where it lands, the object flying there, and an optional burst on landing
function dgLob(x0, y0, x1, y1, t, r, dmg, color, model, then){
  addCircle(x1, y1, r, t, dmg, color);
  G.fx.push({type:'lob', x0, y0, x:x1, y:y1, life:t, max:t, color, model, spin:rand(6, 11)});
  if(then) dgLater(t, then);
}
// a ring of shards flying out of a point
function dgShards(x, y, n, sp, dmg, color, model){
  const o = Math.random() * TAU;
  for(let i = 0; i < n; i++) ebullet(x, y, o + i / n * TAU, sp, dmg, color, {r:7, model});
}

/* ---------- the thing in the reservoir ----------
   It drifts slowly through the flooded lake. The moment you step into the water it hears you and comes
   at full speed through the lake, then bites from below after a short warning; get out and it circles
   near the shore for a while before it loses interest. On the walkways it surfaces now and then to spit.
   It sinks out of sight during the Admiral fight and leaves when the reservoir drains. */
function dgLakeAt(x, y){
  const D = G.dg, L = D.L, tx = Math.floor(x / DT), ty = Math.floor(y / DT);
  if(tx < 0 || ty < 0 || tx >= L.W || ty >= L.H) return false;
  const i = ty * L.W + tx;
  return !!(L.low[i] && L.t[i] !== TT.WALL && !L.z[i] && D.flood && D.flood.level > .5);
}
// where it can swim: the open lake, and under the narrow walkways that cross it (not under islands)
function dgHunterPass(){
  const L = G.dg.L, W = L.W, N = W * L.H, pass = L.hpass = new Uint8Array(N);
  const lake = i => L.low[i] && L.t[i] !== TT.WALL && !L.z[i];
  const reach = (x, y, dx, dy) => { for(let k = 1; k <= 4; k++){ const nx = x + dx * k, ny = y + dy * k; if(nx < 0 || ny < 0 || nx >= W || ny >= L.H) return false; const j = ny * W + nx; if(lake(j)) return true; if(L.t[j] === TT.WALL || L.z[j]) return false; } return false; };
  for(let y = 0; y < L.H; y++) for(let x = 0; x < W; x++){
    const i = y * W + x;
    if(lake(i)) pass[i] = 1;
    else if(L.t[i] !== TT.WALL && !L.z[i] && ((reach(x, y, 1, 0) && reach(x, y, -1, 0)) || (reach(x, y, 0, 1) && reach(x, y, 0, -1)))) pass[i] = 2;   // under a bridge
  }
}
const dgHunterAt = (x, y) => { const L = G.dg.L, tx = Math.floor(x / DT), ty = Math.floor(y / DT); return tx >= 0 && ty >= 0 && tx < L.W && ty < L.H && !!L.hpass[ty * L.W + tx] && G.dg.flood.level > .5; };
function dgNearLake(x, y, r){
  if(dgLakeAt(x, y)) return true;
  for(let k = 0; k < 8; k++){ const a = k / 8 * TAU; if(dgLakeAt(x + Math.cos(a) * r, y + Math.sin(a) * r)) return true; }
  return false;
}
// distance through the lake to the water around you (-1 where there is no way through)
function dgHunterField(){
  const D = G.dg, L = D.L, p = G.p, W = L.W, N = W * L.H;
  const f = D.hfield && D.hfield.length === N ? D.hfield : (D.hfield = new Int16Array(N));
  f.fill(-1);
  const lake = i => L.hpass[i];
  const q = [], tx = Math.floor(p.x / DT), ty = Math.floor(p.y / DT);
  for(let y = ty - 2; y <= ty + 2; y++) for(let x = tx - 2; x <= tx + 2; x++){
    if(x < 0 || y < 0 || x >= W || y >= L.H) continue;
    const i = y * W + x; if(lake(i)){ f[i] = 0; q.push(i); }
  }
  if(!q.length) return false;
  for(let h = 0; h < q.length; h++){
    const i = q[h], x = i % W, y = (i - x) / W;
    if(f[i] > 260) continue;
    for(const [dx, dy] of N4){ const j = (y + dy) * W + x + dx; if(f[j] < 0 && lake(j)){ f[j] = f[i] + 1; q.push(j); } }
  }
  return true;
}
// a random spot in the open lake within a few hundred units of (x, y)
function dgLakeSpot(x, y){
  for(let k = 0; k < 30; k++){ const a = Math.random() * TAU, r = rand(150, 520), sx = x + Math.cos(a) * r, sy = y + Math.sin(a) * r; if(dgLakeAt(sx, sy)) return [sx, sy]; }
  return [x, y];
}
function dgHunterTick(dt){
  const D = G.dg, H = D.hunter, hd = D.def.hunter, p = G.p;
  if(!H) return;
  if(H.flee || !D.flood || D.flood.level < .5){ H.alpha -= dt * .6; if(H.alpha <= 0) D.hunter = null; return; }
  H.hide = !!(G.boss || (D.zones[10] && D.zones[10].state === 'active'));
  if(H.hide){ H.state = 'patrol'; return; }
  if(H.surface > 0) H.surface -= dt;
  const wet = dgLakeAt(p.x, p.y), dp = Math.hypot(p.x - H.x, p.y - H.y);
  // the moment you step into the water it hears you, and comes at full speed
  if(wet && (H.state === 'patrol' || H.state === 'prowl')){
    H.state = 'alert'; H.stT = .45; H.surface = .8;
    sfx('warning'); G.shake = Math.max(G.shake, .25); addText(p.x, p.y - 50, 'IT HEARD YOU · GET OUT OF THE WATER', 2);
  }
  if(H.state === 'alert'){ H.stT -= dt; if(H.stT <= 0) H.state = 'rush'; }
  else if(H.state === 'rush' && !wet){ H.state = 'prowl'; H.stT = 4; }                        // you got out: it circles near the shore
  else if(H.state === 'prowl'){ H.stT -= dt; if(H.stT <= 0) H.state = 'patrol'; }
  // it finds its way through the lake to the water nearest to you (or drifts about when it has lost you)
  H.fieldT = (H.fieldT || 0) - dt;
  if(H.fieldT <= 0){ H.fieldT = H.state === 'rush' ? .2 : .5; H.hasField = H.state !== 'patrol' && dgHunterField(); }
  let tx, ty;
  const L = D.L, f = D.hfield, hi = tileAt(L, H.x, H.y);
  if(H.state === 'patrol' || !H.hasField){
    // drift between random spots in the lake, picking a new one when it gets there or gets stuck
    if(!H.wp || Math.hypot(H.wp[0] - H.x, H.wp[1] - H.y) < 40 || (H.stuck || 0) > .6){ H.wp = dgLakeSpot(p.x, p.y); H.stuck = 0; }   // it lurks somewhere near you
    tx = H.wp[0]; ty = H.wp[1];
    // too far off to swim straight there: follow the lake toward you
    if(Math.hypot(tx - H.x, ty - H.y) > 700){ H.hasField = H.hasField || dgHunterField(); if(H.hasField && f[hi] > 0) H.state = 'prowl', H.stT = 2; }
  }
  else if(f[hi] > 0){
    let best = f[hi], bx = 0, by = 0;
    const hx = hi % L.W, hy = (hi - hx) / L.W;
    for(const [ox, oy] of N8){
      const j = (hy + oy) * L.W + hx + ox, v = f[j];
      if(ox && oy && (f[hy * L.W + hx + ox] < 0 || f[(hy + oy) * L.W + hx] < 0)) continue;   // never cut a corner of the shore
      if(v >= 0 && v < best){ best = v; bx = ox; by = oy; }
    }
    tx = (hx + bx + .5) * DT; ty = (hy + by + .5) * DT;
  } else { tx = p.x; ty = p.y; }
  const sp = H.state === 'rush' ? hd.rush : H.state === 'prowl' ? hd.speed : H.state === 'alert' ? 0 : hd.speed * .5;
  const dx = tx - H.x, dy = ty - H.y, d = Math.hypot(dx, dy) || 1;
  const nx = H.x + dx / d * Math.min(d, sp * dt), ny = H.y + dy / d * Math.min(d, sp * dt);
  const ox = H.x, oy = H.y;
  if(dgHunterAt(nx, ny)){ H.x = nx; H.y = ny; } else if(dgHunterAt(nx, H.y)) H.x = nx; else if(dgHunterAt(H.x, ny)) H.y = ny;
  H.under = L.hpass[tileAt(L, H.x, H.y)] === 2;
  H.stuck = sp && Math.hypot(H.x - ox, H.y - oy) < sp * dt * .2 ? (H.stuck || 0) + dt : 0;
  if(d > 2) H.a = turnToward(H.a, Math.atan2(dy, dx), (H.state === 'rush' ? 9 : 3) * dt);
  H.cd -= dt; H.spitT -= dt;
  if(H.state === 'rush' && wet && H.cd <= 0 && dp < 170){
    // the jaws come up from below where you stand
    H.cd = hd.cd;
    const bx = p.x + p.vx * .2, by = p.y + p.vy * .2;
    addCircle(bx, by, hd.r, hd.warn, hd.dmg, '#0e3a4a');
    H.bite = {x:bx, y:by, t:hd.warn, max:hd.warn};
    sfx('charge'); addText(p.x, p.y - 44, 'BENEATH YOU · ROLL!', 1.2);
    dgLater(hd.warn, () => { if(G.dg.hunter){ G.shake = .55; sfx('splash'); burst(bx, by, '#bff4ff', 26, 300); } });
  } else if(!wet && H.state !== 'rush' && H.spitT <= 0 && dp < 560){
    H.spitT = hd.spitEvery; H.surface = 1;
    const a0 = Math.atan2(p.y - H.y, p.x - H.x);
    for(let i = -2; i <= 2; i++) ebullet(H.x, H.y, a0 + i * .15, 310, hd.dmg * .35, '#7df9ff', {r:9});
    sfx('splash');
  }
  if(H.bite){ H.bite.t -= dt; if(H.bite.t < -.5) H.bite = null; }
}

/* ---------- new enemies ---------- */
Object.assign(DG_AI, {
  // grown into the wall: bursts of three, and every third volley a shell lobbed at you
  turret(e, ai, dt, d, dx, dy){
    const p = G.p;
    e.face = Math.atan2(dy, dx);
    if(e.burst > 0){
      e.burstT -= dt;
      if(e.burstT <= 0){ e.burstT = ai.gap; e.burst--; ebullet(e.x, e.y, e.face + rand(-ai.spread, ai.spread), ai.bs, ai.dmg * (e.pow || 1), '#ffd08a', {r:7, model:'rivet'}); sfx('lob'); }
      return true;
    }
    if(e.aT <= 0 && d < ai.range && dgLos(e.x, e.y, p.x, p.y)){
      e.aT = ai.cd; e.vol = (e.vol || 0) + 1;
      if(e.vol % ai.lobEvery === 0){
        const tx = p.x + p.vx * .6, ty = p.y + p.vy * .6, pw = e.pow || 1;
        dgLob(e.x, e.y, tx, ty, 1.1, 64, ai.lobDmg * pw, '#ffb04a', 'shell', () => dgShards(tx, ty, 6, 200, ai.dmg * .7 * pw, '#ffd08a', 'rivet'));
      } else { e.burst = ai.n; e.burstT = 0; }
    }
    return true;
  },
  // swells up near you, then bursts into a ring of spines
  puffer(e, ai, dt, d, dx, dy, sp){
    if(e.st === 'puff'){
      e.stT -= dt; e.vis2 = 1 + (1 - Math.max(0, e.stT) / ai.warn) * .75;
      if(e.stT <= 0){
        e.st = null; e.vis2 = 1; e.aT = ai.cd;
        dgShards(e.x, e.y, ai.n, ai.bs, ai.dmg * (e.pow || 1), '#ffe08a', 'spine'); sfx('shock');
      }
      return true;
    }
    if(e.aT <= 0 && d < ai.trig){ e.st = 'puff'; e.stT = ai.warn; sfx('charge'); return true; }
    dgChase(e, sp, dt, dx, dy, d);
    return true;
  },
  // waits in the dark with its lure lit; when you come close (or hit it) it lunges, and keeps lunging
  angler(e, ai, dt, d, dx, dy, sp){
    if(e.lurk === undefined){ e.lurk = true; e.hp0 = e.hp; }
    const lunge = () => {
      e.st = 'wind'; e.stT = ai.wind; e.da = Math.atan2(dy, dx);
      G.hazards.push({kind:'tele', x:e.x, y:e.y, a:e.da, len:ai.dash * ai.dur + 50, w:e.r * 2.2, warn:ai.wind, max:ai.wind}); sfx('charge');
    };
    if(e.lurk){ if(d < ai.wake || e.hp < e.hp0){ e.lurk = false; lunge(); } return true; }
    if(e.st === 'wind'){ e.stT -= dt; if(e.stT <= 0){ e.st = 'dash'; e.stT = ai.dur; sfx('dash'); } return true; }
    if(e.st === 'dash'){
      e.stT -= dt; e.x += Math.cos(e.da) * ai.dash * dt; e.y += Math.sin(e.da) * ai.dash * dt; dgCollide(e, e.r);
      if(e.stT <= 0){ e.st = null; e.aT = ai.cd; }
      return true;
    }
    if(e.aT <= 0 && d < 320){ lunge(); return true; }
    dgChase(e, sp * .85, dt, dx, dy, d);
    return true;
  },
  // rushes you; one that rose out of a flood falls apart a moment after the water is gone
  wraith(e, ai, dt, d, dx, dy, sp){
    if(e.flood){
      e.dryT = dgWaterAt(e.x, e.y) ? 0 : (e.dryT || 0) + dt;
      if(e.dryT > 1.4){ e.dead = true; e.hp = 0; burst(e.x, e.y, '#c8fff4', 14, 200); return true; }
    }
    dgChase(e, sp, dt, dx, dy, d);
    return true;
  },
  // leaps out of the water and lands where you are going
  leaper(e, ai, dt, d, dx, dy, sp){
    if(e.jump){
      const J = e.jump; J.t += dt;
      const q = Math.min(1, J.t / ai.air);
      e.x = J.x0 + (J.x1 - J.x0) * q; e.y = J.y0 + (J.y1 - J.y0) * q; e.airH = Math.sin(q * Math.PI) * 120; e.noTouch = q < .9;
      if(q >= 1){ e.jump = null; e.airH = 0; e.noTouch = false; e.aT = ai.cd; dgCollide(e, e.r); burst(e.x, e.y, '#bff4ff', 10, 180); }
      return true;
    }
    const wet = dgWaterAt(e.x, e.y);
    if(e.aT <= 0 && wet && d < ai.range && d > 80){
      const p = G.p, tx = p.x + p.vx * .45, ty = p.y + p.vy * .45;
      e.jump = {t:0, x0:e.x, y0:e.y, x1:tx, y1:ty};
      addCircle(tx, ty, ai.r, ai.air, ai.dmg * (e.pow || 1), '#7df9ff'); sfx('splash');
      return true;
    }
    dgChase(e, sp * (wet ? 1 : .55), dt, dx, dy, d);
    return true;
  },
  // a brood clutch: hatches crabs (and the odd spinefish) while you are anywhere near
  nest(e, ai, dt, d){
    const O = G.dg.def.objective, H = O && O.hatch;
    if(!H) return true;
    e.hatchT = (e.hatchT === undefined ? 1.5 : e.hatchT) - dt;
    if(e.hatchT <= 0 && d < H.range){
      e.hatchT = H.every;
      const kids = G.enemies.filter(o => !o.dead && o.mom === e).length;
      for(let k = 0; k < 2 && kids + k < H.cap; k++){
        const a = Math.random() * TAU, c = dgSpawn(dgPickMix(H.mix), e.x + Math.cos(a) * 64, e.y + Math.sin(a) * 64, false, 0);
        if(c){ c.mom = e; c.rise = c.riseMax = .45; }
      }
      G.fx.push({type:'ring', x:e.x, y:e.y, r:10, maxR:110, life:.4, max:.4, color:'#ffcf6a', fill:true});
    }
    return true;
  },
});

/* ---------- dungeon: 3D renderer (Three.js, loaded only when needed) ----------
   World x/y map to 3D x/z; y is up. Static level parts are instanced meshes;
   characters are instanced per body part so a whole horde costs a few draw
   calls. Ground effects (hazard warnings, rings, slashes) are drawn with the
   2D code onto a canvas that lies on the floor around the player. */
const D3 = {T:null, loading:null, R:null, portraits:{}, rigs:{}, occ:new Map(), cut:new Map(), cutWant:new Set(), torches:[], gates:[], chests:[],
  falling:[], crumbleIdx:new Map(), cx:0, cy:0, dist:1000, snap:true, last:0, lightT:0, res:1};
const WALLH = 108;
const VIS = 1.2;          // characters are drawn a little larger than their hit circles

function d3Load(){
  if(D3.T) return Promise.resolve(D3.T);
  if(!D3.loading) D3.loading = import(THREE_URL).then(m => (D3.T = m)).catch(err => { D3.loading = null; throw err; });
  return D3.loading;
}
function d3Init(){
  if(D3.R) return;
  const T = D3.T;
  const canvas = document.createElement('canvas');
  canvas.id = 'gl';
  cv.parentNode.insertBefore(canvas, cv);
  let R;
  // phones skip MSAA: their screens are sharp enough, and it is the costliest pass on their GPUs
  try{ R = new T.WebGLRenderer({canvas, antialias:!matchMedia('(pointer: coarse)').matches, powerPreference:'high-performance'}); }
  catch(err){ canvas.remove(); throw err; }
  D3.R = R; D3.canvas = canvas;
  D3.RT = {root:new T.Matrix4(), loc:new T.Matrix4(), m:new T.Matrix4(), s:new T.Matrix4(), t1:new T.Matrix4(), r1:new T.Matrix4(), t2:new T.Matrix4(),
    q:new T.Quaternion(), e:new T.Euler(0, 0, 0, 'YXZ'), v:new T.Vector3(), sc:new T.Vector3(), col:new T.Color(), white:new T.Color(1, 1, 1),
    gold:new T.Color('#ffd84a'), green:new T.Color('#7dff6a')};
  R.shadowMap.enabled = true; R.shadowMap.type = T.PCFShadowMap;   // soft PCF cost about 10% more per frame for little visible difference
  const scene = D3.scene = new T.Scene();
  scene.background = new T.Color('#0b1110');
  scene.fog = new T.Fog('#0b1110', 1000, 2400);
  D3.cam = new T.PerspectiveCamera(38, 1, 20, 7000);
  scene.add(D3.hemi = new T.HemisphereLight('#c9dcff', '#3d3428', 1.7));
  const sun = D3.sun = new T.DirectionalLight('#ffeccc', 1.9);
  const small = Math.min(innerWidth, innerHeight) < 700;
  sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  Object.assign(sun.shadow.camera, {left:-850, right:850, top:850, bottom:-850, near:50, far:3400});
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 1.5;
  scene.add(sun, sun.target);
  // every point light costs time on every lit pixel, so there are only four for torches (the portal borrows one) and one on the player.
  // The count never changes while playing: a different count would make three.js recompile every material.
  D3.torchLights = Array.from({length:4}, () => { const l = new T.PointLight('#ff9a48', 0, 380, 0); scene.add(l); return l; });
  scene.add(D3.pLight = new T.PointLight('#d6eaff', 1.1, 330, 0));
  d3Textures(); d3Materials(); d3Geometries(); d3TexturesAQ(); d3GeometriesAQ(); d3GeometriesAQ2();
  scene.add(D3.level = new T.Group());
  scene.add(D3.dyn = new T.Group());
  d3Dynamic();
  addEventListener('resize', d3Resize);
  d3Quality();
}
// Graphics setting: 'auto' lowers the resolution while frames run slow; 'fast' always draws at 70% with no shadows
function d3Quality(){
  if(!D3.R) return;
  D3.sun.castShadow = save.gfx !== 'fast';
  d3Resize();
}
function d3AutoRes(dt){
  const Q = D3.q || (D3.q = {ft:1 / 60, t:0, hold:2, up:8});
  if(!(dt > 0) || save.gfx === 'fast') return;
  Q.ft += (dt - Q.ft) * .05; Q.t += dt; Q.hold -= dt;
  if(Q.hold > 0 || Q.t < 1) return;
  Q.t = 0;
  if(Q.ft > 1 / 48 && D3.res > .55){ D3.res = Math.max(.55, D3.res * .85); Q.hold = 1.5; Q.up = 8; d3Resize(); }
  else if(Q.ft < 1 / 56 && D3.res < 1 && --Q.up <= 0){ D3.res = Math.min(1, D3.res * 1.1); Q.hold = 2; d3Resize(); }
}
function d3Show(on){
  if(on){ d3Init(); D3.snap = true; d3Resize(); }
  document.body.classList.toggle('dg', !!on);
}
function d3Resize(){
  if(!D3.R) return;
  D3.R.setPixelRatio(Math.min(window.devicePixelRatio || 1, innerWidth < 800 ? 1.25 : 1.5) * (save.gfx === 'fast' ? .7 : D3.res));
  D3.R.setSize(innerWidth, innerHeight, false);
  D3.cam.aspect = innerWidth / Math.max(1, innerHeight);
  D3.cam.updateProjectionMatrix();
  if(D3.gpMat) D3.gpMat.uniforms.uScale.value = D3.R.getDrawingBufferSize(D3.RT.v).y / (2 * Math.tan(D3.cam.fov * Math.PI / 360));
}

/* ---------- textures, painted on canvases ---------- */
function d3Canvas(size, draw, h){
  const c = document.createElement('canvas'); c.width = size; c.height = h || size;
  draw(c.getContext('2d'), size, mulberry(size * 31 + (h || 0)));
  return c;
}
function d3Tex(c){
  const T = D3.T, t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace; t.wrapS = t.wrapT = T.RepeatWrapping;
  t.anisotropy = Math.min(8, D3.R.capabilities.getMaxAnisotropy());
  return t;
}
function paintStone(x, S, rnd, base){
  x.fillStyle = '#2b2e29'; x.fillRect(0, 0, S, S);
  const h = S / 2;
  for(let j = 0; j < 2; j++) for(let i = 0; i < 2; i++){
    const v = base + (rnd() * 26 - 13) | 0;
    x.fillStyle = `rgb(${v},${v + 4},${v - 4})`; x.fillRect(i * h + 2, j * h + 2, h - 4, h - 4);
    x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(i * h + 2, j * h + 2, h - 4, 3);
    x.fillStyle = 'rgba(0,0,0,.2)'; x.fillRect(i * h + 2, j * h + h - 5, h - 4, 3);
  }
  for(let k = 0; k < S * 7; k++){ x.fillStyle = rnd() < .5 ? 'rgba(0,0,0,.13)' : 'rgba(255,255,255,.06)'; x.fillRect(rnd() * S, rnd() * S, 1 + rnd() * 1.5, 1 + rnd() * 1.5); }
}
function paintCracks(x, S, rnd, n, col, lw){
  x.strokeStyle = col; x.lineWidth = lw || 1.2; x.lineCap = 'round';
  for(let k = 0; k < n; k++){
    let px = rnd() * S, py = rnd() * S, a = rnd() * TAU;
    x.beginPath(); x.moveTo(px, py);
    for(let s = 0; s < 6; s++){ a += rnd() - .5; px += Math.cos(a) * S / 16; py += Math.sin(a) * S / 16; x.lineTo(px, py); }
    x.stroke();
  }
}
function paintMoss(x, S, rnd, n){
  for(let k = 0; k < n; k++){
    const px = rnd() * S, py = rnd() * S, r = S * (.03 + rnd() * .1);
    x.fillStyle = `rgba(${70 + rnd() * 30 | 0},${118 + rnd() * 40 | 0},${48 + rnd() * 20 | 0},${.4 + rnd() * .35})`;
    x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  for(let k = 0; k < n * 8; k++){ x.fillStyle = rnd() < .5 ? 'rgba(150,215,90,.6)' : 'rgba(60,110,40,.5)'; x.fillRect(rnd() * S, rnd() * S, 1.6, 1.6); }
}
function d3Textures(){
  const X = D3.tex = {};
  X.floor = d3Tex(d3Canvas(128, (x, S, r) => { paintStone(x, S, r, 100); paintCracks(x, S, r, 3, 'rgba(0,0,0,.35)'); }));
  X.moss = d3Tex(d3Canvas(128, (x, S, r) => { paintStone(x, S, r, 94); paintMoss(x, S, r, 12); }));
  X.crumble = d3Tex(d3Canvas(128, (x, S, r) => { paintStone(x, S, r, 112); paintCracks(x, S, r, 16, 'rgba(18,14,8,.8)', 1.6); paintCracks(x, S, r, 6, 'rgba(255,240,200,.25)'); }));
  X.stair = d3Tex(d3Canvas(128, (x, S, r) => {
    paintStone(x, S, r, 104);
    for(let k = 0; k < 2; k++){ const y0 = k * 64; x.fillStyle = 'rgba(0,0,0,.42)'; x.fillRect(0, y0 + 50, S, 14); x.fillStyle = 'rgba(255,255,255,.16)'; x.fillRect(0, y0, S, 5); }
  }));
  X.wall = d3Tex(d3Canvas(128, (x, S, r) => {
    x.fillStyle = '#34372f'; x.fillRect(0, 0, S, S);
    for(let row = 0; row < 4; row++){
      const off = row % 2 ? 32 : 0;
      for(let col = -1; col < 3; col++){
        const bx = col * 64 + off, by = row * 32, v = 104 + (r() * 30 - 15) | 0;
        x.fillStyle = `rgb(${v},${v + 3},${v - 6})`; x.fillRect(bx + 2, by + 2, 60, 28);
        x.fillStyle = 'rgba(255,255,255,.09)'; x.fillRect(bx + 2, by + 2, 60, 3);
        x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(bx + 2, by + 26, 60, 4);
      }
    }
    for(let k = 0; k < 700; k++){ x.fillStyle = r() < .5 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.06)'; x.fillRect(r() * S, r() * S, 1.5, 1.5); }
    paintCracks(x, S, r, 3, 'rgba(0,0,0,.4)');
    paintMoss(x, S, r, 5);
  }));
  X.pool = d3Tex(d3Canvas(128, (x, S, r) => {
    x.fillStyle = '#123d12'; x.fillRect(0, 0, S, S);
    const wrapDo = (px, py, fn) => { for(const ox of [-S, 0, S]) for(const oy of [-S, 0, S]) fn(px + ox, py + oy); };
    for(let k = 0; k < 16; k++){
      const px = r() * S, py = r() * S, rr = 12 + r() * 26, a = .25 + r() * .3;
      wrapDo(px, py, (qx, qy) => { const g = x.createRadialGradient(qx, qy, 0, qx, qy, rr); g.addColorStop(0, `rgba(120,230,60,${a})`); g.addColorStop(1, 'rgba(120,230,60,0)'); x.fillStyle = g; x.fillRect(qx - rr, qy - rr, rr * 2, rr * 2); });
    }

/* ---------- level build ---------- */
function d3Inst(mesh, idx, x, y, z, ry, sx, sy, sz){

// Static level parts are split into chunks of 10×10 tiles, each its own instanced mesh with its own

// Returns a group; group.at(i) gives [chunk mesh, index in it] for the i-th item of the list.
const CHUNK = 10 * DT;

    if(m.instanceColor) m.instanceColor.needsUpdate = true;

const skRank = (id, sk) => (sk || save.dg.skills)[id] || 0;

const skStep = (id, r) => DG_SKILLS[id].cost || r + 1;

const skPaid = (id, r) => { let n = 0; for(let i = 0; i < r; i++) n += skStep(id, i); return n; };

function skEarned(){ let n = 0; for(const k in save.dg.cleared) if(save.dg.cleared[k]) n += skFloorPts(+k); return n; }
function skSpent(sk){ sk = sk || save.dg.skills; let n = 0; for(const id in sk) if(DG_SKILLS[id]) n += skPaid(id, sk[id]); return n; }

function skBelow(sk, b, tier){ let n = 0; for(const id in DG_SKILLS){ const d = DG_SKILLS[id]; if(d.b === b && d.tier < tier) n += skPaid(id, skRank(id, sk)); } return n; }

function skWhyNot(id){

  if(need > 0) return `Put ${need} more point${need > 1 ? 's' : ''} into the ${SK_BRANCHES.find(x => x.id === d.b).name} rows above first`;
  if(skFree() < skCost(id)) return `Needs ${skCost(id)} skill point${skCost(id) > 1 ? 's' : ''}. Clear new floors to earn more`;
  return '';
}

    if(G || titleEl.hidden) return;
    try{ d3Init(); tdemoFloor(); }catch(e){ TDEMO.failed = true; TDEMO.g = null; G = null; TDEMO_RUN = false; d3Show(false); $('#hud').hidden = true; }
  }).catch(() => { TDEMO.loading = false; TDEMO.failed = true; });
}
function tdemoStop(){ TDEMO.g = null; if(!G) d3Show(false); }
// starts the next floor through the normal dungeon entry, then puts the menus back the way they were
function tdemoFloor(){
  TDEMO.idx = (TDEMO.idx < 0 ? Math.floor(Math.random() * TDEMO_FLOORS.length) : TDEMO.idx + 1) % TDEMO_FLOORS.length;
  const n = TDEMO_FLOORS[TDEMO.idx], [ch, items] = TDEMO_LOADOUTS[TDEMO.idx % 2];
  const keep = {char:B.char, items:B.items, modal:modal.hidden, hub:hub.hidden};
  TDEMO_RUN = true;
  try{
    B.char = ch; B.items = items.slice();
    dgEnter(n);
    G.dg.sk = {}; dgSkillsFloor();
    G.weaponLvl = 5; for(const id in G.ab) G.ab[id] = 5; for(const id in G.pos) G.pos[id] = 3;
    recalcStats(); G.p.hp = G.p.maxHp; G.xpNeed = 1e12;
    TDEMO.g = G;
  } finally {
    G = null; TDEMO_RUN = false;
    B.char = keep.char; B.items = keep.items;
    titleEl.hidden = false; hub.hidden = keep.hub; modal.hidden = keep.modal; $('#hud').hidden = true;
  }
  Object.assign(TDEMO, {t:0, fade:1, floor:n, path:[], pi:0, stuckT:0, rollT:3});
  const el = $('#tlStage');
  if(el){ el.textContent = `B${n} · ${DG_FLOORS[n - 1].name}`; el.style.color = dgThemeOf(n).accent; }
}
// a path over open tiles to a random spot 20-70 tiles away
function tdemoPath(){
  const L = G.dg.L, W = L.W, N = W * L.H, p = G.p;
  const s = Math.floor(p.y / DT) * W + Math.floor(p.x / DT);
  const prev = new Int32Array(N).fill(-1), dist = new Int16Array(N).fill(-1), q = [s];
  dist[s] = 0;
  const far = [];
  for(let h = 0; h < q.length; h++){
    const i = q[h], x = i % W, y = (i - x) / W;
    if(dist[i] >= 20 && dist[i] <= 70) far.push(i);
    for(const [dx, dy] of N4){
      const nx = x + dx, ny = y + dy, j = ny * W + nx;
      if(dgWalkBlocked(L, nx, ny) || dist[j] >= 0 || L.t[j] === TT.CRUMBLE) continue;
      dist[j] = dist[i] + 1; prev[j] = i; q.push(j);
    }
  }
  const pool = far.length ? far : q.slice(Math.floor(q.length / 2));
  let i = pool[Math.floor(Math.random() * pool.length)];
  const path = [];
  while(i >= 0 && i !== s){ path.push(i); i = prev[i]; }
  TDEMO.path = path.reverse(); TDEMO.pi = 0;
}
function tdemoDrive(dt){
  const L = G.dg.L, p = G.p, T = TDEMO;
  if(T.pi >= T.path.length) tdemoPath();
  // skip ahead to the farthest waypoint within a few tiles that is in plain sight
  while(T.pi + 1 < T.path.length){
    const j = T.path[T.pi + 1], x = (j % L.W + .5) * DT, y = (Math.floor(j / L.W) + .5) * DT;
    if(Math.hypot(x - p.x, y - p.y) < DT * 3 && dgLos(p.x, p.y, x, y)) T.pi++; else break;
  }
  const i = T.path[T.pi];
  if(i === undefined){ joy.active = false; return; }
  const tx = (i % L.W + .5) * DT, ty = (Math.floor(i / L.W) + .5) * DT, d = Math.hypot(tx - p.x, ty - p.y);
  if(d < 18) T.pi++;
  joy.active = true; joy.dx = d > 1 ? (tx - p.x) / d : 0; joy.dy = d > 1 ? (ty - p.y) / d : 0;
  // repath when stuck behind something
  T.stuckT += dt;
  if(T.stuckT > 1.2){ if(Math.hypot(p.x - T.sx, p.y - T.sy) < 30) tdemoPath(); T.stuckT = 0; T.sx = p.x; T.sy = p.y; }
  // roll now and then when something gets close
  T.rollT -= dt;
  if(T.rollT <= 0){ T.rollT = 2.5 + Math.random() * 3; if(G.enemies.some(e => !e.dead && Math.hypot(e.x - p.x, e.y - p.y) < 140)) dgRoll(); }
}
// called from render() while the title is up; returns false when the 2D demo should draw instead
function tdemoFrame(now){
  if(!TDEMO.g){ tdemoStart(); return false; }
  const dt = Math.min(.05, Math.max(0, (now - (TDEMO.last || now)) / 1000)), T = TDEMO;
  T.last = now;
  const keepJoy = {a:joy.active, dx:joy.dx, dy:joy.dy}, keepKeys = Object.assign({}, keys);
  for(const k in keys) keys[k] = false;
  G = T.g; TDEMO_RUN = true;
  let next = false;
  try{
    const g = G, p = g.p;
    if(g.state !== 'play') g.state = 'play';
    tdemoDrive(dt);
    update(REDUCED ? dt * .4 : dt);
    p.hp = p.maxHp; g.pendingLevels = g.pendingTreasure = 0; g.xpNeed = 1e12;
    joy.active = false;   // the demo's steering is not a finger on the screen: no joystick ring
    dgRender(now);
    T.t += dt;
    next = T.t > 40 || T.next;
  }catch(e){ T.failed = true; T.g = null; }
  finally {
    G = null; TDEMO_RUN = false;
    joy.active = keepJoy.a; joy.dx = keepJoy.dx; joy.dy = keepJoy.dy; Object.assign(keys, keepKeys);
  }
  if(!T.g){ d3Show(false); return false; }
  // fade in at the start of a floor, out before the next one
  T.fade = next ? Math.min(1, T.fade + dt * 1.5) : Math.max(0, T.fade - dt * .8);
  if(T.fade > 0){ ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(9,11,24,${T.fade})`; ctx.fillRect(0, 0, W, H); }
  if(next && T.fade >= 1){ T.next = false; tdemoFloor(); }
  return true;
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if(G && G.state === 'play') update(dt);
  else if(!G && !titleEl.hidden && !TDEMO.g) demoUpdate(REDUCED ? dt * .4 : dt);
  if(G){ G.hudT -= dt; if(G.hudT <= 0){ G.hudT = 0.08; updateHud(); } }
  render(now);
  requestAnimationFrame(frame);
}

applyStageRules();
renderTitle();
setMusic('title');
requestAnimationFrame(frame);
</script>
