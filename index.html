    if(!S[k]) continue;
    const ch = S[k].ch.split('|').map(b => b.trim().split(/\s+/).map(chordOf));
    C.sec[k] = {ch, mel:S[k].mel ? melOf(S[k].mel, ch.length) : null, bars:ch.length};

  const bars = [];

  for(const f of S.form) add(f[0], f[1] || '');
  bars.forEach((B, i) => { B.fill = B.last && bars[(i + 1) % bars.length].mode !== '~'; });
  C.loop = bars;
  C.introBars = Array.from({length:S.intro || 0}, (_, b) => ({sec:C.sec.A, b:b % C.sec.A.bars, mode:'i', first:b === 0, last:b === S.intro - 1, fill:b === S.intro - 1}));
  return S._c = C;
}

/* ---------- the mixer: a channel per part, with reverb and echo sends ---------- */
const MIX = {ctx:null};
const MCH = [   // name, volume, pan, reverb send, echo send
  ['kick', .9, 0, .04, 0], ['snare', .6, .06, .24, 0], ['hat', .34, .3, .08, 0], ['perc', .45, -.32, .2, .1],
  ['bass', .8, 0, .03, 0], ['pad', .55, 0, .55, 0], ['keys', .5, .18, .32, .1], ['lead', .6, -.06, .3, .26],
  ['harm', .34, .24, .4, .18], ['arp', .32, -.3, .3, .34]];
function mixInit(){
  const a = AUDIO.ctx;
  if(!a || MIX.ctx === a) return;
  MIX.ctx = a;
  MIX.trim = a.createGain(); MIX.trim.gain.value = .38; MIX.trim.connect(AUDIO.music);   // keeps the music under the sound effects
  MIX.duck = a.createBiquadFilter(); MIX.duck.type = 'lowpass'; MIX.duck.frequency.value = 16000; MIX.duck.connect(MIX.trim);
  const len = a.sampleRate * 2.4 | 0, ir = a.createBuffer(2, len, a.sampleRate);
  for(let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  const verb = a.createConvolver(); verb.buffer = ir;
  MIX.verbIn = a.createGain(); MIX.verbIn.gain.value = .5; MIX.verbIn.connect(verb); verb.connect(MIX.duck);
  MIX.delay = a.createDelay(2); MIX.delay.delayTime.value = .4;
  const fb = a.createGain(); fb.gain.value = .36;
  const tone = a.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2600;
  MIX.echoIn = a.createGain(); MIX.echoIn.connect(MIX.delay); MIX.delay.connect(tone); tone.connect(fb); fb.connect(MIX.delay); tone.connect(MIX.duck);
  MIX.ch = {};
  for(const [k, vol, pan, rv, ec] of MCH){
    const g = a.createGain(); g.gain.value = vol;
    let out = g;
    if(a.createStereoPanner){ const p = a.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
    out.connect(MIX.duck);
    const sv = a.createGain(), se = a.createGain(); sv.gain.value = rv; se.gain.value = ec;
    out.connect(sv); sv.connect(MIX.verbIn); out.connect(se); se.connect(MIX.echoIn);
    MIX.ch[k] = g; MIX.ch[k].sends = [sv, se, rv, ec];
  }
}
// a new song sets the echo time, the sends and the overall tone
function mixSong(C, sp){
  const a = AUDIO.ctx, t = a.currentTime;
  MIX.delay.delayTime.setTargetAtTime(Math.min(1.9, C.echoT * sp), t, .05);
  for(const k in MIX.ch){ const [sv, se, rv, ec] = MIX.ch[k].sends; sv.gain.setTargetAtTime(rv * C.verb, t, .1); se.gain.setTargetAtTime(ec * C.echo, t, .1); }
  MIX.duck.frequency.setTargetAtTime(MUSIC.ducked ? 900 : C.lp, t, .1);
  MIX.trim.gain.setTargetAtTime(.38 * C.gain, t, .1);
}

/* ---------- voices ---------- */
function mVoice(ch, f, t, dur, o){
  const a = AUDIO.ctx, out = MIX.ch[ch];
  const g = a.createGain(), A = o.a || .006, R = o.r || .08, v = o.v || .2, hold = Math.max(dur, A), end = t + hold + R + .05;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + A);
  if(o.d) g.gain.setTargetAtTime(v * (o.s || 0), t + A, o.d / 3);
  g.gain.setTargetAtTime(0, t + hold, R / 4);
  g.connect(out);
  let dest = g;
  if(o.lp){
    const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = o.q || .8;
    fl.frequency.setValueAtTime(o.env || o.lp, t); if(o.env) fl.frequency.setTargetAtTime(o.lp, t, o.et || .08);
    fl.connect(g); dest = fl;
  }
  let lfo = null;
  if(o.vib){
    lfo = a.createOscillator(); lfo.frequency.value = 5.4;
    const lg = a.createGain(); lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(o.vib, t + .3);
    lfo.connect(lg); lfo.start(t); lfo.stop(end); lfo = lg;
  }
  const osc = (w, fr, det, vol) => {
    const s = a.createOscillator(); s.type = w; s.frequency.value = fr; s.detune.value = det;
    if(lfo) lfo.connect(s.detune);
    if(vol !== 1){ const k = a.createGain(); k.gain.value = vol; s.connect(k); k.connect(dest); } else s.connect(dest);
    s.start(t); s.stop(end);
  };
  if(o.det){ osc(o.w, f, -o.det / 2, .62); osc(o.w, f, o.det / 2, .62); } else osc(o.w, f, 0, 1);
  if(o.part) for(const [ratio, vol, w] of o.part) osc(w || o.w, f * ratio, 0, vol);
}
function mNoise(ch, t, dur, v, type, f, q, fto){
  const a = AUDIO.ctx, src = a.createBufferSource(); src.buffer = AUDIO.noise; src.loop = true;
  const fl = a.createBiquadFilter(); fl.type = type; fl.Q.value = q || .7; fl.frequency.setValueAtTime(f, t);
  if(fto) fl.frequency.exponentialRampToValueAtTime(fto, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0005, t + dur);
  src.connect(fl); fl.connect(g); g.connect(MIX.ch[ch]);
  src.start(t, Math.random() * .5); src.stop(t + dur + .02);
}
const DRUM = {
  k(t, v){
    const a = AUDIO.ctx, o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(44, t + .12);
    g.gain.setValueAtTime(v * .9, t); g.gain.exponentialRampToValueAtTime(.001, t + .38);
    o.connect(g); g.connect(MIX.ch.kick); o.start(t); o.stop(t + .4);
    mNoise('kick', t, .015, v * .2, 'highpass', 2500);
  },
  s(t, v){ mNoise('snare', t, .18, v * .5, 'highpass', 1400); mNoise('snare', t, .08, v * .35, 'bandpass', 900, 1.2); mVoice('snare', 160, t, .01, {w:'triangle', v:v * .3, r:.1}); },
  r(t, v){ mVoice('perc', 1700, t, .004, {w:'triangle', v:v * .16, r:.04}); mNoise('perc', t, .03, v * .2, 'bandpass', 2400, 2); },
  h(t, v){ mNoise('hat', t, .04, v * .28, 'highpass', 8000); },
  o(t, v){ mNoise('hat', t, .26, v * .22, 'highpass', 7000); },
  p(t, v){ mNoise('perc', t, .06, v * .16, 'bandpass', 6000, 1.6); },
  t(t, v, s){
    const a = AUDIO.ctx, o = a.createOscillator(), g = a.createGain(), f = 190 - s * 6;
    o.frequency.setValueAtTime(f * 1.5, t); o.frequency.exponentialRampToValueAtTime(f, t + .08);
    g.gain.setValueAtTime(v * .55, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
    o.connect(g); g.connect(MIX.ch.perc); o.start(t); o.stop(t + .32);
  },
  c(t, v){ mNoise('hat', t, 1.6, v * .2, 'highpass', 4200); },
};
const VEL = {X:1, x:.7, g:.32};

// a chord's tones placed from lo upward, over n octaves
function chordTones(C, lo, n){
  const out = [];
  for(let o = 0; o < n; o++) for(const pc of C.pcs) out.push(lo + ((pc - lo) % 12 + 12) % 12 + 12 * o);
  return out.sort((x, y) => x - y);
}
const placeBass = pc => 34 + ((pc - 34) % 12 + 12) % 12;   // Bb1 .. A2
function bassNote(C, k){
  const r = placeBass(C.pc);
  return k === 'R' ? placeBass(C.bass) : k === '5' ? r + 7 : k === 'O' ? r + 12 : k === '3' ? r + C.iv[1] : r;
}
// how many steps a note in a bass/comp line lasts (until the next note, a rest, or a chord change)
function lineLen(line, s, two){ let n = 1; while(s + n < 16 && line[s + n] === '-' && !(two && s < 8 && s + n === 8)) n++; return n; }

function musicStep(C, step, t, sp){
  const bar = Math.floor(step / 16), s = step % 16;
  const P = bar < C.introBars.length ? C.introBars[bar] : C.loop[(bar - C.introBars.length) % C.loop.length];
  const chs = P.sec.ch[P.b], two = chs.length > 1, Ch = chs[two && s >= 8 ? 1 : 0];
  const full = P.mode === '+', calm = P.mode === '~' || P.mode === 'i', I = C.inst;
  if(s % 2) t += C.swing * sp;
  // drums
  let gr = P.mode === 'i' ? C.introGroove : P.mode === '~' ? C.brkGroove : full ? C.grooveFull : C.groove;
  if(P.fill && s >= 8 && gr !== GROOVES.build) gr = C.fill;
  for(const k in gr){ const v = VEL[gr[k][s]]; if(v) DRUM[k](t, v, s); }
  if(s === 0 && P.first && P.mode !== '~' && P.mode !== 'i' && (full || bar === C.introBars.length)) DRUM.c(t, 1);
  // bass
  const bl = calm ? C.bassBrk : full ? C.bassFull : C.bass, bk = bl[s];
  if(I.bass && bk !== '-' && bk !== '.') mVoice('bass', midiF(bassNote(Ch, bk)), t, lineLen(bl, s, two) * sp * .92, INST[I.bass]);
  // pad: one chord per bar or half bar
  if(I.pad && (s === 0 || (two && s === 8))){
    const len = (two ? 8 : 16) * sp;
    for(const m of chordTones(Ch, C.padLo, 1)) mVoice('pad', midiF(m), t, len, INST[I.pad]);
  }
  // keys comping
  if(I.keys && C.comp && C.comp[s] === 'x' && P.mode !== 'i'){
    const len = lineLen(C.comp, s, two) * sp * .9;
    for(const m of chordTones(Ch, C.padLo + 5, 1)) mVoice('keys', midiF(m), t, len, INST[I.keys]);
  }
  // arpeggio
  if(I.arp && (full || calm || C.arpAlways) && s % C.arpRate === 0){
    const tones = chordTones(Ch, C.arpLo, 2), i = C.arp[(s / C.arpRate + bar * 2) % C.arp.length] % tones.length;
    mVoice('arp', midiF(tones[i]), t, C.arpRate * sp * .9, INST[I.arp]);
  }
  // melody, and a harmony a chord tone below it in the full sections
  const ev = !calm && P.sec.mel && P.sec.mel[P.b][s];
  if(ev){
    const dur = ev.d * sp * .94;
    mVoice('lead', midiF(ev.m + C.leadOct), t, dur, INST[I.lead]);
    if(full && I.harm){
      let h = 0;
      for(let k = 3; k <= 9 && !h; k++) if(Ch.pcs.includes((ev.m - k + 120) % 12)) h = ev.m - k;
      if(h) mVoice('harm', midiF(h + C.leadOct + C.harmOct), t, dur, INST[I.harm]);
    }
  }
}

const MUSIC = {name:null, intensity:0, song:null, step:0, next:0, ducked:false, fresh:false};
function setMusic(name, intensity){
  if(TDEMO_RUN) return;   // the floor playing behind the title keeps the title song
  intensity = intensity || 0;
  if(name && intensity >= 2 && SONGS[name] && SONGS[name].boss) name = SONGS[name].boss;
  if(name && !SONGS[name]) name = 'ruins';
  if(MUSIC.name === name) return;
  MUSIC.name = name; MUSIC.intensity = intensity; MUSIC.song = null;
  if(!name) return;
  try{ MUSIC.song = songCompile(name); }catch(e){ console.error('music: ' + name + ': ' + e.message); MUSIC.name = null; return; }
  MUSIC.step = 0; MUSIC.next = 0; MUSIC.fresh = true;
}
function setDuck(on){
  MUSIC.ducked = on; applyVolumes();
  if(MIX.ctx && MIX.ctx === AUDIO.ctx) MIX.duck.frequency.setTargetAtTime(on ? 900 : MUSIC.song ? MUSIC.song.lp : 16000, AUDIO.ctx.currentTime, .12);
}
function musicTick(){
  const a = AUDIO.ctx;
  if(!a || a.state !== 'running' || !MUSIC.song || save.vol.mute || save.vol.music <= 0) return;
  mixInit();
  const C = MUSIC.song, sp = 60 / C.bpm / 4;
  if(MUSIC.fresh){ MUSIC.fresh = false; mixSong(C, sp); }
  if(MUSIC.next < a.currentTime) MUSIC.next = a.currentTime + .05;
  while(MUSIC.next < a.currentTime + .2){
    try{ musicStep(C, MUSIC.step, MUSIC.next, sp); }catch(e){}
    MUSIC.step++; MUSIC.next += sp;
  }
}
setInterval(musicTick, 40);

  h += `<div><div class="lbl"><span>Abilities</span><span>${abl.length} / ${MAX_ABILITIES}</span></div><div class="slots">`;

    const id = abl[i];
    h += id ? `<button class="slot fill" data-act="item" data-id="${id}"><span class="si">${ico(id)}</span>${ITEMS[id].name}<span class="x">${effCost(id, combos)} pts ${ico('close')}</span></button>`
            : `<div class="slot">Empty ability slot</div>`;
  }
  h += '</div></div>';
  const tr = B.items.filter(id => ITEMS[id].type !== 'ability').sort((a, b) => (ITEMS[a].type === 'neg') - (ITEMS[b].type === 'neg'));
  h += `<div><div class="lbl">Traits</div>${tr.length ? `<div class="tchips">${tr.map(id => traitChip(id, combos, !st.forced.includes(id))).join('')}</div>` : '<div class="empty">No traits yet. Negative traits give you extra points to spend.</div>'}</div>`;
  h += `<div><div class="lbl"><span>Combos</span><span>${save.combos.length} / ${COMBOS.length} found</span></div>`;

}

function renderCollection(){
  let h = `<div class="sec"><h2>Collection</h2><p>Every item in the game and how to get it.</p>`;
  for(const ty of ['ability','pos','neg']){
    h += `<div class="ghead t-${ty}">${TYPE_LABEL[ty]}</div><div class="items">`;

      h += isUnlocked(id)
        ? `<div class="it t-${ty} lk own"><span class="ic">${ico(id)}</span><span><span class="nm">${it.name}</span><span class="ds">${it.desc}</span></span><span class="pt"><small>${lbl}</small><b>${ty === 'neg' ? '+' : ''}${it.cost}</b></span></div>`
        : `<div class="it t-${ty} lk"><span class="ic">${ico('lock')}</span><span><span class="nm">???</span><span class="ds">${['','Common','Rare','Epic'][it.rarity]} · ${unlockSource(id)}</span></span><span class="pt"><small>${lbl}</small><b>?</b></span></div>`;
    }
    h += '</div>';
  }
  h += `</div><div class="sec"><h2>Combo book</h2><p>${save.combos.length} of ${COMBOS.length} found. Put both items of a combo in your loadout to find it.</p><div class="items">`;
  for(const c of COMBOS){
    h += save.combos.includes(c.id)
      ? `<div class="cmb"><b>${ico('spark')} ${c.name}</b>${c.req.map(r => ITEMS[r].name).join(' + ')}<br>${c.desc}</div>`
      : `<div class="cmb unk"><b>${ico('spark')} ???</b>Hint: involves ${ITEMS[c.req[0]].type === 'neg' ? 'a negative trait' : ITEMS[c.req[0]].type === 'pos' ? 'a positive trait' : 'an ability'}</div>`;
  }
  h += `</div></div><div class="sec"><h2>Bestiary</h2><p>Enemies and bosses on each dungeon floor.</p>`;
  const foe = (s, boss) => `<figure class="foe ${boss ? 'boss' : ''}"><img src="${dgPortraitSrc(s)}" alt=""><figcaption>${SKINS[s].name}</figcaption></figure>`;

}

function discoverCombos(){
  for(const c of activeCombos(B.items)) if(!save.combos.includes(c.id)){
    save.combos.push(c.id); persist();
    toast(`New combo found: ${c.name}!`, 'combo'); sfx('combo');
  }
}

function gachaPull(n){
  const cost = n === 10 ? GACHA_COST * 9 : GACHA_COST;
  if(save.coins < cost) return;
  save.coins -= cost;
  lastPulls = [];
  for(let i = 0; i < n; i++){
    const roll = Math.random();
    const rarity = roll < 0.6 ? 1 : roll < 0.9 ? 2 : 3;
    const pool = Object.keys(ITEMS).filter(k => ITEMS[k].rarity === rarity);
    const id = pool[Math.floor(Math.random() * pool.length)];
    const isNew = !isUnlocked(id);
    if(isNew) save.unlocked.push(id); else save.coins += DUPE_REFUND;
    lastPulls.push({id, isNew});
  }
  persist();
  sfx('gacha');
  if(lastPulls.some(r => ITEMS[r.id].rarity === 3)) sfx('epic');
}

hub.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  const act = t.dataset.act, id = t.dataset.id;
  if(act !== 'reset') resetArmed = false;
  if(act !== 'skReset') skResetArmed = false;
  if(act !== 'item' && act !== 'start' && act !== 'pull') sfx('click');
  switch(act){
    case 'title': showTitle(); return;
    case 'settings': openSettings(); return;
    case 'tab': tab = id; hub.scrollTop = 0; break;
    case 'char': B.char = id; break;
    case 'floor': {
      B.floor = +id;
      const ns = dgStageOf(B.floor).id;
      if(B.stage !== ns){ B.stage = ns; applyStageRules(); toast(`Loadout budget for ${dgThemeOf(B.floor).name}: ${dgStageOf(B.floor).budget} pts`); }
      break;
    }
    case 'filter': B.filter = id; break;
    case 'hideIntro': save.seenGuide = true; persist(); break;
    case 'clear': B.items = stageById(B.stage).forced.slice(); break;
    case 'item': {
      const st = stageById(B.stage), it = ITEMS[id];
      if(st.forced.includes(id)){ toast(`${it.name} is forced by this stage.`, 'bad'); return; }
      if(st.banned.includes(id) || !isUnlocked(id)) return;
      if(B.items.includes(id)){ B.items = B.items.filter(x => x !== id); sfx('untick'); }
      else {
        if(it.type === 'ability' && abilityCount(B.items) >= MAX_ABILITIES){ toast(`Ability slots are full (${MAX_ABILITIES}). Remove one first.`, 'bad'); sfx('untick'); return; }
        B.items.push(id); sfx('tick');
      }
      discoverCombos();
      break;
    }
    case 'decks': openDecks(); return;
    case 'start': {
      const st = stageById(B.stage);
      if(validate(st, B.char, B.items).length) return;
      dgStartFromHub(); return;
    }
    case 'pull': gachaPull(+t.dataset.n); break;
    case 'skUp': skLearn(id); break;
    case 'skDown': skUnlearn(id); break;
    case 'skReset':
      if(!skResetArmed){ skResetArmed = true; break; }
      skResetArmed = false; save.dg.skills = {}; persist(); toast('Every skill point is back for you to spend'); break;
    case 'reset':
      if(!resetArmed){ resetArmed = true; break; }
      resetArmed = false; save = defaultSave(); persist();
      B.stage = 'dg-ruins'; B.floor = 1; B.char = 'mage'; B.items = STARTER_LOADOUT.slice(); lastPulls = []; break;
  }
  renderHub();
});

function openDecks(){
  mbox.className = 'mbox';
  mbox.innerHTML = `<h2>Saved loadouts</h2><p class="mnote">Save your current loadout, or load one.</p>
    <label class="lbl" for="deckName">Name for saving</label><input id="deckName" type="text" maxlength="24" placeholder="e.g. Glass cannon" value="${esc(B.deckName)}">
    <div class="decks">${save.decks.map((d, i) => `<div class="dk"><div class="dn">${d
      ? `<b>${CHARACTERS[d.char] ? ico(d.char) : ''} ${esc(d.name)}</b><span>${d.items.filter(x => ITEMS[x]).map(x => ico(x)).join('')}</span>`
      : `<span class="empty">Empty slot ${i + 1}</span>`}</div>
      ${d ? `<button class="btn sm" data-act="deckLoad" data-i="${i}">Load</button>` : ''}
      <button class="btn sm ${d ? 'ghost' : ''}" data-act="deckSave" data-i="${i}">${d ? 'Overwrite' : 'Save here'}</button>
      ${d ? `<button class="btn sm ghost" data-act="deckDel" data-i="${i}" aria-label="Delete ${esc(d.name)}">${ico('close')}</button>` : ''}</div>`).join('')}</div>

function closeModal(){ modal.hidden = true; }

modal.addEventListener('input', e => {
  if(e.target.id === 'deckName') B.deckName = e.target.value;
  if(e.target.dataset.vol) onVolumeInput(e.target);
});
modal.addEventListener('change', e => { if(e.target.dataset.vol){ persist(); if(e.target.dataset.vol !== 'music') sfx('select'); } });
modal.addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]');
  if(pick){ pickOption(+pick.dataset.pick); return; }
  const t = e.target.closest('[data-act]');
  if(!t){ if(e.target === modal && !G) closeModal(); return; }
  if(t.disabled) return;
  const i = +t.dataset.i;
  if(t.dataset.act !== 'reroll') sfx('click');
  switch(t.dataset.act){
    case 'close': closeModal(); break;
    case 'gfx': save.gfx = save.gfx === 'fast' ? 'auto' : 'fast'; persist(); d3Quality(); t.textContent = gfxLabel(); break;
    case 'mute': {
      save.vol.mute = !save.vol.mute; persist(); applyVolumes();
      t.innerHTML = `${ico(save.vol.mute ? 'mute' : 'sound')} ${save.vol.mute ? 'Unmute all' : 'Mute all'}`;
      break;
    }
    case 'deckSave': {
      const name = B.deckName.trim() || save.decks[i]?.name || `Loadout ${i + 1}`;
      const st = stageById(B.stage);
      save.decks[i] = {name, char:B.char, items:B.items.filter(x => isUnlocked(x) || !st.forced.includes(x))};
      persist(); openDecks(); toast(`Saved “${name}”`); break;
    }
    case 'deckLoad': {
      const d = save.decks[i]; if(!d) return;
      B.char = save.chars.includes(d.char) ? d.char : 'mage';
      B.items = d.items.filter(x => ITEMS[x]);
      B.deckName = d.name;
      applyStageRules(); discoverCombos(); closeModal(); renderHub(); toast(`Loaded “${d.name}”`); break;
    }
    case 'deckDel': save.decks[i] = null; persist(); openDecks(); break;
    case 'reroll': if(G && G.state === 'levelup' && G.rerolls > 0){ G.rerolls--; sfx('reroll'); openLevelUp(); } break;
    case 'resume': togglePause(); break;
    case 'quit': endRun(false); break;
    case 'back': backToHub(); break;
    case 'dgNext': dgNext(); break;
    case 'dgHome': if(G && G.dg && G.state === 'portal') endRun(true); break;
  }
});

const DEMO = {t:0, si:0, next:11, fade:0, enemies:[], parts:[], fx:[], shots:[], p:{x:0, y:0, fx:1, fy:0, r:12}, orbA:0, acc:0, novaT:2.2, shotT:.4};
function demoCam(){
  const wide = W > 760;
  return {x:DEMO.p.x - (wide ? W * .2 / ZOOM : 0), y:DEMO.p.y + (wide ? 0 : H * .18 / ZOOM)};
}
function demoKill(e){ e.dead = true; burst(e.x, e.y, SKINS[e.skin].body, 9, 170); }
function demoUpdate(dt){
  const D = DEMO, st = STAGES[D.si], p = D.p;
  D.t += dt;
  const nx = Math.cos(D.t * .32) * 170, ny = Math.sin(D.t * .47) * 120, vx = nx - p.x, vy = ny - p.y, l = Math.hypot(vx, vy);
  if(l > .01){ p.fx = vx / l; p.fy = vy / l; }
  p.x = nx; p.y = ny;
  D.next -= dt;
  if(D.next <= 0){ D.fade = .8; D.next = 11; }
  if(D.fade > 0){
    const before = D.fade; D.fade -= dt;
    if(before > .4 && D.fade <= .4){ D.si = (D.si + 1) % STAGES.length; D.enemies.length = 0; D.parts.length = 0; D.shots.length = 0; }
  }
  const cam = demoCam(), types = stageTypes(st);
  D.acc += dt * 7;
  while(D.acc >= 1){
    D.acc--;
    if(D.enemies.length >= 70) continue;
    const ty = types[Math.floor(Math.random() * types.length)], a = Math.random() * TAU, R = Math.hypot(W, H) / 2 / ZOOM + 40;
    D.enemies.push({x:cam.x + Math.cos(a) * R, y:cam.y + Math.sin(a) * R, r:ENEMIES[ty].r, speed:ENEMIES[ty].speed * .8, skin:st.skins[ty], seed:Math.random() * TAU, shape:Array.from({length:9}, () => rand(.82, 1.08)), flash:0, slow:0});
  }
  D.orbA += dt * 3.2;
  const blades = [0, 1, 2].map(i => [p.x + Math.cos(D.orbA + i * TAU / 3) * 78, p.y + Math.sin(D.orbA + i * TAU / 3) * 78]);
  for(const e of D.enemies){
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += dx / d * e.speed * dt; e.y += dy / d * e.speed * dt;
    if(d < e.r + 14) demoKill(e);
    for(const [bx, by] of blades) if(Math.hypot(e.x - bx, e.y - by) < e.r + 10) demoKill(e);
  }
  D.novaT -= dt;
  if(D.novaT <= 0){
    D.novaT = 2.4;
    D.fx.push({x:p.x, y:p.y, r:20, maxR:150, life:.45, max:.45, color:'#8fe3ff'});
    for(const e of D.enemies) if(Math.hypot(e.x - p.x, e.y - p.y) < 150) demoKill(e);
  }
  D.shotT -= dt;
  if(D.shotT <= 0){
    D.shotT = .35;
    let best = null, bd = 420 * 420;
    for(const e of D.enemies){ const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2; if(!e.dead && d < bd){ bd = d; best = e; } }
    if(best){ const a = Math.atan2(best.y - p.y, best.x - p.x); D.shots.push({x:p.x, y:p.y, vx:Math.cos(a) * 470, vy:Math.sin(a) * 470, life:1}); }
  }
  for(const s of D.shots){
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for(const e of D.enemies) if(!e.dead && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 5){ demoKill(e); s.life = 0; break; }
  }
  D.shots = D.shots.filter(s => s.life > 0);
  D.enemies = D.enemies.filter(e => !e.dead);
  const fr = Math.exp(-4 * dt);
  for(const q of D.parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= fr; q.vy *= fr; q.life -= dt; }
  D.parts = D.parts.filter(q => q.life > 0);
  for(const f of D.fx) f.life -= dt;
  D.fx = D.fx.filter(f => f.life > 0);
}
function renderDemo(){
  const D = DEMO, st = STAGES[D.si], p = D.p, t = D.t, cam = demoCam();
  ctx.fillStyle = '#090b18'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(ZOOM, ZOOM); ctx.translate(-cam.x, -cam.y);
  const hw = W / 2 / ZOOM + 60, hh = H / 2 / ZOOM + 60;
  drawWorld(st, cam.x, cam.y, hw, hh, t);
  for(const e of D.enemies) drawEnemy(e, t, p.x, p.y, true);
  addGlow('#5cc8ff', p.x, p.y, 44, .5);
  drawHero('mage', p.x, p.y, 13, Math.atan2(p.fy, p.fx), t, false);
  for(let i = 0; i < 3; i++){
    const a = D.orbA + i * TAU / 3, bx = p.x + Math.cos(a) * 78, by = p.y + Math.sin(a) * 78;
    drawBlade(bx, by, a);
  }
  ctx.globalCompositeOperation = 'lighter';
  for(const s of D.shots){ drawGlow('#7fd8ff', s.x, s.y, 16, .9); }
  for(const f of D.fx){ const k = f.life / f.max, r = f.maxR - (f.maxR - f.r) * k; ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2 + 5 * k; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke(); }
  drawParts(D.parts);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  drawMotes(st, cam.x, cam.y, t);
  ctx.drawImage(vignette, 0, 0, W, H);
  if(D.fade > 0){ ctx.fillStyle = `rgba(9,11,24,${Math.min(1, (0.4 - Math.abs(D.fade - .4)) / .4)})`; ctx.fillRect(0, 0, W, H); }
}
// the base screen keeps the selected stage slowly scrolling behind the menus
function renderBackdrop(now){
  const t = REDUCED ? 0 : now / 1000, st = stageById(B.stage) || STAGES[0];
  const cx = t * 22, cy = t * 11;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(ZOOM, ZOOM); ctx.translate(-cx, -cy);
  drawWorld(st, cx, cy, W / 2 / ZOOM + 60, H / 2 / ZOOM + 60, t);
  ctx.restore();
  drawMotes(st, cx, cy, t);
  ctx.drawImage(vignette, 0, 0, W, H);
}

let G = null;            // current run state

const keys = {};
const KEYMAP = {ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown', e => {
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; if(G) e.preventDefault(); }
  if(!G){
    if(!titleEl.hidden && (e.code === 'Enter' || e.code === 'Space') && !e.target.closest('button')){ e.preventDefault(); goHub('dungeon'); }
    return;
  }
  if((e.code === 'Escape' || e.code === 'KeyP') && (G.state === 'play' || G.state === 'paused')) togglePause();
  if(G.dg && (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight')){ e.preventDefault(); if(G.state === 'play' && !e.repeat) dgRoll(); }
  if(G.dg && (e.code === 'KeyQ' || e.code === 'KeyE') && G.state === 'play' && !e.repeat) dgFlask();
  if(G.state === 'levelup'){
    if(/^Digit[1-4]$/.test(e.code)) pickOption(+e.code.slice(5) - 1);
    if(e.code === 'KeyR' && G.rerolls > 0){ G.rerolls--; sfx('reroll'); openLevelUp(); }
  }
});
addEventListener('keyup', e => { if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; if(G && G.state === 'play') togglePause(); });

const joy = {active:false, id:null, ox:0, oy:0, dx:0, dy:0};
cv.addEventListener('pointerdown', e => {
  if(!G || G.state !== 'play') return;
  joy.active = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener('pointermove', e => {
  if(!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const d = Math.hypot(dx, dy), max = 50;
  if(d > max){ joy.ox += dx / d * (d - max); joy.oy += dy / d * (d - max); dx = dx / d * max; dy = dy / d * max; }
  joy.dx = dx / max; joy.dy = dy / max;
});
const joyEnd = e => { if(e.pointerId === joy.id){ joy.active = false; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', joyEnd);
cv.addEventListener('pointercancel', joyEnd);
$('#pauseBtn').innerHTML = ico('pause');
$('#pauseBtn').addEventListener('click', () => { if(G && (G.state === 'play' || G.state === 'paused')) togglePause(); });

const CELL = 64;
const grid = new Map();
const gkey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
function gridBuild(){
  grid.clear();
  for(const e of G.enemies){
    if(e.dead || e.hidden) continue;
    const k = gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let a = grid.get(k); if(!a){ a = []; grid.set(k, a); }
    a.push(e);
  }
}
function query(x, y, r, out){
  out.length = 0;
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL);
  const y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for(let cx = x0; cx <= x1; cx++) for(let cy = y0; cy <= y1; cy++){
    const a = grid.get(gkey(cx, cy));
    if(a) for(const e of a) if(!e.dead) out.push(e);
  }
  return out;
}
const tmpA = [], tmpB = [];

/* =====================================================================
   RUN SETUP & STATS
   ===================================================================== */
const negF = id => (G.neg[id] === undefined ? 0 : 1 - G.neg[id] / MAX_LV.neg);   // 1 = full penalty, 0 = overcome
const posV = id => (G.pos[id] ? ITEMS[id].lv(G.pos[id]).v / 100 : 0);
const abS = id => ITEMS[id].lv(G.ab[id]);

function needXp(l){ return Math.round(XP_BASE * Math.pow(G && G.dg ? DG_XP_GROWTH : XP_GROWTH, l - 1)); }

function startRun(stage, charId, items){
  const ch = CHARACTERS[charId];
  G = {
    stage, char:charId, items, combos:new Set(activeCombos(items).map(c => c.id)), cost:loadoutCost(items),
    t:0, kills:0, level:1, xp:0, xpNeed:needXp(1), pendingLevels:0, pendingTreasure:0, state:'play',
    p:{x:0, y:0, r:12, hp:0, maxHp:0, speed:ch.speed, vx:0, vy:0, fx:1, fy:0, inv:0, shield:false, shieldT:0, trail:[], trailT:0},
    enemies:[], projs:[], ebullets:[], gems:[], pickups:[], puddles:[], fx:[], parts:[], texts:[],
    weaponLvl:1, ab:{}, pos:{}, neg:{}, cd:{}, s:{},
    spawnAcc:0, nextWave:40, nextElite:55, boss:null, won:false, endT:0, shake:0, flash:0, orbA:0, droneA:0, puddleT:0, bossShot:0,
    chain:0, chainT:0, maxChain:0, rerolls:2, dmgBy:{}, bonusCoins:0, hudT:0, curOpts:[], hazards:[], frenzy:0, frenzyT:0, revived:false,
  };
  for(const id of items){
    const it = ITEMS[id];
    if(it.type === 'ability') G.ab[id] = 1;
    else if(it.type === 'pos') G.pos[id] = 1;
    else G.neg[id] = 0;
  }
  recalcStats();
  G.p.hp = G.p.maxHp; G.p.slowT = 0;
  if(G.combos.has('gambler')) G.rerolls += 3;
  if(G.ab.shield) G.p.shield = true;
  hub.hidden = true; titleEl.hidden = true;
  $('#hud').hidden = false;
  sfx('start'); setDuck(false);
  $('#bossbar').hidden = true;
  $('#chain').hidden = true;
  modal.hidden = true;
  renderIcons();
  updateHud();
}

function recalcStats(){
  const p = G.p, ch = CHARACTERS[G.char], s = G.s;
  const oldMax = p.maxHp;
  p.maxHp = Math.max(10, Math.round(ch.hp * (1 + posV('tough') - 0.5 * negF('fragile') + skV('vit'))));
  if(oldMax) p.hp = Math.min(p.maxHp, p.hp + Math.max(0, p.maxHp - oldMax));
  p.speed = ch.speed * (1 + posV('swift') - 0.25 * negF('sluggish') + skV('fleet'));
  s.dmgMul = 1 + posV('power') + skV('sharp');
  s.cdMul = (1 - posV('haste')) * (1 + 0.25 * negF('slowhands')) * (1 - skV('quick'));
  s.pickup = 70 * (1 + posV('magnet') + skV('magnet')) * (1 - 0.5 * negF('clumsy'));
  s.crit = (0.05 + posV('lucky') + skV('keen')) * (1 - negF('unlucky'));
  s.critMul = G.pos.precision ? ITEMS.precision.lv(G.pos.precision).v / 100 : 2;
  s.dropMul = 1 - 0.5 * negF('unlucky');
  s.area = 1 + posV('giant');
  s.regen = G.pos.regen ? ITEMS.regen.lv(G.pos.regen).v : 0;
  s.xpMul = 1 + posV('scholar') - 0.3 * negF('dull') + skV('study');
  s.armor = ch.armor + (G.combos.has('fortress') ? 2 : 0) + (G.pos.plating ? ITEMS.plating.lv(G.pos.plating).v : 0) + skV('skin');
  s.dmgTaken = 1 + 0.3 * negF('brittle');
  s.enemyHp = 1 + 0.25 * negF('cursed');
  s.vision = visionFor(negF('nearsighted'));
  s.weaponMul = 1 - 0.4 * negF('feeble');
  s.berserkThr = G.combos.has('glass') ? 0.5 : 0.3;
  s.berserkMul = 1 + posV('berserker');
  s.momentum = posV('momentum') * (G.combos.has('perpetual') ? 2 : 1);
  s.restless = negF('restless');
  s.siphon = posV('siphon');
  s.siphonHeal = G.combos.has('bloodpact') ? 8 : 3;
  s.thorns = G.pos.thorns ? ITEMS.thorns.lv(G.pos.thorns).v * (G.combos.has('spiked') ? 2 : 1) : 0;
  s.retaliate = G.pos.retaliate ? ITEMS.retaliate.lv(G.pos.retaliate).v : 0;
  s.static = G.pos.static ? ITEMS.static.lv(G.pos.static).v : 0;
  s.still = posV('stillness') * (G.combos.has('turret') ? 2 : 1);
  s.exec = G.pos.executioner ? posV('executioner') + (G.combos.has('overkill') ? .1 : 0) : 0;
  s.frenzyMax = G.pos.frenzy ? ITEMS.frenzy.lv(G.pos.frenzy).v * (G.combos.has('feeding') ? 2 : 1) : 0;
  s.revive = G.pos.secondwind ? (G.combos.has('lastbreath') ? 1 : posV('secondwind')) : 0;
  s.bleed = negF('bleeding');
  s.enemySpeed = 1 + 0.15 * negF('hunted');
  s.spawnMul = 1 + 0.25 * negF('swarmed');
  s.invT = 0.45 * (1 - 0.5 * negF('frail'));
  s.choices = 3 + (G.combos.has('bloomer') ? 1 : 0) - (negF('rigid') > .5 ? 1 : 0);
}

/* =====================================================================
   SPAWNING
   ===================================================================== */
function pickType(){
  const st = G.stage;
  let mix = st.mix[0][1];
  for(const [t, m] of st.mix) if(G.t >= t) mix = m;
  let total = 0; for(const k in mix) total += mix[k];
  let r = Math.random() * total;
  for(const k in mix){ r -= mix[k]; if(r <= 0) return k; }
  return Object.keys(mix)[0];
}
function spawnEnemy(type, x, y, elite, skinOverride, child){
  const d = ENEMIES[type], st = G.stage, p = G.p, skin = skinOverride || st.skins[type];
  if(x === undefined){
    const a = Math.random() * TAU, dist = Math.hypot(W, H) / 2 / ZOOM + 60;
    x = p.x + Math.cos(a) * dist; y = p.y + Math.sin(a) * dist;
  }
  let hp = d.hp * (1 + Math.min(G.t, st.dur) / 100) * st.hpMul * G.s.enemyHp;
  if(elite) hp *= 9;
  G.enemies.push({type, skin, x, y, r:d.r * (elite ? 1.7 : 1), hp, maxHp:hp, speed:d.speed * st.speedMul * rand(0.9, 1.1) * (elite ? 0.85 : 1),
    dmg:d.dmg * (elite ? 1.5 : 1), xp:d.xp, color:SKINS[skin].body, armor:d.armor, elite:!!elite,
    slow:0, flash:0, oT:-9, dead:false, seed:Math.random() * TAU, shape:Array.from({length:9}, () => rand(.82, 1.08)), child:!!child, aT:rand(.5, 2.5)});
}
function spawnBoss(){
  const p = G.p, st = G.stage, a = Math.random() * TAU, sk = SKINS[st.boss];
  const hp = st.bossHp * G.s.enemyHp;
  const b = {type:'boss', skin:st.boss, boss:true, x:p.x + Math.cos(a) * 420, y:p.y + Math.sin(a) * 420, r:44, hp, maxHp:hp,
    speed:88 * st.speedMul, dmg:28, xp:0, color:sk.body, armor:st.bossArmor, slow:0, flash:0, oT:-9, dead:false, seed:0, shape:SHAPE, atkT:1.5};
  if(sk.segs) b.segs = Array.from({length:sk.segs}, () => ({x:b.x, y:b.y}));
  G.enemies.push(b); G.boss = b;
  $('#bossName').textContent = sk.name;
  $('#bossbar').hidden = false;
  showBanner('WARNING', 'warn', `${sk.name} has arrived. Defeat it to clear the stage`);
  sfx('warning'); setMusic(st.art, 2);
  G.shake = 0.4;
}

/* =====================================================================
   DAMAGE, DROPS, FEEDBACK
   ===================================================================== */
// kind: undefined = normal hit, 1 = crit, 2 = message
function addText(x, y, txt, kind){
  if(G.texts.length > 90 && kind !== 2) return;
  G.texts.push({x, y, txt, kind:kind || 0, life:kind === 2 ? 1.6 : 0.7, max:kind === 2 ? 1.6 : 0.7});
}
function burst(x, y, color, n, speed, size){
  const arr = G ? G.parts : DEMO.parts;
  for(let i = 0; i < n && arr.length < 700; i++){
    const a = Math.random() * TAU, sp = rand(0.25, 1) * speed;
    arr.push({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, life:rand(0.3, 0.7), max:0.7, c:color, s:rand(1.5, 3.5) * (size || 1)});
  }
}
function hitEnemy(e, base, src){
  if(e.dead) return;
  const s = G.s, p = G.p;
  let m = s.dmgMul;
  if(src === 'weapon') m *= s.weaponMul;
  if(G.pos.berserker && p.hp / p.maxHp < s.berserkThr) m *= s.berserkMul;
  if(G.pos.momentum){ const sp = Math.hypot(p.vx, p.vy); m *= 1 + s.momentum * Math.min(1.5, sp / 150); }
  if(src === 'fireball' && G.combos.has('thermal') && e.slow > 0) m *= 1.6;
  if(s.still && Math.hypot(p.vx, p.vy) < 10) m *= 1 + s.still;
  if(G.dg && SKINS[e.skin].shell) m *= dgShell(e);
  if(G.dg && (e.boss || e.elite)) m *= 1 + skV('slayer');
  let crit = false;
  if(Math.random() < s.crit){ m *= s.critMul; crit = true; }
  const d = Math.max(1, base * m - e.armor);
  e.hp -= d; e.flash = 0.07;
  if(s.exec && !e.boss && e.hp > 0 && e.hp < e.maxHp * s.exec){ e.hp = 0; addText(e.x, e.y - e.r - 14, 'EXECUTE', 2); }
  G.dmgBy[src] = (G.dmgBy[src] || 0) + d;
  addText(e.x + rand(-8, 8), e.y - e.r, Math.round(d), crit ? 1 : undefined);
  sfx(crit ? 'crit' : 'hit');
  if(G.parts.length < 500) burst(e.x, e.y, crit ? '#ffd84a' : '#ffffff', crit ? 4 : 1, 140, 0.8);
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  burst(e.x, e.y, e.color, e.elite ? 30 : e.boss ? 60 : 9, e.elite || e.boss ? 300 : 170, e.elite || e.boss ? 1.6 : 1);
  if(e.boss){ sfx('bigboom'); onBossDead(e); return; }
  sfx(e.elite ? 'boom' : 'kill');
  G.kills++;
  if(G.dg) dgOnKill(e);
  G.chain++; G.chainT = 2.2;
  if(G.chain > G.maxChain) G.maxChain = G.chain;
  G.gems.push({x:e.x, y:e.y, v:e.xp * (1 + Math.min(G.t, G.stage.dur) / 150) * (e.elite ? 8 : 1), mag:false});
  if(e.elite){ dropPickup('chest', e.x, e.y); G.fx.push({type:'ring', x:e.x, y:e.y, r:10, maxR:140, life:0.5, max:0.5, color:'#ffd84a'}); G.shake = 0.25; }
  else {
    const r = Math.random();
    const dm = G.s.dropMul;
    if(r < 0.006 * dm) dropPickup('heart', e.x, e.y);
    else if(r < 0.010 * dm) dropPickup('magnet', e.x, e.y);
    else if(r < 0.013 * dm) dropPickup('bomb', e.x, e.y);
    else if((e.type === 'brute' || e.type === 'armored') && r < 0.03 * dm) dropPickup('chest', e.x, e.y);
  }
  if(G.pos.siphon && Math.random() < G.s.siphon) G.p.hp = Math.min(G.p.maxHp, G.p.hp + G.s.siphonHeal);
  if(G.s.frenzyMax){ G.frenzy = Math.min(G.s.frenzyMax, G.frenzy + 1); G.frenzyT = 3; }
  const ai = SKINS[e.skin].ai;
  if(ai && ai.type === 'split' && !e.child) for(let i = 0; i < ai.n; i++) spawnEnemy('minion', e.x + rand(-12, 12), e.y + rand(-12, 12), false, e.skin, true);

const PICKUPS = {heart:'#ff4f7b', magnet:'#38e1ff', bomb:'#ff8a3d', chest:'#ffd84a'};

function onBossDead(b){

function hurtPlayer(dmg){
  const p = G.p;
  if(p.inv > 0 || G.won || dmg <= 0) return;
  if(p.shield){
    p.shield = false; p.shieldT = shieldRecharge(); p.inv = 0.5; sfx('block');
    const R = 90 * G.s.area;
    G.fx.push({type:'ring', x:p.x, y:p.y, r:10, maxR:R, life:0.35, max:0.35, color:'#38e1ff', fill:true});
    const sh = abS('shield').shock;
    if(sh > 0){ query(p.x, p.y, R + 45, tmpB); for(const e of tmpB) if(Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) hitEnemy(e, sh, 'shield'); }
    return;
  }
  const d = Math.max(1, dmg * G.s.dmgTaken - G.s.armor);
  p.hp -= d; p.inv = G.s.invT; G.shake = 0.22; sfx('hurt');
  burst(p.x, p.y, '#ff4f7b', 6, 180);
  if(G.s.retaliate){
    const R = 110 * G.s.area;
    G.fx.push({type:'ring', x:p.x, y:p.y, r:10, maxR:R, life:0.3, max:0.3, color:'#ff8a3d', fill:true});
    query(p.x, p.y, R + 45, tmpB); for(const e of tmpB.slice()) if(Math.hypot(e.x - p.x, e.y - p.y) < R + e.r) hitEnemy(e, G.s.retaliate, 'retaliate');
  }
  if(p.hp <= 0 && G.dg && dgLastStand()) return;
  if(p.hp <= 0 && G.s.revive && !G.revived){
    G.revived = true; p.hp = Math.max(1, p.maxHp * G.s.revive); p.inv = 2; G.flash = .4;
    G.fx.push({type:'ring', x:p.x, y:p.y, r:10, maxR:200, life:.6, max:.6, color:'#3dffa8', fill:true});
    showBanner('SECOND WIND', 'elite', 'You got back up'); sfx('revive');
    return;
  }
  if(p.hp <= 0){ p.hp = 0; burst(p.x, p.y, CHARACTERS[G.char].color, 50, 320, 1.8); endRun(false); }
}
function shieldRecharge(){ return abS('shield').cd * (G.combos.has('fortress') ? 0.6 : 1) * cdm(); }
function cdm(){ return G.s.cdMul * (1 - G.frenzy / 100); }
const orbitRad = () => abS('orbit').rad * G.s.area;

function nearestEnemy(x, y, maxD){
  if(G.dg) return dgNearest(x, y, maxD);
  let best = null, bd = maxD * maxD;
  for(const e of G.enemies){
    if(e.dead || e.hidden) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function shoot(kind, x, y, ang, speed, o){
  G.projs.push(Object.assign({kind, x, y, vx:Math.cos(ang) * speed, vy:Math.sin(ang) * speed, r:5, life:1.2,
    pierce:0, hits:new Set(), age:0}, o));

/* =====================================================================
   ENEMY ATTACKS — bullets, telegraphed hazards, per-enemy AI and boss
   attack patterns. A hazard always shows a warning before it hurts.
   ===================================================================== */
function ebullet(x, y, a, sp, dmg, color, o){
  G.ebullets.push(Object.assign({x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, r:6, life:5, dmg, color:color || '#ff4fa0'}, o));
  sfx('eshot');
}
function addCircle(x, y, r, warn, dmg, color, pool){ G.hazards.push({kind:'circle', x, y, r, warn, max:warn, dmg, color, pool}); }
function addPool(x, y, r, life, dps, color){ G.hazards.push({kind:'pool', x, y, r, life, max:life, dps, color, tick:0}); }
function addBeam(o){ G.hazards.push(Object.assign({kind:'beam', warnMax:o.warn, rot:0}, o)); sfx('charge'); }
function segDist(px, py, x0, y0, x1, y1){
  const vx = x1 - x0, vy = y1 - y0, l2 = vx * vx + vy * vy || 1;
  const k = Math.max(0, Math.min(1, ((px - x0) * vx + (py - y0) * vy) / l2));
  return Math.hypot(px - x0 - vx * k, py - y0 - vy * k);
}
function updateHazards(dt){
  const p = G.p;
  for(const hz of G.hazards){
    if(hz.kind === 'circle'){
      hz.warn -= dt;
      if(hz.warn <= 0){
        hz.done = true;
        if(Math.hypot(p.x - hz.x, p.y - hz.y) < hz.r + p.r) hurtPlayer(hz.dmg);
        G.fx.push({type:'ring', x:hz.x, y:hz.y, r:hz.r * .3, maxR:hz.r * 1.1, life:.3, max:.3, color:hz.color, fill:true}); sfx('thud');
        burst(hz.x, hz.y, hz.color, 8, 160);
        if(hz.pool) addPool(hz.x, hz.y, hz.r * .85, hz.pool.life, hz.pool.dps, hz.color);
      }
    } else if(hz.kind === 'pool'){
      hz.life -= dt; hz.tick -= dt;
      if(hz.tick <= 0 && Math.hypot(p.x - hz.x, p.y - hz.y) < hz.r + p.r * .5){ hz.tick = .5; hurtPlayer(hz.dps * .5); }
      if(hz.life <= 0) hz.done = true;
    } else if(hz.kind === 'beam'){
      if(hz.owner && !hz.owner.dead){ hz.x = hz.owner.x; hz.y = hz.owner.y; }
      if(hz.warn > 0){ hz.warn -= dt; if(hz.warn <= 0) sfx('laser'); }
      else {
        hz.active -= dt; hz.a += hz.rot * dt;
        if(hz.track){ hz.a = turnToward(hz.a, Math.atan2(p.y - hz.y, p.x - hz.x), hz.track * dt); }
        const x1 = hz.x + Math.cos(hz.a) * hz.len, y1 = hz.y + Math.sin(hz.a) * hz.len;
        if(!(hz.once && hz.hitP) && segDist(p.x, p.y, hz.x, hz.y, x1, y1) < hz.w / 2 + p.r){ if(hz.slow) p.slowT = Math.max(p.slowT, hz.slow); const h0 = p.hp; hurtPlayer(hz.dmg); if(p.hp < h0) hz.hitP = true; }
        if(hz.active <= 0) hz.done = true;
      }
    } else if(hz.kind === 'tele'){ hz.warn -= dt; if(hz.warn <= 0) hz.done = true; }
    else if(HZX[hz.kind]) HZX[hz.kind](hz, dt);
  }
  G.hazards = G.hazards.filter(hz => !hz.done);
}

// returns true when the AI moved the enemy itself this frame
function aiStep(e, ai, dt, d, dx, dy, sp){
  const p = G.p;
  e.aT -= dt;
  if(e.stunT > 0){ e.stunT -= dt; return true; }
  if(G.dg && DG_AI[ai.type]) return DG_AI[ai.type](e, ai, dt, d, dx, dy, sp);
  switch(ai.type){
    case 'dash': {
      if(e.st === 'wind'){ e.stT -= dt; if(e.stT <= 0){ e.st = 'dash'; e.stT = ai.dur; sfx('dash'); } return true; }
      if(e.st === 'dash'){
        e.x += Math.cos(e.da) * ai.speed * dt; e.y += Math.sin(e.da) * ai.speed * dt; e.stT -= dt;
        if(ai.trail && G.t - (e.trT || -9) > .06){ e.trT = G.t; addPool(e.x, e.y, ai.trail.r, ai.trail.life, ai.trail.dps, ai.trail.color); }
        if(e.stT <= 0){
          e.st = null; e.aT = ai.cd;
          if(ai.shock){ G.fx.push({type:'ring', x:e.x, y:e.y, r:10, maxR:ai.shock.r, life:.35, max:.35, color:SKINS[e.skin].glow, fill:true}); if(Math.hypot(p.x - e.x, p.y - e.y) < ai.shock.r + p.r) hurtPlayer(ai.shock.dmg); }
        }
        return true;
      }
      if(e.aT <= 0 && d < ai.range){ e.st = 'wind'; e.stT = ai.wind; e.da = Math.atan2(dy, dx); return true; }
      return false;
    }
    case 'shoot': {
      if(ai.los && G.dg && !dgLos(e.x, e.y, p.x, p.y)) return false;
      if(e.aT <= 0 && d < ai.range){
        e.aT = ai.cd; const a0 = Math.atan2(dy, dx);
        for(let i = 0; i < ai.n; i++) ebullet(e.x, e.y, a0 + (i - (ai.n - 1) / 2) * ai.spread, ai.bs, ai.dmg * (e.pow || 1), ai.color, ai.slow ? {slow:ai.slow} : ai.arrow ? {arrow:true} : null);
      }
      if(d < ai.keep){ e.x -= dx / d * sp * .7 * dt; e.y -= dy / d * sp * .7 * dt; return true; }
      return d < ai.keep + 60;
    }
    case 'mortar': {
      if(e.aT <= 0 && d < ai.range){
        e.aT = ai.cd;
        const tx = p.x + p.vx * .6, ty = p.y + p.vy * .6;
        addCircle(tx, ty, ai.r, ai.warn, ai.dmg, ai.color, ai.pool);
        G.fx.push({type:'lob', x0:e.x, y0:e.y, x:tx, y:ty, life:ai.warn, max:ai.warn, color:ai.color}); sfx('lob');
      }
      return ai.keep > 0 && d < ai.keep;
    }
    case 'aura': if(d < ai.r + p.r) p.slowT = Math.max(p.slowT, .25); return false;
    case 'trail': if(G.t - (e.trT || -9) > ai.every){ e.trT = G.t; addPool(e.x, e.y, ai.r, ai.life, ai.dps, ai.color); } return false;
    case 'burrow': {
      if(e.st === 'under'){
        e.stT -= dt; e.x += dx / d * sp * 2 * dt; e.y += dy / d * sp * 2 * dt;
        if(e.stT <= 0 || d < 40){
          e.st = null; e.hidden = false; e.aT = ai.cd; e.stunT = .3;
          G.fx.push({type:'ring', x:e.x, y:e.y, r:6, maxR:70, life:.35, max:.35, color:'#d9b46a', fill:true});
          burst(e.x, e.y, '#c8a060', 12, 200);
          if(Math.hypot(p.x - e.x, p.y - e.y) < 60) hurtPlayer(e.dmg);
        }
        return true;
      }
      if(e.aT <= 0 && d > 90){ e.st = 'under'; e.hidden = true; e.stT = ai.dur; }
      return false;
    }
    case 'bomb': {
      if(e.st === 'fuse'){
        e.stT -= dt;
        if(e.stT <= 0){
          if(Math.hypot(p.x - e.x, p.y - e.y) < ai.r + p.r) hurtPlayer(ai.dmg);
          G.fx.push({type:'ring', x:e.x, y:e.y, r:10, maxR:ai.r, life:.4, max:.4, color:ai.color, fill:true});
          if(ai.pool) addPool(e.x, e.y, ai.r * .75, ai.pool.life, ai.pool.dps, ai.color);
          sfx('boom'); e.hp = 0; killEnemy(e);
        }
        return true;
      }
      if(d < ai.trigger){ e.st = 'fuse'; e.stT = ai.fuse; e.fuseMax = ai.fuse; return true; }
      return false;
    }
    case 'heal': {
      if(e.aT <= 0){
        e.aT = ai.cd;
        for(const o of G.enemies) if(!o.dead && o !== e && Math.hypot(o.x - e.x, o.y - e.y) < ai.r) o.hp = Math.min(o.maxHp, o.hp + o.maxHp * ai.amt);
        G.fx.push({type:'ring', x:e.x, y:e.y, r:10, maxR:ai.r, life:.5, max:.5, color:'#5aff8a', fill:true});
      }
      if(d < ai.keep){ e.x -= dx / d * sp * .6 * dt; e.y -= dy / d * sp * .6 * dt; return true; }
      return false;
    }
    case 'teleport': {
      if(e.aT <= 0 && d < 700){
        e.aT = ai.cd;
        burst(e.x, e.y, SKINS[e.skin].glow, 10, 160);
        const a = Math.random() * TAU; e.x = p.x + Math.cos(a) * ai.dist; e.y = p.y + Math.sin(a) * ai.dist;
        G.fx.push({type:'ring', x:e.x, y:e.y, r:4, maxR:40, life:.3, max:.3, color:SKINS[e.skin].glow});
        e.stunT = .45; sfx('blink');
        if(ai.shots){ const a0 = Math.atan2(p.y - e.y, p.x - e.x); for(let i = 0; i < ai.shots; i++) ebullet(e.x, e.y, a0 + (i - (ai.shots - 1) / 2) * .28, ai.bs, ai.dmg, ai.color); }
        return true;
      }
      return false;
    }
    case 'laser': {
      if(e.st === 'charge'){ e.stT -= dt; if(e.stT <= 0){ e.st = null; e.aT = ai.cd; } return true; }
      if(e.aT <= 0 && d < ai.range){
        e.st = 'charge'; e.stT = ai.warn + ai.active;
        addBeam({x:e.x, y:e.y, a:Math.atan2(dy, dx), len:ai.range + 120, w:ai.w, warn:ai.warn, active:ai.active, dmg:ai.dmg, color:ai.color, owner:e});
        return true;
      }
      return false;
    }
    case 'summon': {
      if(e.aT <= 0 && G.enemies.length < MAX_ENEMIES){
        e.aT = ai.cd;
        for(let i = 0; i < ai.n; i++) spawnEnemy('minion', e.x + rand(-20, 20), e.y + rand(-20, 20), false, ai.minion, true);
        G.fx.push({type:'ring', x:e.x, y:e.y, r:6, maxR:50, life:.3, max:.3, color:SKINS[e.skin].glow});
      }
      return false;
    }
    case 'hatch': {
      e.hatchT = (e.hatchT === undefined ? ai.t : e.hatchT) - dt;
      if(e.hatchT <= 0){
        e.dead = true; burst(e.x, e.y, '#d8d0b8', 14, 160); sfx('crumble');
        for(let i = 0; i < ai.n; i++) dgSpawn(ai.minion, e.x + rand(-18, 18), e.y + rand(-18, 18), false, 0);
      }
      return true;
    }
    case 'orbit': {
      if(d > ai.r + 160) return false;
      const cur = Math.atan2(e.y - p.y, e.x - p.x), dir = e.seed > Math.PI ? 1 : -1;
      const rr = d + (ai.r - d) * Math.min(1, dt * 1.5), ang = cur + dir * sp / Math.max(80, d) * dt;
      e.x = p.x + Math.cos(ang) * rr; e.y = p.y + Math.sin(ang) * rr;
      if(e.aT <= 0){ e.aT = ai.cd; const off = Math.random() * TAU; for(let i = 0; i < ai.n; i++) ebullet(e.x, e.y, off + i / ai.n * TAU, ai.bs, ai.dmg, ai.color); }
      return true;
    }
  }
  return false;
}

function ring(b, n, sp, dmg, color){ const off = Math.random() * TAU; for(let i = 0; i < n; i++) ebullet(b.x, b.y, off + i / n * TAU, sp, dmg, color); }
// Bosses cycle through their attack patterns. A boss with phases switches to a
// harder pattern list as its HP drops. Old bosses without patterns fire a bullet ring.
function bossPatterns(b, sk){
  if(!sk.phases) return sk.patterns;
  const r = b.hp / b.maxHp;
  let idx = 0;
  sk.phases.forEach((ph, i) => { if(r <= ph.at) idx = i; });
  if(b.phase === undefined) b.phase = idx;
  if(idx > b.phase){
    b.phase = idx; b.act = null; b.atkT = 1.2;
    showBanner(`PHASE ${idx + 1}`, 'warn', sk.phases[idx].msg || ''); sfx('warning'); G.shake = .45;
    if(sk.phases[idx].flood && G.dg && G.dg.flood){ G.dg.flood.on = true; sfx('splash'); }
    b.noTouch = false; b.airH = 0; b.guard = false; if(G.p.pull && G.p.pull.e === b) G.p.pull = null;
    G.fx.push({type:'ring', x:b.x, y:b.y, r:10, maxR:280, life:.6, max:.6, color:sk.glow, fill:true});
    burst(b.x, b.y, sk.glow, 30, 260, 1.4);
  }
  return sk.phases[b.phase].patterns;
}
function dgBlockedAt(x, y){ return !!(G.dg && dgWalkBlocked(G.dg.L, Math.floor(x / DT), Math.floor(y / DT))); }
// a straight rush that stops (and stuns the boss) when it hits a wall
function bossRush(b, A, dt, speed){
  const ax = Math.cos(A.a), ay = Math.sin(A.a), nx = b.x + ax * speed * dt, ny = b.y + ay * speed * dt;
  if(dgBlockedAt(nx + ax * 34, ny + ay * 34)){
    A.crash = A.t; G.shake = .4; sfx('thud');
    burst(b.x + ax * 34, b.y + ay * 34, '#b8ad96', 20, 220);
    G.fx.push({type:'ring', x:b.x, y:b.y, r:10, maxR:130, life:.35, max:.35, color:SKINS[b.skin].glow, fill:true});
    return;
  }
  b.x = nx; b.y = ny;
}
function bossSummon(b, type, skin, n, rad){
  for(let i = 0; i < n; i++){
    const a = i / n * TAU + Math.random(), x = b.x + Math.cos(a) * rad, y = b.y + Math.sin(a) * rad;
    if(G.dg) dgSpawn(type, x, y, false, 0); else spawnEnemy('minion', x, y, false, skin, true);
  }
  G.fx.push({type:'ring', x:b.x, y:b.y, r:10, maxR:rad + 60, life:.4, max:.4, color:SKINS[b.skin].glow, fill:true});
}
function bossStep(b, dt){
  const sk = SKINS[b.skin], p = G.p, pats = bossPatterns(b, sk);
  if(!pats){
    G.bossShot -= dt;
    if(G.bossShot <= 0){ G.bossShot = 2.6; ring(b, 14, 170, 12, '#ff4fa0'); }
    return false;
  }
  if(!b.act){
    b.atkT -= dt;
    if(b.atkT <= 0){
      b.pi = (b.pi === undefined ? -1 : b.pi) + 1; b.act = {name:pats[b.pi % pats.length], t:0, k:0};
      if(G.dg && ATK_NAME[b.act.name]) addText(b.x, b.y - 30, ATK_NAME[b.act.name], 2);
    }
    if(sk.anchored){  // stays in its pool and drifts back to it
      const h = b.home, dx = h.x - b.x, dy = h.y - b.y, d = Math.hypot(dx, dy);
      if(d > 4){ b.x += dx / d * Math.min(d, 260 * dt); b.y += dy / d * Math.min(d, 260 * dt); }
      return true;
    }
    if(sk.keep){      // archers back away to keep their distance
      const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1;
      if(d < sk.keep){ b.x -= dx / d * b.speed * .9 * dt; b.y -= dy / d * b.speed * .9 * dt; return true; }
      return d < sk.keep + 140;
    }
    return false;
  }
  const A = b.act, aim = Math.atan2(p.y - b.y, p.x - b.x), dmg = sk.dmg || 14;
  A.t += dt;
  let hold = false, done = false;
  switch(A.name){
    case 'ring': ring(b, 18, 170, 12, sk.glow); done = true; break;
    case 'spiral':
      hold = true; A.k -= dt;
      while(A.k <= 0){ A.k += .07; A.ang = (A.ang || 0) + .33; for(const o of [0, Math.PI]) ebullet(b.x, b.y, A.ang + o, 190, 10, sk.glow); }
      if(A.t > 2.4) done = true; break;
    case 'aimed':
      while(A.k < 3 && A.t >= A.k * .45){ for(let i = -2; i <= 2; i++) ebullet(b.x, b.y, aim + i * .18, 240, 11, sk.glow); A.k++; }
      if(A.t > 1.2) done = true; break;

    case 'orbs':

    case 'coral':

    case 'prison':

    case 'mirror':
      if(G.dg){
        const L = G.dg.L, tiles = L.zoneTiles[10];
        for(let i = 0; i < 2; i++){
          const t = tiles[Math.floor(Math.random() * tiles.length)];
          const e = dgSpawn('decoy', (t % L.W + .5) * DT, (Math.floor(t / L.W) + .5) * DT, false, 0);
          if(e){ e.rise = e.riseMax = .3; e.hp = e.maxHp = 220; }
        }

      }

    case 'submerge':

      if(A.t < .9) b.airH = -Math.min(1, A.t * 3) * 110;
      else if(A.k === 1){
        A.k = 2;
        if(G.dg){ const L = G.dg.L, tiles = L.zoneTiles[10]; for(let k = 0; k < 20; k++){ const t = tiles[Math.floor(Math.random() * tiles.length)], x = (t % L.W + .5) * DT, y = (Math.floor(t / L.W) + .5) * DT; if(Math.hypot(x - p.x, y - p.y) > 260 && !dgBlockedAt(x, y)){ b.x = x; b.y = y; break; } } }
        b.airH = 0; b.noTouch = false; ring(b, 16, 200, dmg * .4, '#9fe8ff'); sfx('blink');

    // ---- Thunder Eel ----
    case 'electrify':

    case 'eeldash':

      break;
    case 'coil': {
      hold = true;
      if(!A.k){ A.k = 1; const c = b.home || {x:b.x, y:b.y}; A.cx = c.x; A.cy = c.y; A.ang = Math.atan2(b.y - c.y, b.x - c.x); }
      A.ang += 1.9 * dt;
      const tx = A.cx + Math.cos(A.ang) * 300, ty = A.cy + Math.sin(A.ang) * 300;
      b.x += (tx - b.x) * Math.min(1, dt * 5); b.y += (ty - b.y) * Math.min(1, dt * 5);
      if(G.dg) dgCollide(b, b.r);
      A.kk = (A.kk || 0) - dt;
      if(A.kk <= 0){ A.kk = .32; ebullet(b.x, b.y, aim, 260, dmg * .4, '#fff07a', {r:8}); }

    }
    case 'sparks':
      for(let i = 0; i < 6; i++) ebullet(b.x, b.y, aim + (i - 2.5) * .45, 180, dmg * .45, '#fff07a', {bounce:3, life:6, r:10});
      sfx('shock'); done = true; break;
    // ---- The Drowned Admiral ----
    case 'broadside': {
      hold = true;
      if(!A.k){
        A.k = 1; A.rows = [];
        const L = G.dg ? G.dg.L : null, bx = L ? L.zoneBox[10] : null;
        const x0 = bx ? (bx.x0 + .5) * DT : p.x - 600, x1 = bx ? (bx.x1 + .5) * DT : p.x + 600, fromWest = Math.random() < .5;
        const gap = Math.floor(rand(2, 7));

        }
