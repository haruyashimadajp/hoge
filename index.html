      }
      if(A.t >= .9 && A.k === 1){ A.k = 2; for(const [x, y, a] of A.rows) ebullet(x, y, a, 520, dmg * .7, '#c8d0d8', {r:13, life:4}); sfx('bigboom'); G.shake = .3; }
      if(A.t > 1.4) done = true;
      break;
    }
    case 'cannons':
      for(let i = 0; i < 10; i++){ const a = Math.random() * TAU, r = i < 3 ? rand(0, 60) : rand(80, 300), x = p.x + p.vx * .5 + Math.cos(a) * r, y = p.y + p.vy * .5 + Math.sin(a) * r; addCircle(x, y, 58, .9 + i * .1, dmg * .6, '#ff8a3d'); }
      sfx('lob'); done = true; break;
    case 'grapeshot':
      // three blasts of grapeshot in a cone
      hold = true;
      while(A.k < 3 && A.t >= .3 + A.k * .45){ for(let i = 0; i < 9; i++) ebullet(b.x, b.y, aim + rand(-.5, .5), rand(260, 360), dmg * .35, '#c8fff8', {r:6, model:'rivet'}); sfx('lob'); G.shake = .2; A.k++; }
      if(A.t > 1.6) done = true;
      break;
    case 'crew': bossSummon(b, 'ghost', sk.minion, 4, 100); sfx('elite'); done = true; break;
    case 'cutlass':
      hold = true;
      if(!A.k){ A.k = 1; G.hazards.push({kind:'aura', owner:b, r:b.r + 80, life:3, max:3, wind:.6, dmg:dmg * .65, tick:.6, color:sk.glow}); sfx('charge'); }
      if(A.t > .6 && A.t < 3){ const dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1, sp = b.speed * 1.45; b.x += dx / d * sp * dt; b.y += dy / d * sp * dt; }
      if(A.t > 3.2) done = true;
      break;
    // ---- Leviathan of the Reservoir (it stays in its pool; its head lunges out) ----
    case 'bite':
      hold = true;
      if(A.k < 3 && A.t >= A.k * .85){
        A.from = {x:b.x, y:b.y};
        let tx = p.x + p.vx * .3, ty = p.y + p.vy * .3;
        const h = b.home, dd = Math.hypot(tx - h.x, ty - h.y), reach = 520;
        if(dd > reach){ tx = h.x + (tx - h.x) / dd * reach; ty = h.y + (ty - h.y) / dd * reach; }
        A.to = {x:tx, y:ty}; A.k0 = A.t; A.k++;
        addCircle(tx, ty, 88, .6, dmg * 1.1, '#7df9ff'); b.noTouch = true; sfx('charge');
      }
      if(A.to){ const q = Math.min(1, (A.t - A.k0) / .6); b.x = A.from.x + (A.to.x - A.from.x) * q; b.y = A.from.y + (A.to.y - A.from.y) * q; b.airH = Math.sin(q * Math.PI) * 90; if(q >= 1){ b.noTouch = false; b.airH = 0; } }
      if(A.t > 2.9){ b.noTouch = false; b.airH = 0; done = true; }
      break;
    case 'wreckage':
      // chunks of wreck hurled at you; each shatters into splinters where it lands
      for(let i = 0; i < 4; i++){
        const a = Math.random() * TAU, r = i ? rand(110, 280) : 0, tx = p.x + p.vx * .6 + Math.cos(a) * r, ty = p.y + p.vy * .6 + Math.sin(a) * r, w = 1.1 + i * .15;
        dgLob(b.x, b.y, tx, ty, w, 70, dmg * .8, '#c8a070', 'plank', () => dgShards(tx, ty, 7, 220, dmg * .3, '#e8c890', 'rivet'));
      }
      sfx('lob'); done = true; break;
    case 'tidal':
      hold = true;
      while(A.k < 2 && A.t >= .4 + A.k * 1.3){ addWave(b, 760, 250, '#7df9ff', dmg * .7); sfx('splash'); A.k++; }
      if(A.t > 2.4) done = true;
      break;
    case 'spit':
      hold = true;
      while(A.k < 3 && A.t >= A.k * .4){ for(let i = -2; i <= 2; i++) ebullet(b.x, b.y, aim + i * .14, 300, dmg * .45, '#7df9ff', {r:9}); A.k++; }
      if(A.t > 1.2) done = true;
      break;
    case 'whirlpool':
      hold = true;
      if(!A.k){ A.k = 1; p.pull = {e:b, t:3.2, sp:135, stop:b.r + 10}; G.hazards.push({kind:'aura', owner:b, r:b.r + 110, life:3.4, max:3.4, wind:.5, dmg:dmg * .6, tick:.5, color:'#7df9ff'}); addText(p.x, p.y - 34, 'WHIRLPOOL · GET AWAY', 2); sfx('splash'); }
      if(A.t % .25 < dt) G.fx.push({type:'ring', x:b.x, y:b.y, r:b.r + 300, maxR:b.r + 20, life:.5, max:.5, color:'#7df9ff'});
      if(A.t > 3.6) done = true;
      break;
    case 'tailsweep':
      hold = true;
      if(!A.k){ A.k = 1; const dir = Math.random() < .5 ? 1 : -1; addBeam({x:b.x, y:b.y, a:aim - dir * 2.6, rot:dir * 1.6, len:620, w:44, warn:.8, active:3.3, dmg:dmg * .7, color:'#2f8aa0', owner:b, once:true}); }
      if(A.t > 4.2) done = true;
      break;
    case 'eels':
      if(G.dg){   // never more than six of its eels at once
        const have = G.enemies.filter(e => !e.dead && e.type === 'eel').length;
        for(let i = 0; i < Math.min(3, 6 - have); i++){ const a = i / 3 * TAU + Math.random(), x = b.x + Math.cos(a) * (b.r + 70), y = b.y + Math.sin(a) * (b.r + 70); dgSpawn('eel', x, y, false, 0); }
      }
      sfx('splash'); done = true; break;
    case 'torrent':
      hold = true;
      if(!A.k){ A.k = 1; addBeam({x:b.x, y:b.y, a:aim, rot:0, track:.8, len:900, w:40, warn:1, active:2.6, dmg:dmg * .5, color:'#7df9ff', owner:b, slow:.6}); }
      if(A.t > 3.8) done = true;
      break;
    default: done = true;
  }
  if(done){ b.act = null; b.atkT = sk.phases ? (b.phase >= 2 ? .7 : 1.1) : 1.4; }
  return hold;
}

// expanding shockwave ring: it hurts once when its edge passes you, so roll through it or stay out of reach
function addWave(b, maxR, speed, color, dmg){ G.hazards.push({kind:'wave', x:b.x, y:b.y, r:b.r * .6, maxR, speed, w:30, dmg, color, hit:false}); }
const HZX = {
  wave(hz, dt){
    const p = G.p; hz.r += hz.speed * dt;
    if(!hz.hit && Math.abs(Math.hypot(p.x - hz.x, p.y - hz.y) - hz.r) < hz.w / 2 + p.r){ hz.hit = true; hurtPlayer(hz.dmg); }
    if(hz.r > hz.maxR) hz.done = true;
  },
  web(hz, dt){
    const p = G.p;
    if(hz.delay > 0){ hz.delay -= dt; return; }
    hz.life -= dt;
    if(Math.hypot(p.x - hz.x, p.y - hz.y) < hz.r) p.webT = .12;
    if(hz.life <= 0) hz.done = true;
  },
  aura(hz, dt){
    const p = G.p, o = hz.owner;
    if(!o || o.dead){ hz.done = true; return; }
    hz.x = o.x; hz.y = o.y; hz.life -= dt; hz.tick -= dt;
    if(hz.tick <= 0){
      hz.tick = .4;
      G.fx.push({type:'ring', x:o.x, y:o.y, r:hz.r * .5, maxR:hz.r, life:.25, max:.25, color:hz.color});
      if(Math.hypot(p.x - o.x, p.y - o.y) < hz.r + p.r) hurtPlayer(hz.dmg);
    }
    if(hz.life <= 0) hz.done = true;
  },
};
const HZD = {
  wave(hz){
    const k = 1 - hz.r / hz.maxR;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = hexA(hz.color, .35 * k + .1); ctx.lineWidth = hz.w * 1.6; ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = hexA('#ffffff', .7 * k + .2); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  },
  web(hz){
    if(hz.delay > 0) return;
    const k = Math.min(1, hz.life / 1.5, (hz.max - hz.life) * 4), n = 10;
    ctx.save(); ctx.translate(hz.x, hz.y); ctx.rotate(hz.seed);
    ctx.fillStyle = `rgba(230,230,230,${.08 * k})`; ctx.beginPath(); ctx.arc(0, 0, hz.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(240,240,240,${.75 * k})`; ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i = 0; i < n; i++){ const a = i / n * TAU; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * hz.r, Math.sin(a) * hz.r); }
    for(let j = 1; j <= 4; j++){ const rr = hz.r * j / 4.3; for(let i = 0; i <= n; i++){ const a = i / n * TAU; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
    ctx.stroke(); ctx.restore();
  },
  aura(hz){
    const k = hz.life > hz.max - hz.wind ? (hz.max - hz.life) / hz.wind : 1;
    ctx.fillStyle = hexA('#ff3d5a', .07 + .1 * k); ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA('#ff3d5a', .45 + .4 * k); ctx.lineWidth = 3; ctx.setLineDash([14, 10]); ctx.lineDashOffset = -G.t * 120;
    ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
  },
};

// water tiles inside the boss chamber (for the Thunder Eel's Electrify)
function dgArenaWater(){
  const L = G.dg.L, out = [];
  for(const i of L.zoneTiles[10] || []){ const x = (i % L.W + .5) * DT, y = (Math.floor(i / L.W) + .5) * DT; if(dgWaterAt(x, y)) out.push(i); }
  return out;
}
Object.assign(HZX, {
  // a cone in front of a boss: fills up, then hits everything inside it
  cone(hz, dt){
    hz.warn -= dt;
    if(hz.warn > 0) return;
    hz.done = true;
    const p = G.p, dx = p.x - hz.x, dy = p.y - hz.y, d = Math.hypot(dx, dy);
    let diff = Math.abs((Math.atan2(dy, dx) - hz.a) % TAU); if(diff > Math.PI) diff = TAU - diff;
    if(d < hz.r + p.r && diff < hz.spread / 2 + .1) hurtPlayer(hz.dmg);
    G.fx.push({type:'ring', x:hz.x, y:hz.y, r:hz.r * .4, maxR:hz.r, life:.25, max:.25, color:hz.color}); sfx('slash');
  },
  // every water tile in the room is electrified for a moment
  shock(hz, dt){
    const p = G.p;
    if(hz.warn > 0){ hz.warn -= dt; if(hz.warn <= 0){ sfx('shock'); G.flash = .15; } return; }
    hz.active -= dt;
    if(dgWaterAt(p.x, p.y) && G.dg.L.z[tileAt(G.dg.L, p.x, p.y)] === 10) hurtPlayer(hz.dmg);
    if(hz.active <= 0) hz.done = true;
  },
});
Object.assign(HZD, {
  cone(hz){
    const k = 1 - hz.warn / hz.max;
    ctx.fillStyle = hexA('#ff3d5a', .1 + .18 * k);
    ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.arc(hz.x, hz.y, hz.r, hz.a - hz.spread / 2, hz.a + hz.spread / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = hexA(hz.color, .35);
    ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.arc(hz.x, hz.y, hz.r * k, hz.a - hz.spread / 2, hz.a + hz.spread / 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hexA('#ff3d5a', .8); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.arc(hz.x, hz.y, hz.r, hz.a - hz.spread / 2, hz.a + hz.spread / 2); ctx.closePath(); ctx.stroke();
  },
  shock(hz){
    const L = G.dg.L, on = hz.warn <= 0, blink = on || Math.floor(hz.warn * 8) % 2 === 0;
    if(!blink) return;
    ctx.globalCompositeOperation = on ? 'lighter' : 'source-over';
    ctx.fillStyle = on ? 'rgba(255,240,122,.55)' : 'rgba(255,61,90,.22)';
    for(const i of hz.tiles){ const x = (i % L.W) * DT, y = Math.floor(i / L.W) * DT; ctx.fillRect(x + 2, y + 2, DT - 4, DT - 4); }
    ctx.globalCompositeOperation = 'source-over';
  },
});

function drawHazards(beams){
  const t = G.t;
  for(const hz of G.hazards){
    if(hz.kind === 'circle' && !beams){
      const k = 1 - hz.warn / hz.max;
      ctx.fillStyle = hexA('#ff3d5a', .08 + .12 * k); ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r, 0, TAU); ctx.fill();
      ctx.fillStyle = hexA(hz.color, .3); ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r * k, 0, TAU); ctx.fill();
      ctx.strokeStyle = hexA('#ff3d5a', .8); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hz.x, hz.y, hz.r, 0, TAU); ctx.stroke();
    } else if(hz.kind === 'pool' && !beams){
      const k = Math.min(1, hz.life / hz.max * 3);
      addGlow(hz.color, hz.x, hz.y, hz.r * 1.4, .35 * k);
      ell(hz.x, hz.y, hz.r, hz.r * .8, 0, hexA(hz.color, .28 * k));
      dot(hz.x + Math.sin(t * 3 + hz.x) * hz.r * .4, hz.y + Math.cos(t * 2 + hz.y) * hz.r * .3, 2.5, hexA('#ffffff', .5 * k));
    } else if(HZD[hz.kind] && !beams){ HZD[hz.kind](hz);
    } else if(hz.kind === 'tele' && !beams){
      // a charge is coming: a red lane from the boss
      const k = 1 - hz.warn / hz.max, x1 = hz.x + Math.cos(hz.a) * hz.len, y1 = hz.y + Math.sin(hz.a) * hz.len;
      ctx.lineCap = 'butt';
      ctx.strokeStyle = hexA('#ff3d5a', .12 + .16 * k); ctx.lineWidth = hz.w; ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = hexA('#ff3d5a', .75); ctx.lineWidth = 2.5; ctx.setLineDash([14, 10]);
      ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
      const ax = Math.cos(hz.a), ay = Math.sin(hz.a);
      ctx.fillStyle = hexA('#ff3d5a', .6 + .3 * k); ctx.beginPath(); ctx.moveTo(x1 + ax * 26, y1 + ay * 26); ctx.lineTo(x1 - ay * 18, y1 + ax * 18); ctx.lineTo(x1 + ay * 18, y1 - ax * 18); ctx.closePath(); ctx.fill();
    } else if(hz.kind === 'beam' && beams){
      const x1 = hz.x + Math.cos(hz.a) * hz.len, y1 = hz.y + Math.sin(hz.a) * hz.len;
      ctx.lineCap = 'round';
      if(hz.warn > 0){
        ctx.strokeStyle = hexA('#ff3d5a', .35 + .3 * Math.sin(t * 20)); ctx.lineWidth = 2; ctx.setLineDash([12, 10]);
        ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = hexA(hz.color, .12); ctx.lineWidth = hz.w; ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke();
      } else {
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = hexA(hz.color, .45); ctx.lineWidth = hz.w * 1.6; ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.strokeStyle = hz.color; ctx.lineWidth = hz.w * .7; ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = hz.w * .25; ctx.beginPath(); ctx.moveTo(hz.x, hz.y); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
}

/* =====================================================================
   WEAPONS & ABILITIES
   ===================================================================== */
function fireWeapon(){
  const p = G.p, s = G.s, wid = CHARACTERS[G.char].weapon, st = WEAPONS[wid].lv(G.weaponLvl);
  if(wid === 'bolt'){
    const t = nearestEnemy(p.x, p.y, 520);
    if(!t) return 0.15;
    const base = Math.atan2(t.y - p.y, t.x - p.x);
    for(let i = 0; i < st.count; i++){
      const a = base + (i - (st.count - 1) / 2) * 0.14;
      shoot('bolt', p.x, p.y, a, 470, {src:'weapon', dmg:st.dmg, pierce:st.pierce, color:'#7fd8ff', r:5});
    }
    sfx('shoot');
    return st.cd * cdm();
  }
  const R = st.range * s.area;
  const near = nearestEnemy(p.x, p.y, R + 80);
  const dirs = [near ? Math.atan2(near.y - p.y, near.x - p.x) : Math.atan2(p.fy, p.fx)];
  if(st.back) dirs.push(dirs[0] + Math.PI);
  for(const dir of dirs){
    query(p.x, p.y, R + 45, tmpA);
    for(const e of tmpA){
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if(d > R + e.r) continue;
      let da = Math.abs(Math.atan2(dy, dx) - dir) % TAU; if(da > Math.PI) da = TAU - da;
      if(da <= Math.PI / 3 || d < e.r + p.r) hitEnemy(e, st.dmg, 'weapon');
    }
    G.fx.push({type:'arc', x:p.x, y:p.y, r:R, dir, life:0.2, max:0.2, color:'#ffc46b'});
  }
  sfx('slash');
  return st.cd * cdm();
}

function useAbility(id){
  const p = G.p, s = G.s, st = abS(id);
  switch(id){
    case 'fireball': {
      for(let i = 0; i < st.n; i++){
        const t = nearestEnemy(p.x, p.y, 520);
        if(!t) return 0.3;
        const a = Math.atan2(t.y - p.y, t.x - p.x) + (i ? (i % 2 ? 0.4 : -0.4) : 0);
        shoot('fire', p.x, p.y, a, 340, {src:'fireball', dmg:st.dmg, r:8, life:1.4, aoe:st.aoe * s.area, color:'#ff8a3d'});
      }
      sfx('fire');
      return st.cd * cdm();
    }
    case 'frost': {
      const R = st.rad * s.area, slow = st.slow * (G.combos.has('blizzard') ? 2 : 1);
      query(p.x, p.y, R + 45, tmpA);
      for(const e of tmpA) if(Math.hypot(e.x - p.x, e.y - p.y) < R + e.r){ e.slow = slow; hitEnemy(e, st.dmg, 'frost'); }
      G.fx.push({type:'ring', x:p.x, y:p.y, r:20, maxR:R, life:0.4, max:0.4, color:'#8fe3ff', fill:true});
      G.fx.push({type:'frost', x:p.x, y:p.y, r:R, life:0.5, max:0.5, color:'#c9f4ff'}); sfx('frost');
      return st.cd * cdm();
    }
    case 'drone': {
      let shot = false;
      for(let i = 0; i < st.n; i++){
        const a = G.droneA + i / st.n * TAU, dx = p.x + Math.cos(a) * 48, dy = p.y + Math.sin(a) * 48;
        const t = nearestEnemy(dx, dy, 480);
        if(!t) continue;
        shot = true;
        shoot('bolt', dx, dy, Math.atan2(t.y - dy, t.x - dx), 430, {src:'drone', dmg:st.dmg, r:4, color:'#6dffc4'});
      }
      if(shot) sfx('drone');
      return shot ? st.cd * cdm() : 0.2;
    }
    case 'lightning': {
      const hw = W / 2 / ZOOM, hh = H / 2 / ZOOM;
      const vis = G.enemies.filter(e => !e.dead && !e.hidden && Math.abs(e.x - p.x) < hw && Math.abs(e.y - p.y) < hh);
      if(!vis.length) return 0.3;
      for(let i = 0; i < st.n && vis.length; i++){
        const e = vis.splice(Math.floor(Math.random() * vis.length), 1)[0];
        G.fx.push({type:'bolt', x:e.x, y:e.y, x0:e.x + rand(-50, 50), y0:e.y - hh - 40, life:0.22, max:0.22, color:'#fff07a'});
        G.fx.push({type:'ring', x:e.x, y:e.y, r:4, maxR:34, life:0.25, max:0.25, color:'#fff07a'});
        HITFROM = e; hitEnemy(e, st.dmg, 'lightning'); HITFROM = null;
        if(G.combos.has('overcharge')){
          query(e.x, e.y, 150, tmpB);
          tmpB.sort((a, b) => ((a.x - e.x) ** 2 + (a.y - e.y) ** 2) - ((b.x - e.x) ** 2 + (b.y - e.y) ** 2));
          let c = 0;
          for(const o of tmpB){
            if(o === e || o.dead) continue;
            G.fx.push({type:'bolt', x:o.x, y:o.y, x0:e.x, y0:e.y, life:0.2, max:0.2, color:'#fff07a'});
            hitEnemy(o, st.dmg * 0.6, 'lightning');
            if(++c >= 2) break;
          }
        }
      }
      G.shake = Math.max(G.shake, 0.06); sfx('zap');
      return st.cd * cdm();
    }
    case 'boomerang': {
      const base = Math.atan2(p.fy, p.fx), far = G.combos.has('kite') ? 1.3 : 1;
      for(let i = 0; i < st.n; i++){
        shoot('boom', p.x, p.y, base + (i - (st.n - 1) / 2) * 0.5, 420 * far, {src:'boomerang', dmg:st.dmg, r:12, life:4, hits:new Map(), color:'#ffe08a'});
      }
      sfx('whoosh');
      return st.cd * cdm();
    }
  }
  return 1;
}

function explode(pr){
  if(pr.exploded) return;
  pr.exploded = true; pr.life = 0;
  query(pr.x, pr.y, pr.aoe + 45, tmpB);
  const hf = HITFROM; HITFROM = {x:pr.x, y:pr.y};
  for(const e of tmpB) if(Math.hypot(e.x - pr.x, e.y - pr.y) < pr.aoe + e.r) hitEnemy(e, pr.dmg, 'fireball');
  HITFROM = hf;
  G.fx.push({type:'ring', x:pr.x, y:pr.y, r:10, maxR:pr.aoe, life:0.35, max:0.35, color:'#ff8a3d', fill:true});
  burst(pr.x, pr.y, '#ffb23d', 12, 220); sfx('boom');
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt){
  const g = G, p = g.p, s = g.s, st = g.stage;
  g.t += dt;

  let ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), iy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  if(joy.active){ ix += joy.dx; iy += joy.dy; }
  let il = Math.hypot(ix, iy);
  if(il > 1){ ix /= il; iy /= il; il = 1; }
  if(il > 0.05){ p.fx = ix / il; p.fy = iy / il; }
  if(s.restless > 0 && il < s.restless){ ix = p.fx * s.restless; iy = p.fy * s.restless; }
  const spd = p.speed * (p.slowT > 0 ? 0.6 : 1);
  if(p.slowT > 0) p.slowT -= dt;
  p.vx = ix * spd; p.vy = iy * spd;
  if(g.dg) dgMovePlayer(dt); else { p.x += p.vx * dt; p.y += p.vy * dt; }
  p.trailT -= dt;
  if(p.trailT <= 0){ p.trailT = 0.035; p.trail.push({x:p.x, y:p.y}); if(p.trail.length > 8) p.trail.shift(); }

  if(s.regen) p.hp = Math.min(p.maxHp, p.hp + s.regen * dt);
  if(s.bleed && p.hp > 1) p.hp = Math.max(1, p.hp - s.bleed * dt);
  if(g.frenzyT > 0){ g.frenzyT -= dt; if(g.frenzyT <= 0) g.frenzy = 0; }
  if(p.inv > 0) p.inv -= dt;
  if(g.ab.shield && !p.shield){ p.shieldT -= dt; if(p.shieldT <= 0) p.shield = true; }
  if(g.shake > 0) g.shake = Math.max(0, g.shake - dt);
  if(g.flash > 0) g.flash -= dt;
  if(g.chainT > 0){ g.chainT -= dt; if(g.chainT <= 0) g.chain = 0; }

  if(g.dg) dgTick(dt);
  else if(!g.won){
    if(!g.boss && g.t >= st.dur) spawnBoss();
    const rate = Math.min(11, st.spawn * (1.2 + g.t / 35)) * (g.boss ? 0.35 : 1) * s.spawnMul;
    g.spawnAcc += rate * dt;
    while(g.spawnAcc >= 1){ g.spawnAcc--; if(g.enemies.length < MAX_ENEMIES) spawnEnemy(pickType()); }
    if(g.t >= g.nextWave && !g.boss){
      g.nextWave += 40;
      const type = pickType(), n = 24;
      for(let i = 0; i < n; i++){
        const a = i / n * TAU;
        if(g.enemies.length < MAX_ENEMIES + 40) spawnEnemy(type, p.x + Math.cos(a) * 440, p.y + Math.sin(a) * 440);
      }
      showBanner('SWARM', 'warn', 'You are surrounded'); sfx('swarm');
    }
    if(g.t >= g.nextElite && !g.boss){
      g.nextElite += 55;
      spawnEnemy(pickType(), undefined, undefined, true);
      showBanner('ELITE', 'elite', 'Defeat the golden enemy for a treasure chest'); sfx('elite');
    }
  }

  for(const e of g.enemies){
    if(e.dead) continue;
    if(e.slow > 0) e.slow -= dt;
    if(e.flash > 0) e.flash -= dt;
    if(e.rise > 0){ e.rise -= dt; continue; }     // dungeon enemies climb out of the floor first
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    const sp = e.speed * (e.slow > 0 ? 0.5 : 1) * s.enemySpeed;
    let held = false;
    if(e.boss) held = bossStep(e, dt, d);
    else if(SKINS[e.skin].ai) held = aiStep(e, SKINS[e.skin].ai, dt, d, dx, dy, sp);
    if(e.dead) continue;
    if(!held){ if(g.dg) dgChase(e, sp, dt, dx, dy, d); else { e.x += dx / d * sp * dt; e.y += dy / d * sp * dt; } }
    if(e.segs){ let px = e.x, py = e.y; for(const sg of e.segs){ const ddx = sg.x - px, ddy = sg.y - py, dd = Math.hypot(ddx, ddy) || 1, gap = e.r * .8; if(dd > gap){ sg.x = px + ddx / dd * gap; sg.y = py + ddy / dd * gap; } px = sg.x; py = sg.y; } }
    if(!g.dg && e.boss && d > 650){ const a = Math.random() * TAU; e.x = p.x + Math.cos(a) * 420; e.y = p.y + Math.sin(a) * 420; }
    if(d > 1400 && !e.boss && !g.dg){
      const a = Math.atan2(p.fy, p.fx) + rand(-0.8, 0.8), r = Math.hypot(W, H) / 2 / ZOOM + 60;
      e.x = p.x + Math.cos(a) * r; e.y = p.y + Math.sin(a) * r;
    }
  }
  gridBuild();
  for(const e of g.enemies){
    if(e.dead) continue;
    query(e.x, e.y, e.r + 45, tmpA);
    for(const o of tmpA){
      if(o === e) continue;
      const dx = e.x - o.x, dy = e.y - o.y, rr = e.r + o.r, d2 = dx * dx + dy * dy;
      if(d2 < rr * rr && d2 > 0.01){
        const d = Math.sqrt(d2), push = (rr - d) * 0.25 * (e.boss ? 0.1 : 1);
        e.x += dx / d * push; e.y += dy / d * push;
      }
    }
  }
  if(g.dg) for(const e of g.enemies) if(!e.dead) dgCollide(e, e.r);
  query(p.x, p.y, 80, tmpA);
  for(const e of tmpA) if(!(e.rise > 0) && !e.noTouch && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r){
    const hp0 = p.hp;
    hurtPlayer(e.dmg);
    if(g.dg && p.hp < hp0) dgContact(e);
    if(s.thorns && g.t - (e.thT || -9) > .5){ e.thT = g.t; hitEnemy(e, s.thorns, 'thorns'); }
  }
  if(g.state !== 'play') return;

  for(const b of g.ebullets){
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if(g.dg && dgBullet(b, dt)) continue;           // walls, bounces, homing; rolling makes shots pass through you
    if(Math.hypot(b.x - p.x, b.y - p.y) < b.r + p.r){ b.life = 0; if(b.slow) p.slowT = Math.max(p.slowT, b.slow); if(b.root) p.rootT = Math.max(p.rootT || 0, b.root); if(g.dg) dgBulletHit(b); hurtPlayer(b.dmg); }
  }
  g.ebullets = g.ebullets.filter(b => b.life > 0);
  updateHazards(dt);
  if(g.state !== 'play') return;

  g.cd.weapon = (g.cd.weapon || 0) - dt;
  if(g.cd.weapon <= 0) g.cd.weapon = fireWeapon();
  for(const id in g.ab){
    if(id === 'orbit' || id === 'shield' || id === 'poison') continue;
    g.cd[id] = (g.cd[id] === undefined ? 0.5 : g.cd[id]) - dt;
    if(g.cd[id] <= 0) g.cd[id] = useAbility(id);
  }
  g.droneA += dt * 1.4;
  if(s.static){
    g.cd.static = (g.cd.static === undefined ? 1 : g.cd.static) - dt;
    if(g.cd.static <= 0){
      g.cd.static = 1.5 * cdm();
      query(p.x, p.y, 320, tmpB);
      const n = g.combos.has('stormcoil') ? 3 : 1;
      for(let i = 0; i < n && tmpB.length; i++){
        const e = tmpB.splice(Math.floor(Math.random() * tmpB.length), 1)[0];
        G.fx.push({type:'bolt', x:e.x, y:e.y, x0:p.x, y0:p.y, life:.15, max:.15, color:'#9fd8ff'});
        hitEnemy(e, s.static, 'static');
      }
    }
  }

  if(g.ab.orbit){
    const os = abS('orbit'), n = os.n + (g.combos.has('closeq') ? 1 : 0);
    g.orbA += dt * 3.2;
    for(let i = 0; i < n; i++){
      const a = g.orbA + i / n * TAU, bx = p.x + Math.cos(a) * orbitRad(), by = p.y + Math.sin(a) * orbitRad();
      query(bx, by, 60, tmpA);
      for(const e of tmpA){
        if(g.t - e.oT < 0.35) continue;
        if(Math.hypot(e.x - bx, e.y - by) < e.r + 11){ e.oT = g.t; HITFROM = {x:bx, y:by}; hitEnemy(e, os.dmg, 'orbit'); HITFROM = null; }
      }
    }
  }

  if(g.ab.poison){
    const ps = abS('poison'), plague = g.combos.has('plague');
    g.puddleT -= dt;
    if(g.puddleT <= 0 && Math.hypot(p.vx, p.vy) > 20){
      g.puddleT = 0.25;
      const life = ps.life * (plague ? 2 : 1);
      g.puddles.push({x:p.x, y:p.y, r:ps.size * s.area * (plague ? 1.5 : 1), life, max:life, tick:0, dps:ps.dps, seed:Math.random() * TAU});
      if(g.puddles.length > 48) g.puddles.shift();
    }
  }
  for(const pd of g.puddles){
    pd.life -= dt; pd.tick -= dt;
    if(pd.tick <= 0){
      pd.tick = 0.25;
      query(pd.x, pd.y, pd.r + 45, tmpA);
      for(const e of tmpA) if(Math.hypot(e.x - pd.x, e.y - pd.y) < pd.r + e.r){ HITFROM = e; hitEnemy(e, pd.dps * 0.25, 'poison'); HITFROM = null; }
    }
  }
  g.puddles = g.puddles.filter(pd => pd.life > 0);

  for(const pr of g.projs){
    pr.px = pr.x; pr.py = pr.y; pr.life -= dt; pr.age += dt;
    if(pr.kind === 'boom'){
      const out = 0.5 * (g.combos.has('kite') ? 1.3 : 1);
      if(pr.age < out){ const k = 1 - pr.age / out; pr.x += pr.vx * dt * k; pr.y += pr.vy * dt * k; }
      else {
        const dx = p.x - pr.x, dy = p.y - pr.y, d = Math.hypot(dx, dy) || 1;
        pr.x += dx / d * 480 * dt; pr.y += dy / d * 480 * dt;
        if(d < 18) pr.life = 0;
      }
    } else { pr.x += pr.vx * dt; pr.y += pr.vy * dt; }
    if(g.dg && pr.kind !== 'boom' && pr.life > 0 && dgShotBlocked(g.dg.L, pr.x, pr.y)){ if(pr.kind === 'fire') explode(pr); else { pr.life = 0; burst(pr.x, pr.y, pr.color, 3, 80); } }
    if(pr.kind === 'fire' && Math.random() < .5 && g.parts.length < 600) g.parts.push({x:pr.x, y:pr.y, vx:rand(-30, 30), vy:rand(-30, 30), life:.35, max:.35, c:'#ff8a3d', s:rand(2, 4)});
    if(pr.life <= 0) continue;
    query(pr.x, pr.y, pr.r + 45, tmpA);
    HITFROM = {x:pr.px - (pr.x - pr.px) * 6, y:pr.py - (pr.y - pr.py) * 6};
    for(const e of tmpA){
      if(e.dead) continue;
      const rr = e.r + pr.r;
      if((e.x - pr.x) ** 2 + (e.y - pr.y) ** 2 >= rr * rr) continue;
      if(pr.kind === 'boom'){
        const last = pr.hits.get(e);
        if(last !== undefined && g.t - last < 0.3) continue;
        pr.hits.set(e, g.t); hitEnemy(e, pr.dmg, pr.src);
      } else if(pr.kind === 'fire'){
        explode(pr); break;
      } else {
        if(pr.hits.has(e)) continue;
        pr.hits.add(e); hitEnemy(e, pr.dmg, pr.src);
        if(pr.pierce-- <= 0){ pr.life = 0; break; }
      }
    }
    if(pr.kind === 'fire' && pr.life <= 0) explode(pr);
  }
  HITFROM = null;
  g.projs = g.projs.filter(pr => pr.life > 0);
  g.enemies = g.enemies.filter(e => !e.dead);

  for(const gm of g.gems){
    const dx = p.x - gm.x, dy = p.y - gm.y, d = Math.hypot(dx, dy) || 1;
    if(gm.mag || d < s.pickup){
      gm.mag = true;
      const sp = (460 + (g.won ? 500 : 0)) * dt;
      gm.x += dx / d * Math.min(d, sp); gm.y += dy / d * Math.min(d, sp);
      if(d < p.r + 8){
        gm.taken = true;
        g.gemC = g.t - (g.gemT || -9) < .35 ? Math.min(30, (g.gemC || 0) + 1) : 0; g.gemT = g.t;
        sfx('gem', 1 + g.gemC * .025);
        addXp(gm.v);
      }
    }
  }
  g.gems = g.gems.filter(gm => !gm.taken);
  for(const pk of g.pickups){
    pk.t += dt;
    if(!pk.taken && Math.hypot(pk.x - p.x, pk.y - p.y) < p.r + 16){ pk.taken = true; collectPickup(pk); }
  }
  g.pickups = g.pickups.filter(pk => !pk.taken);

  const fr = Math.exp(-4 * dt);
  for(const q of g.parts){ q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= fr; q.vy *= fr; q.life -= dt; }
  g.parts = g.parts.filter(q => q.life > 0);
  for(const f of g.fx) f.life -= dt;
  g.fx = g.fx.filter(f => f.life > 0);
  for(const t of g.texts){ t.life -= dt; t.y -= (t.kind === 2 ? 26 : 38) * dt; }
  g.texts = g.texts.filter(t => t.life > 0);

  if(g.won){ g.endT -= dt; if(g.endT <= 0) endRun(true); }
}

/* =====================================================================
   LEVELING
   ===================================================================== */
function addXp(v){
  const chainBonus = Math.min(0.5, Math.floor(G.chain / 10) * 0.01);
  G.xp += v * G.s.xpMul * (1 + chainBonus);
  while(G.xp >= G.xpNeed){
    G.xp -= G.xpNeed; G.level++; G.xpNeed = needXp(G.level); G.pendingLevels++;
  }
  if((G.pendingLevels > 0 || G.pendingTreasure > 0) && G.state === 'play' && !G.won){ sfx('levelup'); openLevelUp(); }
}

const FMT = {
  int: v => String(Math.round(v)),
  '1': v => (Math.round(v * 10) / 10).toFixed(1),
  s: v => v.toFixed(2) + 's',
  yes: v => v ? 'Yes' : 'No',
  pct: v => '+' + Math.round(v) + '%',
  mpct: v => '−' + Math.round(v) + '%',
  hp: v => (Math.round(v * 100) / 100) + '/s',
  x: v => '×' + (v / 100).toFixed(2),
};
const COUNT_KEYS = ['n','count','pierce','back'];
function diffLines(def, L){
  const a = def.lv(L), b = def.lv(L + 1), out = [];
  for(const [k, label, f] of def.show){
    const fa = FMT[f](a[k]), fb = FMT[f](b[k]);
    if(fa !== fb) out.push({label, a:fa, b:fb, star:COUNT_KEYS.includes(k) || (a[k] === 0 && b[k] > 0)});
  }
  return out;
}

function levelOptions(n){
  const opts = [];
  const wid = CHARACTERS[G.char].weapon, w = WEAPONS[wid];
  if(G.weaponLvl < MAX_LV.weapon) opts.push({w:3, cls:'weapon', icon:wid, kind:'Weapon', name:w.name, from:G.weaponLvl, max:MAX_LV.weapon,
    lines:diffLines(w, G.weaponLvl), apply:() => { G.weaponLvl++; }});
  for(const id in G.ab){
    if(G.ab[id] >= MAX_LV.ability) continue;
    const it = ITEMS[id];
    opts.push({w:3, cls:'ability', icon:id, kind:'Ability', name:it.name, from:G.ab[id], max:MAX_LV.ability,
      lines:diffLines(it, G.ab[id]), apply:() => { G.ab[id]++; }});
  }
  for(const id in G.pos){
    if(G.pos[id] >= MAX_LV.pos) continue;
    const it = ITEMS[id];
    opts.push({w:2, cls:'pos', icon:id, kind:'Positive trait', name:it.name, from:G.pos[id], max:MAX_LV.pos,
      lines:diffLines(it, G.pos[id]), apply:() => { G.pos[id]++; recalcStats(); }});
  }
  for(const id in G.neg){
    const m = G.neg[id];
    if(m >= MAX_LV.neg) continue;
    const it = ITEMS[id], f = 1 - m / MAX_LV.neg, f2 = 1 - (m + 1) / MAX_LV.neg;
    opts.push({w:1.3, cls:'neg', icon:id, kind:'Overcome', name:'Overcome ' + it.name, from:m, max:MAX_LV.neg,
      lines:[{wide:true, a:it.pen(f), b:f2 > 0 ? it.pen(f2) : 'Penalty gone', star:f2 === 0}],
      apply:() => { G.neg[id]++; recalcStats(); }});
  }
  const picked = [];
  while(picked.length < n && opts.length){
    let tot = 0; for(const o of opts) tot += o.w;
    let r = Math.random() * tot, i = 0;
    for(; i < opts.length - 1; i++){ r -= opts[i].w; if(r <= 0) break; }
    picked.push(opts.splice(i, 1)[0]);
  }
  if(picked.length < n) picked.push({cls:'item', icon:'heart', kind:'Item', name:'Heal', lines:[{label:'Recover', a:'', b:'30% HP'}],
    apply:() => { G.p.hp = Math.min(G.p.maxHp, G.p.hp + G.p.maxHp * 0.3); }});
  if(picked.length < n) picked.push({cls:'item', icon:'coin', kind:'Item', name:'Coins', lines:[{label:'Gain', a:'', b:'+10 coins'}],
    apply:() => { G.bonusCoins += 10; }});
  return picked;
}

function pipsHtml(from, max){
  let h = '';
  for(let i = 1; i <= max; i++) h += `<i class="${i <= from ? 'f' : i === from + 1 ? 'n' : ''}"></i>`;
  return `<div class="pips">${h}<span>${from} → ${from + 1} / ${max}</span></div>`;
}
function optCard(o, i){
  const lines = o.lines.map(l => l.wide
    ? `<div class="wide ${l.star ? 'star' : ''}"><span>${esc(l.a)}</span><b>→ ${esc(l.b)}</b></div>`

  return `<button class="choice c-${o.cls}" data-pick="${i}" style="animation-delay:${i * 70}ms">
    <span class="ck">${i + 1}</span><span class="cic">${ico(o.icon)}</span><span class="ckind">${o.kind}</span><span class="cname">${esc(o.name)}</span>
    ${o.max ? pipsHtml(o.from, o.max) : ''}<div class="clines">${lines}</div></button>`;
}
function openLevelUp(){

  G.state = 'levelup';
  joy.active = false; joy.dx = joy.dy = 0;

function pickOption(i){

  renderIcons();
  const col = {weapon:'#38e1ff', ability:'#ffb23d', pos:'#3dffa8', neg:'#ff4f7b', item:'#ffd84a'}[o.cls] || '#ffffff';
  G.fx.push({type:'ring', x:G.p.x, y:G.p.y, r:10, maxR:120, life:0.45, max:0.45, color:col, fill:true});
  burst(G.p.x, G.p.y, col, 22, 260);
  G.flash = 0.12;
  if(G.pendingLevels + G.pendingTreasure > 0) openLevelUp();
  else { modal.hidden = true; G.state = 'play'; }
}

function togglePause(){
  if(G.state === 'play'){
    G.state = 'paused';
    const rows = [];
    const wid = CHARACTERS[G.char].weapon;
    rows.push(`${ico(wid)} ${WEAPONS[wid].name} Lv ${G.weaponLvl}`);
    for(const id in G.ab) rows.push(`${ico(id)} ${ITEMS[id].name} Lv ${G.ab[id]}`);
    for(const id in G.pos) rows.push(`${ico(id)} ${ITEMS[id].name} Lv ${G.pos[id]}`);
    for(const id in G.neg){ const f = 1 - G.neg[id] / MAX_LV.neg; rows.push(`${ico(id)} ${f > 0 ? ITEMS[id].pen(f) : ITEMS[id].name + ' overcome'}`); }
    mbox.className = 'mbox';
    mbox.innerHTML = `<h2>Paused</h2><p class="mnote">${G.stage.name} · ${fmtTime(G.t)} · Level ${G.level} · ${G.kills} kills</p>
      <div class="lbl">Your build</div><div class="tchips">${rows.map(r => `<span class="tc static">${r}</span>`).join('')}</div>
      ${G.combos.size ? '<div class="lbl" style="margin-top:12px">Combos</div>' + [...G.combos].map(id => { const c = COMBOS.find(x => x.id === id); return `<div class="cmb"><b>${ico('spark')} ${c.name}</b>${c.desc}</div>`; }).join('') : ''}
      <details class="pset"><summary class="lbl" style="margin-top:14px;cursor:pointer">Sound</summary>${volumeHtml()}</details>
      <div class="mfoot"><button class="btn ghost" data-act="quit">${G.dg ? 'Give up (lose what you carry)' : 'Give up'}</button><button class="btn hot" data-act="resume">${ico('play')} Resume</button></div>`;
    modal.hidden = false;
    setDuck(true);
  } else if(G.state === 'paused'){
    G.state = 'play';
    modal.hidden = true;
    setDuck(false);
  }
}

}

/* =====================================================================
   RENDER
   ===================================================================== */
function drawBlade(bx, by, a){
  addGlow('#8fb8ff', bx, by, 20, .7);
  ctx.save(); ctx.translate(bx, by); ctx.rotate(a + Math.PI / 2);
  ctx.fillStyle = '#e6eeff'; ctx.strokeStyle = '#5a76b8'; ctx.lineWidth = 1.2;
  pts([[0, -14], [5, -2], [0, 14], [-5, -2]]); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,118,184,.8)'; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 11); ctx.stroke();
  ctx.restore();
}
function drawParts(list){
  for(const q of list){
    const k = q.life / q.max, s = q.s * (0.4 + k);
    ctx.globalAlpha = Math.min(1, k * 1.5); ctx.fillStyle = q.c;
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

function render(now){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(!G){
    if(!titleEl.hidden){ if(!tdemoFrame(now)) renderDemo(); } else renderBackdrop(now);
    return;
  }
  if(G.dg){ dgRender(now); return; }
  const g = G, p = g.p, st = g.stage, t = g.t;
  ctx.fillStyle = '#090b18'; ctx.fillRect(0, 0, W, H);
  const sh = REDUCED ? 0 : Math.min(14, g.shake * 36);
  ctx.save();
  ctx.translate(W / 2 + rand(-sh, sh), H / 2 + rand(-sh, sh));
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-p.x, -p.y);
  const hw = W / 2 / ZOOM + 80, hh = H / 2 / ZOOM + 80;
  const inView = (x, y) => Math.abs(x - p.x) < hw && Math.abs(y - p.y) < hh;
  drawWorld(st, p.x, p.y, hw, hh, t);

  // pickup radius hint
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1; ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(p.x, p.y, g.s.pickup, 0, TAU); ctx.stroke(); ctx.setLineDash([]);

  // poison puddles
  for(const pd of g.puddles){
    const k = Math.min(1, pd.life / pd.max * 2);
    ell(pd.x, pd.y, pd.r, pd.r * .75, pd.seed, `rgba(60,170,40,${.35 * k})`);
    addGlow('#7dff6a', pd.x, pd.y, pd.r * 1.3, .35 * k);
    dot(pd.x + Math.cos(pd.seed + t * 3) * pd.r * .4, pd.y + Math.sin(pd.seed * 2 + t * 2) * pd.r * .3, 2.5, `rgba(200,255,170,${.7 * k})`);
  }
  // gems
  ctx.globalCompositeOperation = 'lighter';
  for(const gm of g.gems){
    if(!inView(gm.x, gm.y)) continue;
    drawGlow(gm.v >= 10 ? '#ff5ce1' : gm.v >= 3 ? '#3dffa8' : '#38e1ff', gm.x, gm.y, gm.v >= 10 ? 16 : 11, .7);
  }
  ctx.globalCompositeOperation = 'source-over';
  for(const gm of g.gems){
    if(!inView(gm.x, gm.y)) continue;
    const r = gm.v >= 10 ? 6.5 : gm.v >= 3 ? 5 : 3.8;
    ctx.fillStyle = gm.v >= 10 ? '#ffc4f5' : gm.v >= 3 ? '#c4ffe6' : '#c8f6ff';
    pts([[gm.x, gm.y - r * 1.3], [gm.x + r, gm.y], [gm.x, gm.y + r * 1.3], [gm.x - r, gm.y]]); ctx.fill();
  }
  // pickups
  for(const pk of g.pickups){
    if(!inView(pk.x, pk.y)) continue;
    const by = pk.y + Math.sin(pk.t * 4) * 4, col = PICKUPS[pk.kind];
    addGlow(col, pk.x, by, 32, .6 + .25 * Math.sin(pk.t * 6));
    dot(pk.x, by, 13, 'rgba(9,11,24,.85)');
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pk.x, by, 13, 0, TAU); ctx.stroke();
    drawIcon(pk.kind, pk.x, by, 17, '#ffffff', 2.4);
  }

  drawHazards(false);
  // enemies
  for(const e of g.enemies) if(inView(e.x, e.y)) drawEnemy(e, t, p.x, p.y);
  drawHazards(true);

  // projectiles (glow pass, then cores)
  ctx.globalCompositeOperation = 'lighter';
  for(const b of g.ebullets) drawGlow(b.color, b.x, b.y, 18, .9);
  for(const pr of g.projs){
    if(pr.kind === 'fire') drawGlow(pr.color, pr.x, pr.y, 32, .95);
    else if(pr.kind === 'boom') drawGlow(pr.color, pr.x, pr.y, 26, .55);
    else {
      drawGlow(pr.color, pr.x, pr.y, 16, .9);
      ctx.strokeStyle = hexA(pr.color, .55); ctx.lineWidth = pr.r * 1.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(pr.x, pr.y); ctx.lineTo(pr.x - pr.vx * .045, pr.y - pr.vy * .045); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for(const b of g.ebullets){ dot(b.x, b.y, b.r * .75, '#ffffff'); }
  for(const pr of g.projs){
    if(pr.kind === 'boom'){
      ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.age * 18);
      ctx.fillStyle = '#fff4c4'; ctx.strokeStyle = '#a07a2a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-pr.r, -3); ctx.quadraticCurveTo(0, -pr.r * .9, pr.r, -3); ctx.lineTo(pr.r * .6, 3); ctx.quadraticCurveTo(0, -pr.r * .3, -pr.r * .6, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if(pr.kind === 'fire'){
      dot(pr.x, pr.y, pr.r * .9, '#ffd08a'); dot(pr.x, pr.y, pr.r * .5, '#ffffff');
    } else {
      const a = Math.atan2(pr.vy, pr.vx);
      ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(a);
      ctx.fillStyle = '#ffffff'; pts([[pr.r * 1.6, 0], [0, -pr.r * .55], [-pr.r * 1.2, 0], [0, pr.r * .55]]); ctx.fill();
      ctx.restore();
    }
  }

  // orbit blades & drones
  if(g.ab.orbit){
    const os = abS('orbit'), n = os.n + (g.combos.has('closeq') ? 1 : 0);
    for(let i = 0; i < n; i++){ const a = g.orbA + i / n * TAU; drawBlade(p.x + Math.cos(a) * orbitRad(), p.y + Math.sin(a) * orbitRad(), a); }
  }
  if(g.ab.drone){
    const n = abS('drone').n;
    for(let i = 0; i < n; i++){
      const a = g.droneA + i / n * TAU, dx = p.x + Math.cos(a) * 48, dy = p.y + Math.sin(a) * 48;
      addGlow('#6dffc4', dx, dy, 16, .8);
      ctx.save(); ctx.translate(dx, dy); ctx.rotate(t * 2 + i);
      ctx.fillStyle = '#3a4a5c'; ctx.beginPath(); polyPath(0, 0, 7, 3, 0); ctx.fill();
      ctx.strokeStyle = '#a8ffe0'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      dot(dx, dy, 2.2, '#e0fff2');
    }
  }

  // player
  const pc = CHARACTERS[g.char].color;
  ctx.globalCompositeOperation = 'lighter';
  p.trail.forEach((q, i) => drawGlow(pc, q.x, q.y, 10 + i, .05 * i));
  drawGlow(pc, p.x, p.y, 46, .45);
  ctx.globalCompositeOperation = 'source-over';
  if(g.state !== 'over') drawHero(g.char, p.x, p.y, 13, Math.atan2(p.fy, p.fx), t, p.inv > 0 && Math.floor(p.inv * 20) % 2);
  if(p.shield){ ctx.strokeStyle = 'rgba(56,225,255,.85)'; ctx.lineWidth = 2.5; ctx.beginPath(); polyPath(p.x, p.y, p.r + 14, 6, t); ctx.stroke(); }
  if(p.slowT > 0){ ctx.strokeStyle = 'rgba(160,230,255,.8)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 9, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
  if(g.pos.berserker && p.hp / p.maxHp < g.s.berserkThr){
    ctx.strokeStyle = 'rgba(255,60,60,.75)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 18 + Math.sin(t * 12) * 2, 0, TAU); ctx.stroke();
  }

  // effects
  ctx.globalCompositeOperation = 'lighter';
  for(const f of g.fx){
    const k = Math.max(0, f.life / f.max);
    if(f.type === 'ring'){
      const r = f.maxR - (f.maxR - f.r) * k;
      if(f.fill){ ctx.globalAlpha = k * .22; ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2 + 5 * k;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.stroke();
    } else if(f.type === 'lob'){
      const q = 1 - k, x = f.x0 + (f.x - f.x0) * q, y = f.y0 + (f.y - f.y0) * q - Math.sin(q * Math.PI) * 140;
      ctx.globalAlpha = 1; drawGlow(f.color, x, y, 18, .9); dot(x, y, 6, '#ffffff');
    } else if(f.type === 'frost'){
      ctx.globalAlpha = k; ctx.strokeStyle = f.color; ctx.lineWidth = 2;
      const r = f.r * (1.05 - k * .3);
      ctx.beginPath();
      for(let i = 0; i < 12; i++){ const a = i / 12 * TAU; ctx.moveTo(f.x + Math.cos(a) * r * .55, f.y + Math.sin(a) * r * .55); ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r);
        ctx.moveTo(f.x + Math.cos(a) * r * .8, f.y + Math.sin(a) * r * .8); ctx.lineTo(f.x + Math.cos(a + .08) * r * .9, f.y + Math.sin(a + .08) * r * .9); }
      ctx.stroke();
    } else if(f.type === 'arc'){
      ctx.globalAlpha = k * .7; ctx.fillStyle = f.color;
      const sw = (1 - k) * .3, a0 = f.dir - Math.PI / 3 + sw, a1 = f.dir + Math.PI / 3 + sw;
      ctx.beginPath(); ctx.arc(p.x, p.y, f.r, a0, a1); ctx.arc(p.x, p.y, f.r * .55, a1, a0, true); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = k; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, f.r, a0, a1); ctx.stroke();
    } else if(f.type === 'bolt'){
      const ptsL = [[f.x0, f.y0]];
      for(let i = 1; i < 7; i++){ const q = i / 7; ptsL.push([f.x0 + (f.x - f.x0) * q + rand(-14, 14), f.y0 + (f.y - f.y0) * q + rand(-6, 6)]); }
      ptsL.push([f.x, f.y]);
      for(const [lw, col, al] of [[9, f.color, .35], [3, '#ffffff', 1]]){
        ctx.globalAlpha = k * al; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round';
        ctx.beginPath(); ptsL.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  drawParts(g.parts);
  ctx.globalCompositeOperation = 'source-over';

  // damage numbers
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for(const tx of g.texts){
    const k = tx.life / tx.max, pop = 1 + Math.max(0, (k - .75) / .25) * .6;
    ctx.globalAlpha = Math.min(1, k * 2.5);
    const size = (tx.kind === 1 ? 19 : tx.kind === 2 ? 20 : 13) * pop;
    ctx.font = `700 ${size}px "Chakra Petch", system-ui, sans-serif`;
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 3;
    const txt = tx.kind === 1 ? tx.txt + '!' : String(tx.txt);
    ctx.strokeText(txt, tx.x, tx.y);
    ctx.fillStyle = tx.kind === 1 ? '#ffc23d' : '#f2f4ff';
    ctx.fillText(txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // screen-space overlays
  drawMotes(st, p.x, p.y, t);
  ctx.drawImage(vignette, 0, 0, W, H);
  if(isFinite(g.s.vision)){
    const v = g.s.vision * ZOOM;
    const grd = ctx.createRadialGradient(W / 2, H / 2, v * .55, W / 2, H / 2, v);
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(2,6,4,0.96)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  }
  const hpR = p.hp / p.maxHp;
  if(hpR < .35 && g.state !== 'over'){
    const a = (.35 - hpR) / .35 * (.35 + .15 * Math.sin(now / 160));
    const grd = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) / 2);
    grd.addColorStop(0, 'rgba(255,30,70,0)'); grd.addColorStop(1, `rgba(255,30,70,${a})`);
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  }
  if(g.flash > 0){ ctx.fillStyle = `rgba(255,255,255,${Math.min(.5, g.flash * 1.6)})`; ctx.fillRect(0, 0, W, H); }

  if(joy.active){
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, TAU); ctx.stroke();
    dot(joy.ox + joy.dx * 50, joy.oy + joy.dy * 50, 18, 'rgba(255,255,255,.35)');
  }
}

/* ---------- dungeon: map parsing, collisions and pathing ---------- */
function dgParse(def){
  const rows = def.map.split('\n').filter(r => r.trim().length);

    switch(c){
      case '#': t = TT.WALL; break;
      case '.': break;
      case ',': L.moss[i] = 1; break;
      case '~': t = TT.PIT; break;
      case 'm': t = TT.POOL; break;
      case 'c': t = TT.CRUMBLE; break;
      case 'w': t = TT.WEB; break;
      case 'u': t = TT.STAIR; break;
      case 'p': case 'r': case 'k': case 'o': t = TT.PROP; L.prop[i] = c.charCodeAt(0); L.props.push({x, y, kind:c}); break;
      case 'L': t = TT.PROP; L.prop[i] = c.charCodeAt(0); L.props.push({x, y, kind:c}); L.lanterns.push({x, y, i, lit:false}); break;
      case 'V': case 'Q': t = TT.PROP; L.prop[i] = c.charCodeAt(0); L.props.push({x, y, kind:c}); L.sites.push({x, y, i}); break;   // valve, pump
      case 'M': t = TT.PROP; L.prop[i] = c.charCodeAt(0); L.props.push({x, y, kind:c}); z = 10; break;                          // a mast on the wreck
      case 'N': L.sites.push({x, y, i}); break;                                                                                // a brood clutch
      case 'h': L.deck[i] = 1; z = 10; break;                                                                                  // ship deck (boss zone)
      case 'd': t = TT.DEEP; break;
      case 'g': t = TT.SLICK; break;
      case 'l': L.low[i] = 1; break;
      case '>': case '<': case 'v': case '^': t = TT.CURRENT; L.cur[i] = '><v^'.indexOf(c); break;
      case '=': t = TT.GATE; L.gates.push({x, y, i, zones:[], open:true, h:0}); break;
      case 'P': L.start = {x, y}; break;
      case '$': L.chests.push({x, y, open:false, t:0}); break;
      case 'b': z = 10; break;
      case 'B': z = 10; L.boss = {x, y}; break;
      case 'X': z = 10; L.exit = {x, y}; break;

function dgFlow(){

  Object.assign(D, {floor:n, def, L, flow:new Int16Array(N), flowKey:-1, flowDirty:true, q:new Int32Array(N), seen:new Uint8Array(N), seenT:0,
    mapDirty:true, crumble:new Map(), trickT:25, zones:{}, portal:null, bossQ:null, objective:'', safe:null, chainBoss:false});
  for(const k of L.zoneIds){ const zd = def.zones && def.zones[k]; D.zones[k] = {id:k, state:'idle', boss:k === 10, boss2:!!(zd && zd.boss2), waves:k === 10 || !zd ? null : zd.waves || null, wi:0, wait:0, alive:0}; }
  for(const k of ['enemies','projs','ebullets','gems','pickups','puddles','fx','parts','texts','hazards']) G[k] = [];
  G.boss = null; $('#bossbar').hidden = true;
  G.stage.hpMul = def.hpMul;
  G.stage.name = `${dgThemeOf(n).name} · Floor ${n}`;
  const p = G.p;
  p.x = (L.start.x + .5) * DT; p.y = (L.start.y + .5) * DT; p.vx = p.vy = 0; p.fx = 0; p.fy = -1; p.trail.length = 0;
  p.rootT = 0; p.poisonT = 0; p.poisonDps = 0;
  D.safe = {x:p.x, y:p.y};
  dgSkillsFloor();
  dgResetBuild();
  dgDistField();
  dgWaterInit();
  dgObjInit();
  G.state = 'play';
  d3BuildLevel();
  setMusic(dgThemeOf(n).song, 0); setDuck(false);
  const hs = skV('headstart');
  showBanner(`FLOOR ${n}`, '', n > D.start ? `${def.name} · back to level ${1 + hs}` : def.name);
  dgObjective();
  // Head Start: the first level-ups are waiting for you as the floor begins
  if(hs){ for(let i = 0; i < hs; i++){ G.level++; G.pendingLevels++; G.xpNeed = needXp(G.level); } G.xp = 0; sfx('levelup'); openLevelUp(); }
}
// every floor starts from your bare loadout: level 1, every upgrade back to Lv 1, full HP
function dgResetBuild(){
  const g = G, p = g.p;
  g.level = 1; g.xp = 0; g.xpNeed = needXp(1); g.pendingLevels = 0; g.pendingTreasure = 0;
  g.weaponLvl = 1;
  for(const id in g.ab) g.ab[id] = 1;
  for(const id in g.pos) g.pos[id] = 1;
  for(const id in g.neg) g.neg[id] = 0;
  g.rerolls = 2 + (g.combos.has('gambler') ? 3 : 0);
  g.cd = {}; g.frenzy = 0; g.frenzyT = 0; g.revived = false; g.chain = 0; g.chainT = 0;
  p.maxHp = 0; recalcStats(); p.hp = p.maxHp;
  p.shield = !!g.ab.shield; p.shieldT = 0; p.inv = 1; p.slowT = 0; p.webT = 0;

}
function dgSpot(cx, cy, rad){
  const L = G.dg.L;
  for(let k = 0; k < 14; k++){
    const a = Math.random() * TAU, r = Math.random() * rad, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if(!dgWalkBlocked(L, Math.floor(x / DT), Math.floor(y / DT))) return [x, y];
  }
  return [cx, cy];
}
// n spots around (cx, cy) on open floor in sight of the centre (so they stay in the same room),
// at least `gap` apart and, when possible, not right next to you
function dgSpread(cx, cy, n, gap){
  const L = G.dg.L, p = G.p, out = [], rad = Math.max(150, Math.sqrt(n) * 78);
  let g = gap;
  for(let i = 0; i < n; i++){
    let spot = null;
    for(let k = 0; k < 40 && !spot; k++){
      if(k && k % 12 === 0) g *= .8;
      const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * rad, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      const tx = Math.floor(x / DT), ty = Math.floor(y / DT);
      if(dgWalkBlocked(L, tx, ty) || L.t[ty * L.W + tx] === TT.POOL || L.z[ty * L.W + tx]) continue;
      if(!dgLos(cx, cy, x, y)) continue;
      if(k < 30 && Math.hypot(x - p.x, y - p.y) < 230) continue;
      if(out.some(o => Math.hypot(o[0] - x, o[1] - y) < g)) continue;
      spot = [x, y];
    }
    out.push(spot || dgSpot(cx, cy, 60));
  }
  return out;
}
function dgSpawn(type, x, y, elite, zone){
  if(G.enemies.length >= MAX_ENEMIES) return null;
  spawnEnemy(type, x, y, elite);
  const e = G.enemies[G.enemies.length - 1];
  e.rise = e.riseMax = .75; e.zone = zone || 0; e.xp *= G.dg.def.xpMul;
  // enemies get tougher (and a little bigger) the farther they are from the start
  const k = dgFar(x, y), s = DG_DIST.near + (DG_DIST.far - DG_DIST.near) * k;
  e.pow = 1; e.vis = .92 + .3 * k;
  if(type !== 'egg'){ e.hp *= DG_MOB.hp * s; e.maxHp = e.hp; e.dmg *= DG_MOB.dmg * s; e.pow = DG_MOB.dmg * s; e.xp *= .85 + 1.15 * k; }   // and pay up to twice the XP
  dgCollide(e, e.r);
  if(G.parts.length < 600) burst(e.x, e.y, '#9a8a6a', 5, 110);
  return e;
}
function dgSpawnGroup(comp, cx, cy, zone){
  const list = [];
  if(comp.elite) list.push([comp.elite, true]);
  for(const type in comp){ if(type !== 'elite') for(let i = 0; i < comp[type]; i++) list.push([type, false]); }
  const spots = list.length === 1 && ENEMIES[list[0][0]] && ENEMIES[list[0][0]].fixed ? [[cx, cy]] : dgSpread(cx, cy, list.length, 62);
  list.forEach(([type, elite], i) => dgSpawn(type, spots[i][0], spots[i][1], elite, zone));
  if(comp.elite){ showBanner('ELITE', 'elite', 'It carries a relic. Defeat it'); sfx('elite'); }
}
function dgPickMix(mix){
  let tot = 0; for(const k in mix) tot += mix[k];
  let r = Math.random() * tot;
  for(const k in mix){ r -= mix[k]; if(r <= 0) return k; }
  return Object.keys(mix)[0];
}
function dgActiveZone(){ for(const k in G.dg.zones){ const Z = G.dg.zones[k]; if(Z.state === 'active' && Z.waves) return Z; } return null; }

function dgTick(dt){
  const D = G.dg, L = D.L, p = G.p, def = D.def;
  dgFlow();
  const ptx = Math.floor(p.x / DT), pty = Math.floor(p.y / DT), pi = pty * L.W + ptx, pt = L.t[pi];
  D.seenT -= dt;
  if(D.seenT <= 0){
    D.seenT = .15;
    for(let y = pty - 7; y <= pty + 7; y++) for(let x = ptx - 7; x <= ptx + 7; x++){
      if(x < 0 || y < 0 || x >= L.W || y >= L.H || (x - ptx) ** 2 + (y - pty) ** 2 > 50) continue;
      const i = y * L.W + x;
      if(!D.seen[i]){ D.seen[i] = 1; D.mapDirty = true; }
    }
  }
  if(pt === TT.POOL){ p.poisonT = Math.max(p.poisonT, .6); p.poisonDps = Math.max(p.poisonDps, 3 + D.floor); }
  if(pt === TT.CRUMBLE && !D.crumble.has(pi)){ D.crumble.set(pi, .75); sfx('crack'); }
  for(const [i, t] of D.crumble){ if(t - dt <= 0){ D.crumble.delete(i); dgCollapse(i); } else D.crumble.set(i, t - dt); }
  if(G.state !== 'play') return;
  if(pt !== TT.CRUMBLE && dgWalkable(pt)) D.safe = {x:(ptx + .5) * DT, y:(pty + .5) * DT};
  if(p.poisonT > 0){ p.poisonT -= dt; if(p.hp > 1) p.hp = Math.max(1, p.hp - p.poisonDps * dt); if(p.poisonT <= 0) p.poisonDps = 0; }
  for(const pk of L.packs){
    if(pk.done) continue;
    const fd = D.flow[pk.y * L.W + pk.x], dd = Math.hypot((pk.x + .5) * DT - p.x, (pk.y + .5) * DT - p.y);
    if((fd >= 0 && fd <= 9) || dd < 5 * DT){ pk.done = true; const PK = def.packs || DG_PACKS, comp = PK[pk.kind].make(D.floor); if(pk.elite) comp.elite = PK[pk.kind].elite; dgSpawnGroup(comp, (pk.x + .5) * DT, (pk.y + .5) * DT, 0); }
  }
  for(const c of L.chests) if(!c.open && Math.hypot((c.x + .5) * DT - p.x, (c.y + .5) * DT - p.y) < 42){ dgOpenChest(c); if(G.state !== 'play') return; }
  dgZones(dt, pi);
  dgWaterTick(dt);
  dgObjTick(dt);
  dgHunterTick(dt);
  const bb = G.boss;
  if(bb && bb.recoil && bb.recoil.t > 0 && !bb.noTouch){ bb.recoil.t -= dt; bb.x += bb.recoil.x * 380 * dt; bb.y += bb.recoil.y * 380 * dt; dgCollide(bb, bb.r); }
  if(D.bossQ){ D.bossQ.t -= dt; if(D.bossQ.t <= 0){ const q = D.bossQ; D.bossQ = null; dgSpawnBoss(q.skin, q.hp, q.second); } }
  if(def.trickle && !G.boss && !D.bossQ && !dgActiveZone() && !D.portal){
    D.trickT -= dt;
    if(D.trickT <= 0){ D.trickT = def.trickle.every; dgTrickle(); }
  }
  if(D.portal){
    D.portal.t += dt;
    if(D.portal.t > .8 && Math.hypot(D.portal.x - p.x, D.portal.y - p.y) < 48) dgFloorClear();
  }
}
function dgNearGate(i){
  const L = G.dg.L;
  for(const [dx, dy] of N8){ const j = i + dy * L.W + dx; if(j >= 0 && j < L.t.length && L.t[j] === TT.GATE) return true; }
  return false;
}
function dgSetGate(g, open){
  const D = G.dg;
  if(g.open === open) return;
  g.open = open; D.L.closed[g.i] = open ? 0 : 1; D.flowDirty = true; D.mapDirty = true;
}
function dgZones(dt, pi){
  const D = G.dg, L = D.L, pz = L.z[pi];
  if(pz && D.zones[pz] && D.zones[pz].state === 'idle' && !dgNearGate(pi)) dgTrigger(D.zones[pz]);
  for(const k in D.zones){
    const Z = D.zones[k];
    if(Z.state !== 'active' || !Z.waves) continue;
    let alive = 0;
    for(const e of G.enemies) if(!e.dead && e.zone === Z.id) alive++;
    Z.alive = alive;
    if(Z.wi < Z.waves.length){
      const prev = Z.wi ? Z.waves[Z.wi - 1] : null;
      let size = 0; if(prev) for(const t in prev) size += t === 'elite' ? 1 : prev[t];
      if(alive <= Math.floor(size * .2)){ Z.wait -= dt; if(Z.wait <= 0){ dgSpawnWave(Z); Z.wait = 1.4; } }
    } else if(alive === 0) dgClearZone(Z);
  }
}
function dgTrigger(Z){
  const D = G.dg, L = D.L;
  Z.state = 'active';
  for(const g of L.gates) if(g.zones.includes(Z.id)) dgSetGate(g, false);
  G.shake = .3; sfx('gate');
  if(Z.boss){
    D.bossQ = {skin:D.def.boss, hp:D.def.bossHp, t:1.6};
    showBanner('THE GATE SLAMS SHUT', 'warn', `${SKINS[D.def.boss].name} awakens`); sfx('warning');
  } else if(Z.boss2){
    D.bossQ = {skin:D.def.boss2, hp:D.def.boss2Hp, t:2.2, second:true};
    showBanner('THE LAIR', 'warn', `${SKINS[D.def.boss2].name} stirs in its pool`); sfx('warning'); G.shake = .5;
  } else {
    Z.wait = .9;
    const n = Object.keys(D.zones).filter(k => +k !== 10).length;
    showBanner('AMBUSH', 'warn', `Section ${Z.id} of ${n} · the gates are sealed`); sfx('swarm');
  }
  dgObjective();
}
function dgSpawnWave(Z){
  const D = G.dg, L = D.L, p = G.p, w = Z.waves[Z.wi], tiles = L.zoneTiles[Z.id];
  Z.wi++;
  const dry = Z.water ? tiles.filter(i => (Math.floor(i / L.W) + 1) * DT < Z.water.y - 20) : tiles;   // never spawn under rising water
  const far = dry.filter(i => Math.hypot((i % L.W + .5) * DT - p.x, (Math.floor(i / L.W) + .5) * DT - p.y) > 4 * DT);
  const pool = far.length ? far : dry.length ? dry : tiles;
  // spread the wave over the whole section, a little apart from each other
  const used = [];
  const spot = () => {
    let best = null;
    for(let k = 0; k < 16; k++){
      const i = pool[Math.floor(Math.random() * pool.length)], x = (i % L.W + .5) * DT + rand(-14, 14), y = (Math.floor(i / L.W) + .5) * DT + rand(-14, 14);
      const gap = used.reduce((m, o) => Math.min(m, Math.hypot(o[0] - x, o[1] - y)), 1e9);
      if(!best || gap > best[2]) best = [x, y, gap];
      if(gap >= 58) break;
    }
    used.push(best); return best;
  };
  for(const type in w){ if(type === 'elite') continue; for(let i = 0; i < w[type]; i++){ const s = spot(); dgSpawn(type, s[0], s[1], false, Z.id); } }
  if(w.elite){ const s = spot(); dgSpawn(w.elite, s[0], s[1], true, Z.id); sfx('elite'); }
  addText(p.x, p.y - 40, `WAVE ${Z.wi} / ${Z.waves.length}`, 2);
  dgObjective();
}
function dgClearZone(Z){
  const D = G.dg, L = D.L;
  Z.state = 'cleared';
  for(const g of L.gates) if(g.zones.includes(Z.id) && g.zones.some(z => D.zones[z] && D.zones[z].state === 'idle')) dgSetGate(g, true);
  if(!Z.boss){
    showBanner('SECTION CLEAR', 'elite', 'The gate ahead opens. The way back stays shut'); sfx('treasure');
    dropPickup('heart', G.p.x + rand(-30, 30), G.p.y - 60);
  }
  dgObjective();
}
function dgTrickle(){
  const D = G.dg, L = D.L, tr = D.def.trickle;
  if(G.enemies.filter(e => !e.dead).length > (tr.cap || 44) || !L.open.length) return;
  for(let k = 0; k < 40; k++){
    const i = L.open[Math.floor(Math.random() * L.open.length)], f = D.flow[i];
    if(f < 9 || f > 16) continue;
    const x = (i % L.W + .5) * DT, y = (Math.floor(i / L.W) + .5) * DT;
    for(const [sx, sy] of dgSpread(x, y, tr.n, 60)) dgSpawn(dgPickMix(tr.mix), sx, sy, false, 0);
    return;
  }

function dgCollapse(i){
  const D = G.dg, L = D.L, p = G.p;
  L.t[i] = TT.PIT; D.flowDirty = true; D.mapDirty = true;
  const x = (i % L.W + .5) * DT, y = (Math.floor(i / L.W) + .5) * DT;
  burst(x, y, '#8a7f6a', 12, 150); sfx('crumble');
  d3Collapse(i);
  if(tileAt(L, p.x, p.y) === i) dgFall();
  for(const e of G.enemies) if(!e.dead && !e.boss && tileAt(L, e.x, e.y) === i){ e.hp = 0; killEnemy(e); }

// falling into a pit costs HP but never kills; you climb back out where you last stood safely
function dgFall(){
  const D = G.dg, p = G.p, dmg = Math.round(p.maxHp * .12);
  p.hp = Math.max(1, p.hp - dmg);
  p.x = D.safe.x; p.y = D.safe.y; p.inv = Math.max(p.inv, 1.2);
  D.roll.t = 0;
  G.flash = .25; G.shake = .35; sfx('hurt');
  addText(p.x, p.y - 34, `FELL −${dmg}`, 2);
}
function dgMovePlayer(dt){
  const D = G.dg, L = D.L, p = G.p, R = D.roll;
  if(R.n < R.max){ R.cd -= dt; if(R.cd <= 0){ R.n++; R.cd = R.n < R.max ? D.rollCd : 0; } }   // rolls recharge one at a time
  if(p.tailT > 0) p.tailT -= dt;
  if(R.t > 0){ R.t -= dt; p.vx = R.dx * p.speed * D.rollSp; p.vy = R.dy * p.speed * D.rollSp; }
  else if(p.rootT > 0){ p.rootT -= dt; p.vx = p.vy = 0; }
  else {
    const t = L.t[tileAt(L, p.x, p.y)];
    if(p.webT > 0) p.webT -= dt;
    const m = t === TT.WEB || p.webT > 0 ? .55 : t === TT.POOL ? .7 : 1;
    const tw = p.tailT > 0 ? 1 + skV('tailwind') : 1;
    p.vx *= m * tw; p.vy *= m * tw;
    dgWaterMove(dt);
  }
  dgPullMove(dt);
  p.x += p.vx * dt; p.y += p.vy * dt;
  dgCurrentPush(p, dt);
  dgCollide(p, p.r);
}
function dgRoll(){
  if(!G || !G.dg || G.state !== 'play') return;
  const D = G.dg, p = G.p, R = D.roll;
  if(R.n <= 0 || R.t > 0) return;
  let dx = p.vx, dy = p.vy, l = Math.hypot(dx, dy);
  if(l < 5){ dx = p.fx; dy = p.fy; l = Math.hypot(dx, dy) || 1; }
  R.dx = dx / l; R.dy = dy / l; R.t = DG_ROLL.time; R.n--; if(R.cd <= 0) R.cd = D.rollCd; p.rootT = 0; p.pull = null;
  p.inv = Math.max(p.inv, DG_ROLL.time + .05 + skV('ghost'));
  if(skV('tailwind')) p.tailT = DG_ROLL.time + 1.5;

/* ---------- dungeon: distance from the start, water, currents, lanterns ---------- */
// walking distance from the start to every tile; enemies scale with it (see dgSpawn)
function dgDistField(){

  let h = 0, tl = 0, max = 1;

    const i = q[h++], x = i % L.W, y = (i - x) / L.W;

      const j = ny * L.W + nx, t = L.t[j];

// 0 at the start, 1 at the farthest point of the floor
function dgFar(x, y){
  const D = G.dg, L = D.L, i = tileAt(L, x, y), v = D.sdist ? D.sdist[i] : -1;

function dgWaterInit(){

// how deep the water is where (x, y) stands: 0 dry, 1 current or shallow flood, 2 deep

// rising water and a flooded arena hurt; plain deep water only slows you
function dgWaterHurts(x, y){

function dgWadeMul(e){

function dgWaterMove(dt){

  if(F && F.mode === 'cycle'){

function turnToward(a, b, max){ let d = (b - a) % TAU; if(d > Math.PI) d -= TAU; if(d < -Math.PI) d += TAU; return a + Math.max(-max, Math.min(max, d)); }

/* ---------- dungeon: enemy AI for the Flooded Aqueducts ---------- */
const DG_AI = {
